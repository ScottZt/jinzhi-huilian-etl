            placeholder: '支持小数，例如 0.5 表示 500 毫秒' },
          { id: 'mode', label: '模式', type: 'select',
            opts: [
              { value: 'delay', label: '固定延时' },
              { value: 'until_timestamp', label: '等待到指定时间戳' },
            ] },
          { id: 'target_timestamp', label: '目标时间戳（unix秒）', type: 'text',
            placeholder: 'mode=等待到指定时间戳 时填写',
            when: { field: 'mode', is: 'until_timestamp' } },
        ],
        try_catch: [
          { id: 'retry_times', label: '重试次数', type: 'number',
            placeholder: '失败后重试几次' },
          { id: 'retry_delay', label: '重试间隔(秒)', type: 'number',
            placeholder: '每次重试间隔多少秒' },
          { id: 'on_error', label: '失败后', type: 'select',
            opts: [
              { value: 'continue', label: '继续执行' },
              { value: 'abort', label: '终止工作流' },
              { value: 'fallback', label: '降级处理' },
            ] },
          { id: 'fallback_value', label: '降级值', type: 'text',
            placeholder: 'on_error=降级处理 时返回的值（JSON 格式）',
            when: { field: 'on_error', is: 'fallback' } },
        ],
        split_batches: [
          { id: 'batch_size', label: '批次大小', type: 'number', placeholder: '每个批次的数据行数' },
          { id: 'parallel', label: '并行处理', type: 'checkbox' },
          { id: 'max_parallel', label: '最大并行数', type: 'number', placeholder: '并行处理时的最大并发数',
            when: { field: 'parallel', is: 'true' } },
          { id: 'error_handling', label: '错误处理', type: 'select',
            opts: [
              { value: 'continue', label: '跳过错误批次' },
              { value: 'stop', label: '遇到错误停止' },
            ] },
          { type: 'info', text: '💡 将数据分成多个批次，对每个批次执行下游节点链。支持串行和并行处理。' },
        ],
      };

      const fields = schemas[type] || [];
      let html = '';
      for (const f of fields) {
        const val = params[f.id];
        // 高级字段始终渲染，由 _syncAdvancedVisibility 统一控制显隐，
        // 避免用户切换 checkbox 后字段被 continue 跳过导致"面板消失"。
        const advAttr = f._advanced ? ' data-advanced="1"' : '';
        // 条件显隐：when: { field: 'mode', is: 'source' } 表示当 mode=source 时显示
        const whenAttr = f.when ? ` data-when-field="${f.when.field}" data-when-is="${f.when.is}"` : '';

        // 处理 info 类型的提示信息
        if (f.type === 'info') {
          html += `<div class="form-group" style="background:rgba(99,102,241,0.05);padding:8px;border-radius:6px;font-size:11px;color:#666;margin-top:8px">
            ${escapeHtml(f.text || '')}
          </div>`;
          continue;
        }

        html += `<div class="form-group"${advAttr}${whenAttr}><label>${f.label}</label>`;
        if (f.type === 'ref_source') {
          if (!_wfSourcesCache.length) {
            html += `<select class="form-control" data-param="${f.id}" disabled>
              <option value="">（暂无数据源，请先在「数据源管理」中配置）</option>
            </select>`;
          } else {
            html += `<select class="form-control" data-param="${f.id}" style="color:#333">
              <option value="">-- 请选择数据源 --</option>
              ${_wfSourcesCache.map(s => `<option value="${s.id}" ${s.id === val ? 'selected' : ''}>${escapeHtml(s.name)} (${escapeHtml(s.type)})</option>`).join('')}
            </select>`;
          }
          if (f.hint) html += `<div class="form-hint" style="font-size:11px;color:#888;margin-top:2px">${f.hint}</div>`;
        } else if (f.type === 'ref_connection') {
          if (!_wfConnectionsCache.length) {
            html += `<select class="form-control" data-param="${f.id}" disabled>
              <option value="">（暂无数据库连接，请先在「连接管理」中配置）</option>
            </select>`;
          } else {
            html += `<select class="form-control" data-param="${f.id}" style="color:#333">
              <option value="">-- 请选择连接 --</option>
              ${_wfConnectionsCache.map(c => `<option value="${c.id}" ${c.id === val ? 'selected' : ''}>${escapeHtml(c.name)} (${escapeHtml(c.type)})</option>`).join('')}
            </select>`;
          }
          if (f.hint) html += `<div class="form-hint" style="font-size:11px;color:#888;margin-top:2px">${f.hint}</div>`;
        } else if (f.type === 'select') {
          // 支持两种格式：
          // 1. 简单数组：['opt1', 'opt2']
          // 2. 对象数组：[{value: 'opt1', label: '选项1'}, ...]
          const optsHtml = (f.opts || []).map(o => {
            const optVal = typeof o === 'object' ? o.value : o;
            const optLabel = typeof o === 'object' ? o.label : o;
            const selected = String(optVal) === String(val) ? 'selected' : '';
            return `<option value="${optVal}" ${selected}>${escapeHtml(optLabel)}</option>`;
          }).join('');
          html += `<select class="form-control" data-param="${f.id}" style="color:#333">${optsHtml}</select>`;
        } else if (f.type === 'checkbox') {
          html += `<label class="form-check"><input type="checkbox" data-param="${f.id}" ${val ? 'checked' : ''}> ${f.label}</label>`;
          html += `</div>`; // close extra wrapper
          continue; // checkbox is self-contained
        } else if (f.type === 'textarea') {
          const placeholder = f.placeholder ? ` placeholder="${escapeHtml(f.placeholder)}"` : '';
          html += `<textarea class="form-control" data-param="${f.id}" rows="6"${placeholder}>${val || ''}</textarea>`;
        } else {
          const placeholder = f.placeholder ? ` placeholder="${escapeHtml(f.placeholder)}"` : '';
          html += `<input class="form-control" type="${f.type}" data-param="${f.id}" value="${val ?? ''}"${placeholder}>`;
        }
        html += `</div>`;
      }
      return html;
    }

    // 将属性面板当前表单值静默回写到 Drawflow 内部存储
    // 用于保存前、切换节点前，避免表单改动丢失
    function flushCurrentParams() {
      if (!currentSelectedNodeId) return;
      const store = editor.drawflow && editor.drawflow.drawflow
        ? editor.drawflow.drawflow[editor.module || 'Home']?.data : null;
      if (!store || !store[currentSelectedNodeId]) return;
      const node = store[currentSelectedNodeId];
      const panel = document.getElementById('props-panel');

      const params = {};
      panel.querySelectorAll('input:not([type=checkbox]), select, textarea').forEach(el => {
        const k = el.dataset.param;
        if (!k) return;
        let val = el.value;
        if (el.type === 'number') val = isNaN(Number(val)) ? val : Number(val);
        params[k] = val;
      });
      panel.querySelectorAll('input[type=checkbox]').forEach(el => {
        const k = el.dataset.param;
        if (!k) return;
        params[k] = el.checked;
      });

      node.data.parameters = params;

      // 同步更新画布节点卡片上的参数摘要
      const domNode = document.getElementById('node-' + currentSelectedNodeId);
      if (domNode) {
        const contentEl = domNode.querySelector('[data-content]');
        if (contentEl) contentEl.innerHTML = formatParamSummary(params);
      }
    }

    function applyParamsForNode(nodeId) {
      if (!nodeId) { toast('请先选中一个节点', 'warning'); return; }

      const store = editor.drawflow && editor.drawflow.drawflow ? editor.drawflow.drawflow[editor.module || 'Home']?.data : null;
      if (!store || !store[nodeId]) { toast('节点不存在', 'error'); return; }

      // 先静默回写（复用同一套读取逻辑），再重新渲染面板
      currentSelectedNodeId = nodeId;  // 确保 flush 读到正确节点
      flushCurrentParams();
      const node = store[nodeId];
      const params = node.data.parameters;

      console.log('applyParamsForNode id=' + nodeId + ' params=' + JSON.stringify(params));

      // 重新渲染属性面板
      const color = NODE_COLORS[node.data.nodeType] || '#6366f1';
      const panel = document.getElementById('props-panel');
      panel.innerHTML = `
        <h3 style="color:${color}">${node.data.icon} ${node.data.label}</h3>
        <div class="form-group">
          <label>节点类型</label>
          <input class="form-control" value="${node.data.nodeType}" readonly>
        </div>
        ${renderParamsFields(node.data.nodeType, params)}
        <button class="btn btn-secondary btn-sm mt-8" onclick="applyParamsForNode('${nodeId}')">应用参数</button>
        <button class="btn btn-danger btn-sm mt-16" onclick="deleteSelectedNode('${nodeId}')">删除节点</button>
      `;

      // 重新初始化高级字段显隐状态
      _syncAdvancedVisibility(panel);
      _syncWhenVisibility(panel);

      toast('参数已更新', 'success');
    }

    // 保留旧函数名兼容
    function applyParams() {
      applyParamsForNode(currentSelectedNodeId);
    }

    // ---------- Save / Load ----------
    /**
     * 从画布导出当前工作流 JSON（不保存）。
     * 返回 { workflowJson, origIdToDfId } — origIdToDfId 用于预览后高亮画布节点。
     */
    function buildCurrentWorkflowJson() {
      const exportData = editor.export();
      const nodes = [];
      const connections = {};
      const idMap = {};
      const origIdToDfId = {};

      if (exportData.drawflow && exportData.drawflow.Home && exportData.drawflow.Home.data) {
        const dfNodes = exportData.drawflow.Home.data;
        for (const [key, dfNode] of Object.entries(dfNodes)) {
          const drawflowId = key.replace('node-', '');
          const origId = dfNode.data.origId || drawflowId;
          idMap[drawflowId] = origId;
          origIdToDfId[origId] = drawflowId;
        }
        for (const [key, dfNode] of Object.entries(dfNodes)) {
          const drawflowId = key.replace('node-', '');
          const origId = dfNode.data.origId || drawflowId;
          nodes.push({
            id: origId,
            type: dfNode.data.nodeType,
            name: dfNode.data.label || dfNode.data.nodeType,
            parameters: dfNode.data.parameters || {},
            pos_x: typeof dfNode.pos_x === 'number' ? dfNode.pos_x : undefined,
            pos_y: typeof dfNode.pos_y === 'number' ? dfNode.pos_y : undefined,
          });

          // 处理连接
          const isConditionNode = dfNode.data.nodeType === 'condition';
          const isSwitchNode = dfNode.data.nodeType === 'switch';
          if ((isConditionNode || isSwitchNode) && dfNode.outputs) {
            // 条件分支/多路分支节点：多输出端口格式
            const multiConnections = {};
            for (let i = 1; i <= 10; i++) {  // 支持最多 10 个输出端口
              const outputKey = `output_${i}`;
              if (dfNode.outputs[outputKey] && dfNode.outputs[outputKey].connections) {
                const targets = dfNode.outputs[outputKey].connections
                  .filter(c => c.node)
                  .map(c => ({ node: idMap[String(c.node)] }))
                  .filter(c => c.node);
                if (targets.length) {
                  multiConnections[outputKey] = targets;
                }
              }
            }
            if (Object.keys(multiConnections).length > 0) {
              connections[origId] = multiConnections;
            }
          } else {
            // 普通节点：单输出端口格式
            if (dfNode.outputs && dfNode.outputs.output_1 && dfNode.outputs.output_1.connections) {
              const targets = dfNode.outputs.output_1.connections
                .filter(c => c.node)
                .map(c => idMap[String(c.node)])
                .filter(Boolean);
              if (targets.length) {
                connections[origId] = targets;
              }
            }
          }
        }
      }
      return { workflowJson: { nodes, connections }, origIdToDfId };
    }

    async function saveWorkflow() {
      const name = document.getElementById('wf-name-input').value.trim();
      if (!name) { alert('请输入工作流名称'); return; }
      const description = document.getElementById('wf-desc-input').value.trim();

      // 关键：保存前先把当前属性面板里的表单值回写到 Drawflow 内部数据
      // 否则用户编辑后未点「应用参数」就直接保存，改动会被静默丢弃
      flushCurrentParams();

      const { workflowJson } = buildCurrentWorkflowJson();
      const body = {
        name,
        description,
        workflow_json: workflowJson,
      };

      try {
        if (workflowId) {
          await api(`/api/workflows/${workflowId}`, { method: 'PUT', body: JSON.stringify(body) });
        } else {
          const res = await api('/api/workflows/', { method: 'POST', body: JSON.stringify(body) });
          workflowId = res.id;
        }
        toast('保存成功', 'success');
        // 通知父窗口刷新工作流列表
        if (window.opener && typeof window.opener.refreshWorkflows === 'function') {
          window.opener.refreshWorkflows();
        }
      } catch (e) {
        toast('保存失败: ' + e.message, 'error');
      }
    }

    async function loadWorkflow(id) {
      try {
        const wf = await api(`/api/workflows/${id}`);
        document.getElementById('wf-name-input').value = wf.name || '';
        document.getElementById('wf-desc-input').value = wf.description || '';
        const wfJson = wf.workflow_json;
        if (!wfJson || !wfJson.nodes) return;

        // Clear existing nodes
        const exportData = editor.export();
        if (exportData.drawflow && exportData.drawflow.Home && exportData.drawflow.Home.data) {
          for (const key of Object.keys(exportData.drawflow.Home.data)) {
            editor.removeNodeId(key);
          }
        }

        // Map: orig_id -> drawflow_id
        const dfIdMap = {};

        // Load nodes with origId — 若节点保存了位置则优先使用，否则回退到默认的蛇形排布
        let x = 100, y = 80;
        for (const node of wfJson.nodes) {
          const nx = typeof node.pos_x === 'number' ? node.pos_x : x;
          const ny = typeof node.pos_y === 'number' ? node.pos_y : y;
          addNodeToCanvas(node.type, nx, ny, node.parameters || {}, node.id);
          dfIdMap[node.id] = null; // will be filled after addNodeToCanvas
          if (typeof node.pos_x !== 'number') {
            x += 240;
            if (x > 600) { x = 100; y += 150; }
          }
        }

        // Build the mapping from orig_id to drawflow_id
        const freshExport = editor.export();
        if (freshExport.drawflow && freshExport.drawflow.Home) {
          for (const [key, dfNode] of Object.entries(freshExport.drawflow.Home.data)) {
            const dfId = key.replace('node-', '');
            if (dfNode.data.origId) {
              dfIdMap[dfNode.data.origId] = dfId;
            }
          }
        }

        // Load connections
        const connPairs = wfJson.connections || {};
        for (const [srcId, targets] of Object.entries(connPairs)) {
          if (Array.isArray(targets)) {
            // 旧格式：单输出端口
            for (const tgtId of targets) {
              const finalTgt = typeof tgtId === 'object' ? (tgtId.node || tgtId.id) : tgtId;
              connectNodesByDataId(srcId, String(finalTgt), dfIdMap, 'output_1');
            }
          } else if (typeof targets === 'object') {
            // 新格式：多输出端口（条件分支/多路分支节点）
            for (const [outputName, targetList] of Object.entries(targets)) {
              if (Array.isArray(targetList)) {
                for (const tgtId of targetList) {
                  const finalTgt = typeof tgtId === 'object' ? (tgtId.node || tgtId.id) : tgtId;
                  connectNodesByDataId(srcId, String(finalTgt), dfIdMap, outputName);
                }
              }
            }
          }
        }

        try { if (typeof editor.zoomReset === 'function') editor.zoomReset(); } catch(e) {}

        // 刷新容器节点样式和区域框
        setTimeout(() => {
          refreshContainerNodeStyles();
          renderGroupOverlays();
        }, 100);
      } catch (e) {
        console.error('Failed to load workflow:', e);
      }
    }

    function connectNodesByDataId(srcDataId, tgtDataId, dfIdMap, outputPort = 'output_1') {
      // 将工作流 JSON 中稳定的节点 ID 映射回画布 drawflow_id 后再连线。
      const srcDfId = dfIdMap[String(srcDataId)];
      const tgtDfId = dfIdMap[String(tgtDataId)];
      // 缺任一端节点则跳过，避免抛异常中断后续连线恢复。
      if (!srcDfId || !tgtDfId) return;
      try {
        // Drawflow connect 接受”纯数字字符串节点 ID”，不带 node- 前缀。
        editor.addConnection(String(srcDfId), String(tgtDfId), outputPort, 'input_1');
      } catch (e) {
        // 忽略重复边或非法边错误，确保其余连线继续恢复。
        console.debug('connect failed:', srcDataId, '->', tgtDataId, e?.message || e);
      }
    }

    function clearAll() {
      if (!confirm('确定清空画布所有节点？')) return;
      const exportData = editor.export();
      if (exportData.drawflow && exportData.drawflow.Home && exportData.drawflow.Home.data) {
        for (const key of Object.keys(exportData.drawflow.Home.data)) {
          editor.removeNodeId(key);
        }
      }
      onNodeUnselected();
    }

    /**
     * 自动格式化画布：按拓扑层级水平排列所有节点。
     * - 入口节点（无输入连接）放在最左列
     * - 每个节点按最长路径分配列号，保证下游节点在右侧
     * - 同列节点垂直等距分布，整体居中
     * 完成后同步更新 Drawflow 内部 pos_x/pos_y 和所有连线，并刷新区域框。
     */
    function formatCanvas() {
      const exportData = editor.export();
      if (!exportData.drawflow || !exportData.drawflow.Home) return;
      const dfNodes = exportData.drawflow.Home.data;
      if (!dfNodes || Object.keys(dfNodes).length === 0) {
        toast('画布为空', 'info');
        return;
      }

      const ids = Object.keys(dfNodes).map(k => k.replace('node-', ''));
      const children = {};
      const parents = {};
      ids.forEach(id => { children[id] = []; parents[id] = []; });

      for (const [key, dfNode] of Object.entries(dfNodes)) {
        const srcId = key.replace('node-', '');
        const isConditionNode = dfNode.data?.nodeType === 'condition';
        const isSwitchNode = dfNode.data?.nodeType === 'switch';

        if ((isConditionNode || isSwitchNode) && dfNode.outputs) {
          // 条件分支/多路分支节点：处理多个输出端口
          for (let i = 1; i <= 10; i++) {  // 支持最多 10 个输出端口
            const outputKey = `output_${i}`;
            if (dfNode.outputs[outputKey] && dfNode.outputs[outputKey].connections) {
              for (const conn of dfNode.outputs[outputKey].connections) {
                if (conn && conn.node) {
                  const tgtId = String(conn.node);
                  if (children[tgtId] === undefined) continue;
                  children[srcId].push(tgtId);
                  parents[tgtId].push(srcId);
                }
              }
            }
          }
        } else {
          // 普通节点：只处理 output_1
          if (dfNode.outputs && dfNode.outputs.output_1 && dfNode.outputs.output_1.connections) {
            for (const conn of dfNode.outputs.output_1.connections) {
              if (conn && conn.node) {
                const tgtId = String(conn.node);
                if (children[tgtId] === undefined) continue;
                children[srcId].push(tgtId);
                parents[tgtId].push(srcId);
              }
            }
          }
        }
      }

      // 用 BFS 按最长路径分配层级，保证 DAG 中每个节点都在所有前驱之后
      const levelOf = {};
      const entryNodes = ids.filter(id => parents[id].length === 0);
      const queue = (entryNodes.length ? entryNodes : [ids[0]]).map(id => ({ id, level: 0 }));
      let maxLevel = 0;
      while (queue.length) {
        const { id, level } = queue.shift();
        if (levelOf[id] !== undefined && levelOf[id] >= level) continue;
        levelOf[id] = level;
        if (level > maxLevel) maxLevel = level;
        for (const cid of children[id]) {
          queue.push({ id: cid, level: level + 1 });
        }
      }
      // 把未访问到的节点挂到最右侧
      ids.forEach(id => {
        if (levelOf[id] === undefined) levelOf[id] = maxLevel + 1;
      });

      // 按层级分组
      const byLevel = {};
      ids.forEach(id => {
        const lv = levelOf[id];
        if (!byLevel[lv]) byLevel[lv] = [];
        byLevel[lv].push(id);
      });

      const H_SPACE = 280;
      const V_SPACE = 150;
      const START_X = 100;
      const START_Y = 100;

      const module = editor.module || 'Home';
      const store = editor.drawflow && editor.drawflow.drawflow
        ? editor.drawflow.drawflow[module].data : null;

      // 计算所有层中最大的节点数量，用于同列垂直居中
      const maxCount = Math.max(1, ...Object.values(byLevel).map(arr => arr.length));

      for (const [lvStr, colIds] of Object.entries(byLevel)) {
        const lv = parseInt(lvStr);
        const x = START_X + lv * H_SPACE;
        // 让较短的列在垂直方向上居中
        const colHeight = (colIds.length - 1) * V_SPACE;
        const centerY = START_Y + ((maxCount - 1) * V_SPACE - colHeight) / 2;
        colIds.forEach((id, idx) => {
          const y = centerY + idx * V_SPACE;
          const nodeKey = `node-${id}`;

          if (store && store[nodeKey]) {
            store[nodeKey].pos_x = x;
            store[nodeKey].pos_y = y;
          }
          const nodeEl = document.getElementById(nodeKey);
          if (nodeEl) {
            nodeEl.style.left = x + 'px';
            nodeEl.style.top = y + 'px';
          }
        });
      }

      // 重绘所有连线
      ids.forEach(id => {
        if (typeof editor.updateConnectionNodes === 'function') {
          editor.updateConnectionNodes('node-' + id);
        }
      });

      // 刷新区域框
      if (typeof renderGroupOverlays === 'function') {
        renderGroupOverlays();
      }

      toast('已格式化画布布局', 'success');
    }

    // ---------- API helper ----------
    async function api(url, options = {}) {
      const apiKey = await ensureApiKey();
      const res = await fetch(url, {
        method: options.method || 'GET',
        headers: {
          'Content-Type': 'application/json',
          ...(apiKey ? { 'X-API-Key': apiKey } : {}),
          ...options.headers,
        },
        body: options.body,
      });
      if (!res.ok) {
        const err = await res.text();
        throw new Error(`${res.status}: ${err}`);
      }
      return res.json();
    }

    function escapeHtml(value) {
      // 统一转义，避免将建议内容直接插入 HTML 时引起展示异常。
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    async function trackAssistantEvent(eventName, payload = {}) {
      // 工作流编辑器同样上报助手埋点，保持主界面和编辑器统计口径一致。
      try {
        await api('/api/llm/assistant-event', {
          method: 'POST',
          body: JSON.stringify({ event_name: eventName, scene: 'workflow', payload }),
        });
      } catch (e) {
        console.debug('assistant event ignored:', e.message);
      }
    }

    function openWorkflowAssistant() {
      // 打开工作流助手弹层，优先用于节点链路和参数引导。
      const el = document.getElementById('assistant-overlay');
      if (!el) return;
      el.style.display = 'flex';
      trackAssistantEvent('assistant_opened', { mode: 'wizard', from: 'workflow_editor' });
    }

    function closeWorkflowAssistant() {
      const el = document.getElementById('assistant-overlay');
      if (!el) return;
      el.style.display = 'none';
    }

    function applyWorkflowAssistantAction(action) {
      // 为工作流编辑器提供最小可执行动作，避免仅给纯文本建议。
      if (action === 'open_workflow_templates') {
        toast('建议优先使用“分钟转日线/均线生成”模板作为起点', 'success');
        trackAssistantEvent('assistant_action_applied', { action });
      }
      if (action === 'zoom_reset') {
        try { if (typeof editor.zoomReset === 'function') editor.zoomReset(); } catch(e) {}
        trackAssistantEvent('assistant_action_applied', { action });
      }
    }

    async function generateWorkflowAssistantGuide(triggerBtn = null) {
      // 根据当前画布节点结构和用户目标生成步骤化建议。
      const host = document.getElementById('assistant-result');
      if (!host) return;
      const mode = document.getElementById('assistant-mode')?.value || 'wizard';
      const goal = document.getElementById('assistant-goal')?.value || '';
      const lastError = document.getElementById('assistant-last-error')?.value || '';
      const graph = editor.export();
      const nodeCount = Object.keys(graph?.drawflow?.Home?.data || {}).length;
      // 点击后立即更新按钮状态，给出明确的 loading 反馈。
      const originalBtnText = triggerBtn ? triggerBtn.textContent : '';
      if (triggerBtn) {
        triggerBtn.disabled = true;
        triggerBtn.textContent = '生成中...';
      }
      host.innerHTML = '<span style="color:var(--text-dim)">AI 正在生成建议...</span>';
      try {
        const res = await api('/api/llm/assistant-guide', {
          method: 'POST',
          body: JSON.stringify({
            scene: 'workflow',
            mode,
            goal,
            last_error: lastError,
            current_config: { node_count: nodeCount },
          }),
        });
        const steps = (res.steps || []).map((s, idx) =>
          `<li><strong>${idx + 1}. ${escapeHtml(s.title)}</strong> - ${escapeHtml(s.detail)}</li>`
        ).join('');
        const checks = (res.checks || []).map(c => `<li>${escapeHtml(c)}</li>`).join('');
        const troubles = (res.troubleshoot || []).map(t => `<li>${escapeHtml(t)}</li>`).join('');
        host.innerHTML = `
          <div style="background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.2);border-radius:8px;padding:10px;margin-bottom:8px">
            <strong>结论：</strong>${escapeHtml(res.summary || '')}
          </div>
          <div style="margin-bottom:8px"><strong>推荐步骤</strong><ol style="padding-left:18px">${steps || '<li>暂无建议</li>'}</ol></div>
          <div style="margin-bottom:8px"><strong>自检清单</strong><ul style="padding-left:18px">${checks || '<li>暂无清单</li>'}</ul></div>
          ${troubles ? `<div><strong>故障诊断</strong><ul style="padding-left:18px">${troubles}</ul></div>` : ''}
          <div style="margin-top:8px">
            <button class="btn btn-secondary btn-sm" onclick="applyWorkflowAssistantAction('zoom_reset')">重置画布缩放</button>
          </div>
        `;
        trackAssistantEvent('assistant_guidance_generated', { mode, hasError: !!lastError, nodeCount });
      } catch (e) {
        host.innerHTML = `<span style="color:var(--danger)">建议生成失败：${escapeHtml(e.message)}</span>`;
      } finally {
        // 请求完成后恢复按钮状态，允许用户继续发起下一次生成。
        if (triggerBtn) {
          triggerBtn.disabled = false;
          triggerBtn.textContent = originalBtnText || '生成引导建议';
        }
      }
    }

    // ---------- Workflow Preview (节点间数据预览) ----------
    async function runWorkflowPreview() {
      const { workflowJson, origIdToDfId } = buildCurrentWorkflowJson();
      if (!workflowJson.nodes.length) {
        toast('画布为空，请先添加节点', 'error');
        return;
      }

      const btn = document.getElementById('preview-btn');
      btn.disabled = true;
      btn.textContent = '⏳ 执行中...';

      // 清除之前的错误高亮
      document.querySelectorAll('.drawflow-node.node-error')
        .forEach(el => el.classList.remove('node-error'));

      try {
        const res = await api('/api/workflows/preview', {
          method: 'POST',
          body: JSON.stringify({ workflow_json: workflowJson }),
        });

        _origIdToDfId = origIdToDfId;

        const nodeOutputs = res.node_outputs || {};
        const nodeIds = Object.keys(nodeOutputs);
        const errors = res.errors || [];

        // 高亮报错节点
        if (errors.length) {
          for (const err of errors) {
            const nid = err.node_id;
            const dfId = origIdToDfId[nid];
            if (dfId) {
              const el = document.getElementById('node-' + dfId);
              if (el) el.classList.add('node-error');
            }
          }
        }

        if (res.error && !nodeIds.length) {
          // 整体失败（所有节点都失败了）
          const firstErr = errors[0];
          toast(`预览失败: ${firstErr?.node_name || ''} - ${firstErr?.error || res.error}`, 'error');
          // 如果有错误信息，显示第一个错误节点的调试面板
          if (firstErr) {
            showNodeErrorFromPreview(firstErr, workflowJson);
          }
          return;
        }

        _lastPreviewResult = res;

        if (!nodeIds.length) {
          toast('所有节点均无输出数据', 'error');
          return;
        }

        renderNodeChips(nodeOutputs, workflowJson, errors);
        showNodeOutput(nodeIds[0]);

        document.getElementById('data-preview-panel').style.display = 'flex';
        const totalRows = nodeIds.reduce((s, id) => s + (nodeOutputs[id].rows || 0), 0);
        if (errors.length) {
          toast(`预览完成（${errors.length} 个节点失败） — ${nodeIds.length} 个节点成功`, 'warning');
        } else {
          toast(`预览完成 — ${nodeIds.length} 个节点，共 ${totalRows} 行`, 'success');
        }
      } catch (e) {
        toast('预览失败: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '▶ 预览';
      }
    }

    // 预览时显示节点错误详情
    function showNodeErrorFromPreview(err, workflowJson) {
      const body = document.getElementById('node-debug-body');
      const title = document.getElementById('node-debug-title');
      const meta = document.getElementById('node-debug-meta');

      const meta_info = findNodeMeta(err.node_type);
      const icon = meta_info ? meta_info.icon : '⬢';
      title.textContent = `❌ ${icon} ${err.node_name} 执行失败`;
      meta.textContent = `节点类型: ${err.node_type}`;

      let html = `<div class="node-debug-error">
        <div class="err-title">执行错误</div>
        <div class="err-type">${escapeHtml(err.error_type || '')}</div>
        <div>${escapeHtml(err.error || '')}</div>`;
      if (err.traceback) {
        html += `<div class="err-traceback">${escapeHtml(err.traceback)}</div>`;
      }
      html += `</div>`;

      body.innerHTML = html;
      document.getElementById('node-debug-overlay').classList.add('open');
      // 隐藏"重新执行"按钮（从预览入口没有足够上下文）
      document.getElementById('node-debug-run-btn').style.display = 'none';
    }

    function renderNodeChips(nodeOutputs, workflowJson, errors = []) {
      const container = document.getElementById('node-chips');
      // 按工作流节点顺序排列芯片（与 DAG 执行顺序一致）
      const nodeOrder = (workflowJson.nodes || []).map(n => n.id);
      const errorMap = {};
      for (const err of errors) { errorMap[err.node_id] = err; }
      let html = '';
      for (const nid of nodeOrder) {
        const output = nodeOutputs[nid];
        const err = errorMap[nid];
        if (!output && !err) continue;
        const type = output ? output.type : err.node_type;
        const name = output ? output.name : err.node_name;
        const color = err ? 'var(--danger)' : (NODE_COLORS[type] || '#6366f1');
        const meta = findNodeMeta(type);
        const icon = meta ? meta.icon : '⬢';
        const chipClick = output ? `showNodeOutput('${escapeHtml(nid)}')` : `showNodeErrorChip('${escapeHtml(nid)}')`;
        const rowsInfo = output ? `${output.rows}行` : '❌ 失败';
        html += `<div class="node-chip" data-node-id="${escapeHtml(nid)}"
                      onclick="${chipClick}"
                      style="border-left: 3px solid ${color}">
                   <span>${icon} ${escapeHtml(name)}</span>
                   <span class="chip-rows">${rowsInfo}</span>
                 </div>`;
      }
      container.innerHTML = html;
    }

    // 点击失败节点的芯片，显示错误详情
    function showNodeErrorChip(nodeId) {
      if (!_lastPreviewResult) return;
      const errors = _lastPreviewResult.errors || [];
      const err = errors.find(e => e.node_id === nodeId);
      if (!err) return;
      const { workflowJson } = buildCurrentWorkflowJson();
      showNodeErrorFromPreview(err, workflowJson);
    }

    function showNodeOutput(nodeId) {
      const output = _lastPreviewResult?.node_outputs?.[nodeId];
      if (!output) return;

      _activePreviewNodeId = nodeId;

      // 高亮选中的芯片
      document.querySelectorAll('.node-chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.nodeId === nodeId);
      });

      // 高亮画布上对应的节点
      document.querySelectorAll('.drawflow-node.preview-highlight')
        .forEach(el => el.classList.remove('preview-highlight'));
      const dfId = _origIdToDfId?.[nodeId];
      if (dfId) {
        const el = document.getElementById('node-' + dfId);
        if (el) el.classList.add('preview-highlight');
      }

      // 更新统计信息
      const meta = document.getElementById('data-preview-meta');
      meta.innerHTML = `<span style="color:var(--accent)">${escapeHtml(output.name)}</span> · ${output.rows} 行 · ${output.columns.length} 列 · ${output.time_seconds}s`;

      // 渲染数据表
      const body = document.getElementById('data-preview-body');
      if (!output.preview || !output.preview.length) {
        body.innerHTML = '<div class="preview-empty">该节点输出为空（0 行）</div>';
        return;
      }
      body.innerHTML = renderDataTable(output.columns, output.preview);
    }

    function closeDataPreview() {
      document.getElementById('data-preview-panel').style.display = 'none';
      document.querySelectorAll('.drawflow-node.preview-highlight')
        .forEach(el => el.classList.remove('preview-highlight'));
      _lastPreviewResult = null;
      _activePreviewNodeId = null;
      _origIdToDfId = null;
    }

    function renderDataTable(columns, rows) {
      let h = '<table class="preview-data-table"><thead><tr>';
      for (const col of columns) h += `<th>${escapeHtml(col)}</th>`;
      h += '</tr></thead><tbody>';
      for (const row of rows) {
        h += '<tr>';
        for (const col of columns) {
          const val = row[col];
          h += `<td title="${escapeHtml(String(val ?? ''))}">${escapeHtml(String(val ?? ''))}</td>`;
        }
        h += '</tr>';
      }
      h += '</tbody></table>';
      return h;
    }

    // ---------- 单节点调试 ----------
    let _lastDebugNodeId = null;  // 用于"重新执行"按钮

    async function debugNodeByDrawflowId(dfId) {
      // 从 Drawflow store 获取节点的原始 ID
      const store = editor.drawflow && editor.drawflow.drawflow
        ? editor.drawflow.drawflow[editor.module || 'Home']?.data : null;
      if (!store) { toast('无法读取画布数据', 'error'); return; }

      let origId = null;
      let nodeDef = null;
      for (const [id, n] of Object.entries(store)) {
        if (n.data?.origId) {
          if (id === dfId) { origId = n.data.origId; nodeDef = n; break; }
        }
      }

      if (!nodeDef) {
        // 可能是还没保存的新节点，用 dfId 作为 fallback
        for (const [id, n] of Object.entries(store)) {
          if (id === dfId) { nodeDef = n; origId = n.data?.origId || id; break; }
        }
      }
      if (!nodeDef) { toast('节点不存在', 'error'); return; }

      // 先 flush 当前属性面板，确保参数是最新的
      flushCurrentParams();

      await debugNode(nodeDef.data.nodeType, origId, nodeDef);
    }

    async function debugNode(nodeType, origId, nodeObj) {
      // 构造完整 workflow_json（含所有节点，后端会截取上游子图）
      const { workflowJson, origIdToDfId } = buildCurrentWorkflowJson();

      if (!workflowJson.nodes.length) {
        toast('画布为空', 'error');
        return;
      }

      // 找到目标节点在 workflowJson 中的 ID
      let targetNodeId = null;
      for (const n of workflowJson.nodes) {
        if (n.id === origId) { targetNodeId = origId; break; }
      }
      if (!targetNodeId) {
        // 可能是新节点还没有 orig_id，用第一个匹配的
        for (const n of workflowJson.nodes) {
          if (n.type === nodeType) { targetNodeId = n.id; break; }
        }
      }
      if (!targetNodeId) {
        toast('找不到目标节点，请先保存工作流', 'error');
        return;
      }

      _lastDebugNodeId = targetNodeId;

      const btn = document.getElementById('node-debug-run-btn');
      btn.disabled = true;
      btn.textContent = '⏳ 执行中...';

      // 显示 modal
      const title = document.getElementById('node-debug-title');
      const meta = document.getElementById('node-debug-meta');
      const body = document.getElementById('node-debug-body');
      const meta_info = findNodeMeta(nodeType);
      const icon = meta_info ? meta_info.icon : '⬢';
      title.textContent = `🔍 调试: ${icon} ${nodeObj?.data?.label || nodeType}`;
      meta.textContent = '正在执行节点及其上游依赖...';
      body.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-dim)">⏳ 执行中...</div>';
      document.getElementById('node-debug-overlay').classList.add('open');
      btn.style.display = '';

      try {
        const res = await api('/api/workflows/execute-node', {
          method: 'POST',
          body: JSON.stringify({
            workflow_json: workflowJson,
            node_id: targetNodeId,
          }),
        });

        if (res.error && !res.output && !res.input) {
          // 目标节点本身报错
          renderNodeDebugError(res);
        } else {
          renderNodeDebugResult(res);
        }

        // 高亮画布上的节点
        document.querySelectorAll('.drawflow-node.preview-highlight')
          .forEach(el => el.classList.remove('preview-highlight'));
        const dfId = origIdToDfId[targetNodeId];
        if (dfId) {
          const el = document.getElementById('node-' + dfId);
          if (el) {
            el.classList.add('preview-highlight');
            if (res.error) el.classList.add('node-error');
          }
        }
      } catch (e) {
        body.innerHTML = `<div class="node-debug-error">
          <div class="err-title">请求失败</div>
          <div>${escapeHtml(e.message)}</div>
        </div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = '▶ 重新执行';
      }
    }

    function renderNodeDebugResult(res) {
      const meta = document.getElementById('node-debug-meta');
      const body = document.getElementById('node-debug-body');

      const execInfo = `执行路径: ${res.executed_nodes?.length || 0} 个节点 · 耗时 ${res.time_seconds?.toFixed(3) || '?'}s`;
      let upstreamWarn = '';
      if (res.upstream_errors?.length) {
        upstreamWarn = `<div class="node-debug-upstream-error">
          ⚠️ 上游节点有 ${res.upstream_errors.length} 个错误:
          ${res.upstream_errors.map(e => `<br>• ${escapeHtml(e.node_name)}: ${escapeHtml(e.error)}`).join('')}
        </div>`;
      }
      meta.textContent = execInfo;

      let html = upstreamWarn;

      // 输入数据
      if (res.input && res.input.rows > 0) {
        html += `<div class="node-debug-section">
          <div class="node-debug-section-header">
            <span>📥 输入数据 (${res.input.rows} 行 × ${res.input.columns.length} 列)</span>
          </div>
          <div class="node-debug-section-body">${renderDataTable(res.input.columns, res.input.preview)}</div>
        </div>`;
      } else {
        html += `<div class="node-debug-section">
          <div class="node-debug-section-header"><span>📥 输入数据</span></div>
          <div class="node-debug-section-body"><div class="preview-empty">无输入数据（首节点或上游无输出）</div></div>
        </div>`;
      }

      // 输出数据
      if (res.output && res.output.rows > 0) {
        html += `<div class="node-debug-section">
          <div class="node-debug-section-header">
            <span>📤 输出数据 (${res.output.rows} 行 × ${res.output.columns.length} 列)</span>
          </div>
          <div class="node-debug-section-body">${renderDataTable(res.output.columns, res.output.preview)}</div>
        </div>`;
      } else if (res.output) {
        html += `<div class="node-debug-section">
          <div class="node-debug-section-header"><span>📤 输出数据</span></div>
          <div class="node-debug-section-body"><div class="preview-empty">输出为空 (0 行)</div></div>
        </div>`;
      }

      body.innerHTML = html;
    }

    function renderNodeDebugError(res) {
      const meta = document.getElementById('node-debug-meta');
      const body = document.getElementById('node-debug-body');
      meta.textContent = `节点执行失败 · ${res.error_type || 'Error'}`;

      let html = `<div class="node-debug-error">
        <div class="err-title">❌ 执行错误</div>
        <div class="err-type">${escapeHtml(res.error_type || '')}</div>
        <div>${escapeHtml(res.error || '')}</div>`;
      if (res.traceback) {
        html += `<div class="err-traceback">${escapeHtml(res.traceback)}</div>`;
      }
      html += `</div>`;

      // 即使报错，也尝试显示输入数据（供调试）
      if (res.input && res.input.rows > 0) {
        html += `<div class="node-debug-section">
          <div class="node-debug-section-header">
            <span>📥 输入数据 (${res.input.rows} 行 × ${res.input.columns.length} 列)</span>
          </div>
          <div class="node-debug-section-body">${renderDataTable(res.input.columns, res.input.preview)}</div>
        </div>`;
      }

      body.innerHTML = html;
    }

    async function rerunNodeDebug() {
      if (!_lastDebugNodeId) { toast('没有可重新执行的节点', 'error'); return; }

      const store = editor.drawflow && editor.drawflow.drawflow
        ? editor.drawflow.drawflow[editor.module || 'Home']?.data : null;
      if (!store) return;

      // 找到节点定义
      for (const [dfId, n] of Object.entries(store)) {
        if (n.data?.origId === _lastDebugNodeId) {
          await debugNode(n.data.nodeType, _lastDebugNodeId, n);
          return;
        }
      }
      toast('节点未找到', 'error');
    }

    function closeNodeDebug() {
      document.getElementById('node-debug-overlay').classList.remove('open');
      document.querySelectorAll('.drawflow-node.node-error')
        .forEach(el => el.classList.remove('node-error'));
      document.querySelectorAll('.drawflow-node.preview-highlight')
        .forEach(el => el.classList.remove('preview-highlight'));
    }

      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      setTimeout(() => el.className = 'toast', 2000);
    }

    // ---------- Start ----------
    window.addEventListener('DOMContentLoaded', init);

    // ---------- 导入示例工作流（组合打法：搜索 + chips + 智能推荐） ----------
    let __importActiveChips = new Set();   // 空 = 全部显示
    let __importRecommendIds = new Set();  // 智能推荐的 id 集合

    async function openImportExamplesModal() {

    function renderImportChips() {
      const chips = (window.EXAMPLE_WORKFLOWS_DATA && window.EXAMPLE_WORKFLOWS_DATA.filterChips) || ['全部'];
      const box = document.getElementById('import-chips');
      box.innerHTML = chips.map(c => {

    // ---- 智能推荐：基于当前画布节点打分 ----
    function __getCanvasNodeSummary() {
      // 返回 { types: Set, sourceTypes: Set, count }
      const types = new Set();
      const sourceTypes = new Set();
      try {
        if (typeof editor !== 'undefined' && editor && editor.drawflow && editor.drawflow.drawflow) {
          const data = editor.drawflow.drawflow[editor.module || 'Home'].data || {};
          Object.values(data).forEach(n => {
            const d = n.data || {};
            if (d.type) types.add(d.type);
            if (d.type === 'source_fetch' && d.parameters && d.parameters.source_type) {
              sourceTypes.add(d.parameters.source_type);
            }
          });
        }
      } catch (e) { /* ignore */ }
      return { types, sourceTypes, count: types.size };
    }
    function __deriveCanvasCategory(canvas) {
      if ([...canvas.types].some(t => ['factor_compute', 'factor_write', 'factor_expression'].includes(t))) return '因子库';
      if ([...canvas.types].some(t => ['macd', 'ma', 'rsi', 'boll'].includes(t))) return '指标';
      if ([...canvas.types].some(t => ['custom_python', 'condition', 'expression'].includes(t))) return '策略信号';
      if ([...canvas.types].some(t => ['filter', 'sort', 'group_by', 'dedup', 'resample', 'column_rename'].includes(t))) return '数据处理';
      if ([...canvas.types].includes('time_window') || [...canvas.types].includes('dedup')) return '进阶ETL';
      if (canvas.sourceTypes.size > 0) return '数据源';
      return null;
    }
    function __describeRecommendReason(canvas) {
      if (canvas.count === 0) return '当前画布为空，从入门示例开始';
      if (canvas.sourceTypes.size > 0) return `基于当前 ${[...canvas.sourceTypes].join(' / ')} 数据源推荐`;
      const cat = __deriveCanvasCategory(canvas);
      if (cat) return `基于当前「${cat}」相关节点推荐`;
      return '基于当前画布内容推荐';
    }
    function renderImportRecommend() {
      const box = document.getElementById('import-recommend');
      const examples = window.EXAMPLE_WORKFLOWS || [];
      if (!examples.length) { box.classList.remove('has-items'); return; }

      const canvas = __getCanvasNodeSummary();
      const empty = canvas.count === 0;

      const scores = examples.map(ex => {
        let score = 0;
        const tags = ex.tags || [];
        const exTypes = new Set((ex.workflow.nodes || []).map(n => n.type));
        const exSources = new Set((ex.workflow.nodes || [])
          .filter(n => n.type === 'source_fetch' && n.parameters && n.parameters.source_type)
          .map(n => n.parameters.source_type));

        if (empty) {
          if (tags.includes('快速上手')) score += 10;
        } else {
          for (const s of exSources) if (canvas.sourceTypes.has(s)) score += 5;
          for (const t of exTypes) if (canvas.types.has(t)) score += 2;
          const cat = __deriveCanvasCategory(canvas);
          if (cat && tags.includes(cat)) score += 8;
        }
        return { ex, score };
      }).filter(s => s.score > 0).sort((a, b) => b.score - a.score).slice(0, 3);

      if (!scores.length) {
        __importRecommendIds = new Set();
        box.classList.remove('has-items');
        return;
      }

      // 过滤掉没有 workflow 数据的专业版示例（需要内容包）
      const importableScores = scores.filter(s => s.ex.workflow && s.ex.workflow.nodes && s.ex.workflow.nodes.length > 0);
      if (!importableScores.length) {
        __importRecommendIds = new Set();
        box.classList.remove('has-items');
        return;
      }

      __importRecommendIds = new Set(importableScores.map(s => s.ex.id));
      const reason = __describeRecommendReason(canvas);

      box.classList.add('has-items');
      box.innerHTML = `
        <div class="import-recommend-title">
          🔥 猜你想用
          <span class="import-recommend-subtitle">${escapeHtml(reason)}</span>
        </div>
        ${importableScores.map(s => {
          const nodes = (s.ex.workflow && s.ex.workflow.nodes) || [];
          const types = nodes.map(n => n.type).join(' → ') || '(无节点)';
          return `
            <label class="import-item" data-id="${s.ex.id}">
              <input type="checkbox" class="import-cb" value="${s.ex.id}" onchange="updateImportCount()">
              <div class="idx">#${s.ex.id}</div>
              <div class="meta">
                <div class="t">${escapeHtml(s.ex.title)}</div>
                <div class="d">${escapeHtml((s.ex.description || '').slice(0, 80))}</div>
              </div>
              <div class="nodes" title="${escapeHtml(types)}">${escapeHtml(types)}</div>
            </label>`;
        }).join('')}
      `;
    }

    function renderImportList() {
      const list = document.getElementById('import-list');
      const examples = window.EXAMPLE_WORKFLOWS || [];
      const search = (document.getElementById('import-search')?.value || '').trim().toLowerCase();
      const activeChips = __importActiveChips;

      if (!examples.length) {
        list.innerHTML = '<div class="text-dim" style="padding:20px;text-align:center">未加载到示例数据（example_workflows.js）</div>';
        document.getElementById('import-filter-hint').textContent = '共 0 个示例';
        return;
      }

      // 过滤：推荐区已展示的 + chips + 搜索
      const secondaryTags = new Set(['tdx', 'binance', 'yfinance', '并行', '增量']);
      const filtered = examples.filter(ex => {
        if (__importRecommendIds.has(ex.id)) return false;  // 已在推荐区，主列表不重复
        if (activeChips.size > 0 && !(ex.tags || []).some(t => activeChips.has(t))) return false;
        if (search) {
          const haystack = [
            ex.title, ex.description,
            ...(ex.tags || []),
            ...((ex.workflow.nodes || []).map(n => n.type)),
            ...((ex.workflow.nodes || []).map(n => n.name)),
          ].join(' ').toLowerCase();
          if (!haystack.includes(search)) return false;
        }
        return true;
      });

      const total = examples.length;
      const hintText = (activeChips.size > 0 || search)
        ? `匹配 ${filtered.length} / ${total} 个`
        : `共 ${total} 个示例（推荐区另 ${__importRecommendIds.size} 个）`;
      document.getElementById('import-filter-hint').textContent = hintText;

      if (!filtered.length) {
        list.innerHTML = '<div class="text-dim" style="padding:20px;text-align:center">没有匹配的示例</div>';
        updateImportCount();
        return;
      }

      list.innerHTML = filtered.map(ex => {
        const nodes = (ex.workflow && ex.workflow.nodes) || [];
        const types = nodes.map(n => n.type).join(' → ') || '(无节点)';
        const desc = (ex.description || '').slice(0, 80);
        const mainTags = (ex.tags || []).filter(t => !secondaryTags.has(t));
        const isLocked = !ex.workflow || !ex.workflow.nodes || ex.workflow.nodes.length === 0;
        const CR = window.CONTENT_REGISTRY || { isPro: () => false };
        const isProExample = CR.isPro(ex.id);

        if (isLocked && isProExample) {
          return `
            <div class="import-item" style="opacity:0.6" data-id="${ex.id}">
              <div style="display:flex;align-items:center;gap:8px;margin-right:auto">
                <span style="font-size:16px">🔒</span>
                <div class="idx">#${ex.id}</div>
              </div>
              <div class="meta">
                <div class="t">${escapeHtml(ex.title)}</div>
                <div class="d">${escapeHtml(desc)}</div>
                <div class="text-dim" style="font-size:11px;margin-top:4px">需导入专业版内容包</div>
              </div>
            </div>`;
        }

        return `
          <label class="import-item" data-id="${ex.id}">
            <input type="checkbox" class="import-cb" value="${ex.id}" onchange="updateImportCount()">
            <div class="idx">#${ex.id}</div>
            <div class="meta">
              <div class="t">${escapeHtml(ex.title)}</div>
              <div class="d">${escapeHtml(desc)}</div>
              ${mainTags.length ? `<div class="import-item-tags">${mainTags.map(t => `<span class="import-item-tag">${t}</span>`).join('')}</div>` : ''}
            </div>
            <div class="nodes" title="${escapeHtml(types)}">${escapeHtml(types)}</div>
          </label>`;
      }).join('');
      updateImportCount();
    }
    function toggleAllImport(checked) {
      document.querySelectorAll('.import-cb').forEach(cb => { cb.checked = checked; });
      updateImportCount();
    }
    function updateImportCount() {
      const n = document.querySelectorAll('.import-cb:checked').length;
      document.getElementById('import-count').textContent = `已选 ${n} 项`;
      const all = document.querySelectorAll('.import-cb');
      const selectAll = document.getElementById('import-select-all');
      if (selectAll) selectAll.indeterminate = n > 0 && n < all.length;
    }
    async function importSelectedExamples() {
      const ids = Array.from(document.querySelectorAll('.import-cb:checked')).map(cb => Number(cb.value));
      if (!ids.length) { toast('请先勾选要导入的示例', 'error'); return; }
      const examples = (window.EXAMPLE_WORKFLOWS || []).filter(ex => ids.includes(ex.id));
      let ok = 0, fail = 0;
      for (const ex of examples) {
        const body = {
          name: `示例${ex.id}: ${ex.title}`,
          description: ex.description || '',
          workflow_json: ex.workflow,
        };
        try {
          await api('/api/workflows/', { method: 'POST', body: JSON.stringify(body) });
          ok++;
        } catch (e) {
          fail++;
          console.error(`导入示例 ${ex.id} 失败:`, e);
        }
      }
      toast(`导入完成：成功 ${ok} 项${fail ? `，失败 ${fail} 项` : ''}`, ok ? 'success' : 'error');
      if (ok > 0 && window.opener && typeof window.opener.refreshWorkflows === 'function') {
        window.opener.refreshWorkflows();
      }
      closeImportExamplesModal();
    }
  </script>
</body>
