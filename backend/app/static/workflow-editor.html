<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作流编辑器 - 金智汇连ETL</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/drawflow@0.0.59/dist/drawflow.min.css">
  <style>
    :root {
      --bg: #0f1117; --card: #1a1d27; --card-hover: #22263a;
      --border: #2d3348; --text: #e2e8f0; --text-dim: #8892a4;
      --accent: #6366f1; --accent-hover: #818cf8;
      --success: #22c55e; --warning: #f59e0b; --danger: #ef4444;
    }
    [data-theme="light"] {
      --bg: #f5f7fa; --card: #ffffff; --card-hover: #f0f2f5;
      --border: #e2e6ee; --text: #1e293b; --text-dim: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

    /* Top bar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; background: var(--card); border-bottom: 1px solid var(--border);
      flex-shrink: 0; height: 48px; z-index: 10;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar h1 { font-size: 15px; font-weight: 600; color: var(--accent); }
    .topbar input {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 10px; color: var(--text); font-size: 13px; width: 180px;
    }
    .topbar input:focus { outline: none; border-color: var(--accent); }
    .topbar-actions { display: flex; gap: 8px; }

    .btn {
      padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px;
      cursor: pointer; font-size: 12px; background: var(--bg); color: var(--text);
      transition: all 0.15s; white-space: nowrap;
    }
    .btn:hover { background: var(--card-hover); }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: rgba(99,102,241,0.1); color: var(--accent); border-color: var(--accent); }
    .btn-danger { background: rgba(239,68,68,0.15); color: var(--danger); border-color: var(--danger); }
    .btn-sm { padding: 4px 10px; font-size: 11px; }

    /* Main layout */
    .editor-wrap { display: flex; flex: 1; overflow: hidden; }

    /* Palette */
    .palette {
      width: 200px; background: var(--card); border-right: 1px solid var(--border);
      overflow-y: auto; padding: 10px; flex-shrink: 0;
    }
    .palette-section { margin-bottom: 14px; }
    .palette-title {
      font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
      color: var(--text-dim); margin-bottom: 6px;
    }
    .palette-item {
      padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border);
      cursor: grab; font-size: 12px; margin-bottom: 4px;
      background: var(--bg); display: flex; align-items: center; gap: 6px;
      transition: all 0.1s; user-select: none;
    }
    .palette-item:hover { border-color: var(--accent); background: var(--card-hover); }
    .palette-item:active { cursor: grabbing; }
    .palette-item .icon { font-size: 14px; }

    /* Canvas area */
    .canvas-wrap { flex: 1; position: relative; overflow: hidden; background: var(--bg); }
    .canvas-wrap #drawflow { width: 100%; height: 100%; }

    /* Drawflow overrides */
    /* Canvas background — match theme */
    .drawflow {
      background: var(--bg) !important;
      background-image: radial-gradient(circle, var(--border) 1px, transparent 1px) !important;
      background-size: 24px 24px;
    }
    .drawflow svg.drawflow-renderer { background: transparent !important; }

    .drawflow .drawflow-node {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 0; min-width: 180px; width: 200px;
      color: var(--text);
    }
    .drawflow .drawflow-node.selected {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 2px rgba(99,102,241,0.3);
      background: var(--card) !important;
    }
    .drawflow .drawflow-node:hover { border-color: var(--accent-hover); }
    .drawflow .drawflow-node .title {
      background: rgba(99,102,241,0.12); border-left: 3px solid var(--accent);
      padding: 6px 10px; border-radius: 8px 8px 0 0; font-size: 13px; font-weight: 600;
      cursor: move; color: var(--text);
    }
    .drawflow .drawflow-node .content { padding: 8px 10px; font-size: 11px; color: var(--text-dim); }
    .drawflow .drawflow-node .output_1 {
      position: absolute; right: -5px; top: 50%; transform: translateY(-50%);
    }
    .drawflow .drawflow-node .input_1 {
      position: absolute; left: -5px; top: 50%; transform: translateY(-50%);
    }
    .drawflow .connection .point { stroke: var(--accent); }
    .drawflow .connection .point.selected, .drawflow .connection .point:hover {
      fill: var(--danger);
    }
    .drawflow .main-path { stroke: var(--accent); stroke-width: 2px; }

    .drawflow .drawflow-delete {
      background: var(--danger); color: #fff;
    }

    /* Properties panel */
    .props-panel {
      width: 280px; background: var(--card); border-left: 1px solid var(--border);
      overflow-y: auto; padding: 16px; flex-shrink: 0; display: flex; flex-direction: column;
    }
    .props-panel h3 { font-size: 14px; margin-bottom: 12px; }
    .props-placeholder { color: var(--text-dim); font-size: 12px; text-align: center; margin-top: 60px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 3px; }
    .form-control {
      width: 100%; padding: 6px 8px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 12px; font-family: inherit;
    }
    .form-control:focus { outline: none; border-color: var(--accent); }
    textarea.form-control { font-family: 'Cascadia Code', monospace; min-height: 60px; resize: vertical; }
    select.form-control { appearance: auto; }
    .form-check { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .mt-8 { margin-top: 8px; }
    .mt-16 { margin-top: 16px; }

    /* Toast */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      padding: 8px 20px; border-radius: 8px; font-size: 13px; z-index: 100;
      color: #fff; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }

    /* Assistant modal */
    .assistant-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 120;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .assistant-modal {
      width: min(760px, 96vw); max-height: 86vh; overflow: auto;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px;
    }
    .assistant-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .assistant-title { font-size: 14px; font-weight: 600; color: var(--accent); }
    .assistant-body { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .assistant-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <h1>金智汇连ETL</h1>
      <span style="color:var(--text-dim);font-size:12px">/</span>
      <input id="wf-name-input" placeholder="工作流名称" value="未命名工作流">
      <input id="wf-desc-input" placeholder="工作流描述（可选）" style="width:260px;margin-left:8px">
    </div>
    <div class="topbar-actions">
      <span style="color:var(--text-dim);font-size:11px;margin-right:4px" title="滚轮缩放，中键拖拽画布">🖱️ 滚轮缩放 / 中键拖拽</span>
      <button class="btn btn-secondary" onclick="openWorkflowAssistant()">🤖 AI 辅助</button>
      <button class="btn" onclick="clearAll()" title="清空画布">清空</button>
      <button class="btn btn-primary" onclick="saveWorkflow()">保存工作流</button>
      <button class="btn" onclick="window.close()">关闭</button>
    </div>
  </div>

  <div class="editor-wrap">
    <div class="palette" id="palette">
      <div class="text-dim" style="font-size:12px">加载中...</div>
    </div>
    <div class="canvas-wrap">
      <div id="drawflow"></div>
    </div>
    <div class="props-panel" id="props-panel">
      <div class="props-placeholder">点击画布中的节点<br>查看和编辑属性</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="assistant-overlay" id="assistant-overlay">
    <div class="assistant-modal">
      <div class="assistant-head">
        <div class="assistant-title">🤖 工作流 AI 交互式助手</div>
        <button class="btn btn-sm" onclick="closeWorkflowAssistant()">关闭</button>
      </div>
      <div class="assistant-body">
        <div class="form-group">
          <label>辅助模式</label>
          <select id="assistant-mode" class="form-control">
            <option value="wizard">新手引导</option>
            <option value="troubleshoot">故障排查</option>
          </select>
        </div>
        <div class="form-group">
          <label>你的目标</label>
          <textarea id="assistant-goal" class="form-control" rows="3" placeholder="例如：把分钟线转换为日线并计算 MA5/MA10"></textarea>
        </div>
        <div class="form-group">
          <label>最近错误信息（可选）</label>
          <textarea id="assistant-last-error" class="form-control" rows="2" placeholder="粘贴报错后可获得更精准建议"></textarea>
        </div>
        <div id="assistant-result" style="font-size:12px;color:var(--text-dim)"></div>
      </div>
      <div class="assistant-actions">
        <button class="btn btn-secondary" onclick="applyWorkflowAssistantAction('open_workflow_templates')">模板建议</button>
        <button class="btn btn-primary" onclick="generateWorkflowAssistantGuide(this)">生成引导建议</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/drawflow@0.0.59/dist/drawflow.min.js"></script>
  <script>
    // ---------- API Key auto-fetch ----------
    let _apiAuthKey = '';
    (async function initApiKey() {
      try {
        const res = await fetch('/api/auth/key');
        if (res.ok) { _apiAuthKey = (await res.json()).api_key || ''; }
      } catch (e) {}
    })();
    async function ensureApiKey() {
      if (_apiAuthKey) return _apiAuthKey;
      try {
        const res = await fetch('/api/auth/key');
        if (res.ok) { _apiAuthKey = (await res.json()).api_key || ''; }
      } catch (e) {}
      return _apiAuthKey;
    }

    // ---------- Global state ----------
    let editor;
    const NODE_CATEGORIES = {
      '数据接入': [
        { type: 'source_fetch', label: '数据源拉取', icon: '📥' },
        { type: 'contract_list', label: '合约列表', icon: '📋' },
      ],
      '数据输出': [
        { type: 'target_write', label: '写入目标库', icon: '💾' },
      ],
      '指标计算': [
        { type: 'resample', label: '周期重采样', icon: '📊' },
        { type: 'ma', label: '移动平均', icon: '📈' },
        { type: 'macd', label: 'MACD', icon: '📉' },
        { type: 'rsi', label: 'RSI', icon: '🔢' },
        { type: 'boll', label: '布林带', icon: '🎯' },
      ],
      '数据处理': [
        { type: 'filter', label: '数据过滤', icon: '🔍' },
        { type: 'sort', label: '排序', icon: '↕️' },
        { type: 'group_by', label: '分组聚合', icon: '📋' },
        { type: 'column_rename', label: '列重命名', icon: '✏️' },
        { type: 'expression', label: '表达式计算', icon: '🔢' },
      ],
      '流程控制': [
        { type: 'condition', label: '条件分支', icon: '🔀' },
      ],
      '高级': [
        { type: 'custom_python', label: '自定义脚本', icon: '🐍' },
      ],
      '数据接入': [
        { type: 'source_fetch', label: '数据源拉取', icon: '📥' },
      ],
      '数据输出': [
        { type: 'target_write', label: '写入目标库', icon: '📤' },
      ],
      '数据优化': [
        { type: 'dedup', label: '数据去重', icon: '🧹' },
        { type: 'time_window', label: '时间窗口分批', icon: '⏱️' },
      ],
    };

    // Node parameter defaults
    const NODE_DEFAULTS = {
      resample: { rule: '30min', time_column: 'dt', group_column: '' },
      ma: { windows: '5,10,20', source_column: 'close', use_ema: false },
      macd: { fast: 12, slow: 26, signal: 9, source_column: 'close' },
      rsi: { window: 14, source_column: 'close' },
      boll: { window: 20, std_mult: 2, source_column: 'close' },
      filter: { mode: 'keep', conditions: [] },
      sort: { by: 'dt', ascending: true },
      group_by: { group_by: 'code', aggregations: 'close=last,vol=sum' },
      column_rename: { renames: 'code=stock_code,dt=trade_time' },
      expression: { target_column: 'new_col', expression: "df['open'] + df['close']" },
      condition: { condition: "df['close'] > 0", branch: 'true' },
      custom_python: { code: 'def process(df):\n    return df' },
      source_fetch: { source_type: 'tdx', codes: '000001,600000', interval: '1min', time_mode: 'lookback', lookback_days: 30, session_only: true, parallel: false, max_workers: 4 },
      contract_list: { market_type: 'all', product: '', exchange: '', search: '', limit: 500, auto_sync: false },
      target_write: { target_type: 'duckdb', target_table: 'stock_minute_kline', batch_size: 5000, on_duplicate: 'ignore' },
      dedup: { mode: 'keep_last', columns: 'code,dt' },
      time_window: { window_size: 7, window_step: 7, time_column: 'dt', sort_first: true },
    };

    const NODE_COLORS = {
      resample: '#6366f1', ma: '#22c55e', macd: '#f59e0b', rsi: '#38bdf8', boll: '#ec4899',
      filter: '#6366f1', sort: '#22c55e', group_by: '#22c55e', column_rename: '#f59e0b',
      expression: '#f59e0b', condition: '#ec4899', custom_python: '#ec4899',
      source_fetch: '#06b6d4', contract_list: '#14b8a6', target_write: '#8b5cf6', dedup: '#14b8a6', time_window: '#f97316',
    };

    let workflowId = null;
    let nodeTypeList = [];
    let currentSelectedNodeId = null;  // 保存当前选中的节点ID

    // 读取与主界面一致的主题设置（默认深色）
    function getTheme() {
      return localStorage.getItem('theme') || 'dark';
    }

    // 应用主题到当前文档根节点，触发 CSS 变量切换
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
    }

    // ---------- Init ----------
    async function init() {
      // 页面初始化时先同步一次主题，避免出现背景色闪烁或不一致
      applyTheme(getTheme());

      const url = new URL(window.location.href);
      workflowId = url.searchParams.get('id');

      // Init Drawflow
      const el = document.getElementById('drawflow');
      editor = new Drawflow(el, 'html', null);
      editor.reroute = true;
      editor.reroute_fix_curvature = true;
      editor.editor_mode = 'edit';

      // 在 editor.start() 之前绑定事件（确保优先级高于 Drawflow 内部事件）
      // 滚轮缩放（不需要 Ctrl 键）
      el.addEventListener('wheel', function(e) {
        e.preventDefault();
        e.stopPropagation();
        if (e.deltaY > 0) {
          editor.zoom_out();
        } else {
          editor.zoom_in();
        }
      }, { passive: false, capture: true });

      // 鼠标中键拖拽画布
      let isPanning = false;
      let panStartX = 0, panStartY = 0;
      let panStartCX = 0, panStartCY = 0;

      el.addEventListener('mousedown', function(e) {
        if (e.button === 1) {
          e.preventDefault();
          e.stopPropagation();
          isPanning = true;
          panStartX = e.clientX;
          panStartY = e.clientY;
          panStartCX = editor.canvas_x;
          panStartCY = editor.canvas_y;
          el.style.cursor = 'grabbing';
          editor.editor_selected = true;
        }
      }, { capture: true });

      document.addEventListener('mouseup', function(e) {
        if (isPanning && e.button === 1) {
          isPanning = false;
          editor.editor_selected = false;
          el.style.cursor = '';
        }
      });

      document.addEventListener('mousemove', function(e) {
        if (!isPanning) return;
        e.preventDefault();
        const dx = e.clientX - panStartX;
        const dy = e.clientY - panStartY;
        editor.canvas_x = panStartCX + dx;
        editor.canvas_y = panStartCY + dy;
        const precanvas = editor.precanvas || el.querySelector('.drawflow');
        if (precanvas) {
          precanvas.style.transform = 'translate(' + editor.canvas_x + 'px, ' + editor.canvas_y + 'px) scale(' + editor.zoom + ')';
        }
      }, { passive: false });

      editor.start();

      // Drawflow 0.0.59 API:
      //   zoom_in() / zoom_out() / zoom_reset() — 缩放
      //   precanvas — 被 transform 的元素 (.drawflow)
      //   canvas_x / canvas_y — 画布偏移
      //   zoom — 当前缩放值（默认 1）

      // 启用缩放范围
      editor.zoom = true;
      editor.zoom_max = 2;
      editor.zoom_min = 0.2;

      // Events
      editor.on('nodeSelected', onNodeSelected);
      editor.on('nodeUnselected', onNodeUnselected);
      editor.on('nodeRemoved', onNodeRemoved);

      // Drag & drop from palette
      el.addEventListener('dragover', e => e.preventDefault());
      el.addEventListener('drop', onDropNode);

      // Load node types & build palette
      await loadNodeTypes();

      // Load existing workflow
      if (workflowId) {
        await loadWorkflow(workflowId);
      }

      onNodeUnselected();
    }

    async function loadNodeTypes() {
      try {
        const res = await api('/api/workflows/nodes');
        nodeTypeList = res.nodes || [];
      } catch (e) {
        console.error('Failed to load node types:', e);
        // Fallback to hardcoded list
      }
      buildPalette();
    }

    function buildPalette() {
      const palette = document.getElementById('palette');
      let html = '';
      for (const [cat, nodes] of Object.entries(NODE_CATEGORIES)) {
        html += `<div class="palette-section"><div class="palette-title">${cat}</div>`;
        for (const n of nodes) {
          html += `<div class="palette-item" draggable="true" data-type="${n.type}"
                       ondragstart="onDragStart(event, '${n.type}')">
                     <span class="icon">${n.icon}</span><span>${n.label}</span>
                   </div>`;
        }
        html += '</div>';
      }
      palette.innerHTML = html;
    }

    // ---------- Drag & Drop ----------
    function onDragStart(e, type) {
      e.dataTransfer.setData('node-type', type);
      e.dataTransfer.effectAllowed = 'copy';
    }

    function onDropNode(e) {
      e.preventDefault();
      const type = e.dataTransfer.getData('node-type');
      if (!type) return;

      // Use canvas-wrap for bounding rect (has explicit flex sizing)
      const container = document.querySelector('.canvas-wrap');
      const rect = container.getBoundingClientRect();
      const scale = editor.scale || 1;
      const panX = editor.canvas_x || 0;
      const panY = editor.canvas_y || 0;
      const x = (e.clientX - rect.left - panX) / scale;
      const y = (e.clientY - rect.top - panY) / scale;

      addNodeToCanvas(type, x, y);
    }

    // ---------- Node management ----------
    function findNodeMeta(type) {
      for (const nodes of Object.values(NODE_CATEGORIES)) {
        for (const n of nodes) if (n.type === type) return n;
      }
      return null;
    }

    function addNodeToCanvas(type, x, y, params = null, origId = null) {
      const meta = findNodeMeta(type);
      const label = meta ? meta.label : type;
      const icon = meta ? meta.icon : '⬢';
      const color = NODE_COLORS[type] || '#6366f1';

      const data = {
        nodeType: type,
        parameters: params || { ...NODE_DEFAULTS[type] || {} },
        label: label,
        icon: icon,
        origId: origId,  // preserve original workflow ID for save/load
      };

      const html = `
        <div class="title" style="border-left-color:${color}">${icon} ${label}</div>
        <div class="content" data-content>${formatParamSummary(data.parameters)}</div>
      `;

      editor.addNode(label, 1, 1, x, y, label, data, html);
    }

    function formatParamSummary(params) {
      if (!params || Object.keys(params).length === 0) return '无参数';
      const items = [];
      for (const [k, v] of Object.entries(params)) {
        let sv = v;
        if (typeof v === 'object') sv = JSON.stringify(v).substring(0, 30);
        else sv = String(v).substring(0, 30);
        items.push(`${k}: ${sv}`);
      }
      return items.join('<br>');
    }

    // ---------- Node selection & properties ----------
    function onNodeSelected(nodeId) {
      currentSelectedNodeId = String(nodeId).replace(/^node-/, '');
      // Drawflow 内部路径: editor.drawflow.drawflow[module].data
      const store = editor.drawflow && editor.drawflow.drawflow ? editor.drawflow.drawflow[editor.module || 'Home']?.data : null;
      const node = store && store[nodeId] ? store[nodeId] : editor.getNodeFromId(nodeId);
      if (!node) return;

      console.log('onNodeSelected id=' + nodeId + ' ascending=' + JSON.stringify(node.data?.parameters?.ascending));
      console.log('store keys:', Object.keys(store || {}));

      const meta = findNodeMeta(node.data.nodeType);
      const color = NODE_COLORS[node.data.nodeType] || '#6366f1';
      const panel = document.getElementById('props-panel');

      let html = `
        <h3 style="color:${color}">${node.data.icon} ${node.data.label}</h3>
        <div class="form-group">
          <label>节点类型</label>
          <input class="form-control" value="${node.data.nodeType}" readonly>
        </div>
        ${renderParamsFields(node.data.nodeType, node.data.parameters || {})}
        <button class="btn btn-secondary btn-sm mt-8" onclick="applyParamsForNode('${nodeId}')">应用参数</button>

    function applyParamsForNode(nodeId) {
      if (!nodeId) { toast('请先选中一个节点', 'warning'); return; }

      const panel = document.getElementById('props-panel');
      // Drawflow 内部路径: editor.drawflow.drawflow[module].data
      const store = editor.drawflow && editor.drawflow.drawflow ? editor.drawflow.drawflow[editor.module || 'Home']?.data : null;
      if (!store || !store[nodeId]) { toast('节点不存在', 'error'); return; }
      const node = store[nodeId];

      // 从表单读取参数
      const params = {};

      panel.querySelectorAll('input:not([type=checkbox]), select, textarea').forEach(el => {
        const k = el.dataset.param;
        if (!k) return;
        let val = el.value;
        if (el.type === 'number') val = isNaN(Number(val)) ? val : Number(val);
        params[k] = val;
      });

      panel.querySelectorAll('input[type=checkbox]').forEach(el => {
        const k = el.dataset.param;
        if (!k) return;
        params[k] = el.checked;
      });

      console.log('applyParamsForNode id=' + nodeId + ' params=' + JSON.stringify(params));
      console.log('Before: node.data.parameters=' + JSON.stringify(node.data.parameters));

      // 直接修改 Drawflow 内部存储（store 是引用）
      node.data.parameters = params;

      console.log('After: node.data.parameters=' + JSON.stringify(node.data.parameters));

      // 更新画布上的节点卡片显示
      const domNode = document.getElementById('node-' + nodeId);
      if (domNode) {
        const contentEl = domNode.querySelector('[data-content]');
        if (contentEl) contentEl.innerHTML = formatParamSummary(params);
      }

      // 重新渲染属性面板
      const color = NODE_COLORS[node.data.nodeType] || '#6366f1';
      panel.innerHTML = `
        <h3 style="color:${color}">${node.data.icon} ${node.data.label}</h3>
        <div class="form-group">
          <label>节点类型</label>
          <input class="form-control" value="${node.data.nodeType}" readonly>
        </div>
        ${renderParamsFields(node.data.nodeType, params)}
        <button class="btn btn-secondary btn-sm mt-8" onclick="applyParamsForNode('${nodeId}')">应用参数</button>
        <button class="btn btn-danger btn-sm mt-16" onclick="deleteSelectedNode('${nodeId}')">删除节点</button>
      `;

      toast('参数已更新', 'success');
    }

    // ---------- Save / Load ----------
    async function saveWorkflow() {
      const name = document.getElementById('wf-name-input').value.trim();
      if (!name) { alert('请输入工作流名称'); return; }
      const description = document.getElementById('wf-desc-input').value.trim();

      const exportData = editor.export();
      const nodes = [];
      const connections = {};

      // Map: drawflow_id -> orig_id for saving, orig_id -> drawflow_id for connecting
      const idMap = {};

      if (exportData.drawflow && exportData.drawflow.Home && exportData.drawflow.Home.data) {
        const dfNodes = exportData.drawflow.Home.data;
        // 先完整建立 drawflow_id -> orig_id 映射，避免单遍保存时出现“目标节点还未入表”的情况。
        for (const [key, dfNode] of Object.entries(dfNodes)) {
          const drawflowId = key.replace('node-', '');
          const origId = dfNode.data.origId || drawflowId;
          idMap[drawflowId] = origId;
        }
        // 再写节点和连接，确保连接里落库的是稳定的 orig_id。
        for (const [key, dfNode] of Object.entries(dfNodes)) {
          const drawflowId = key.replace('node-', '');
          const origId = dfNode.data.origId || drawflowId;

          nodes.push({
            id: origId,
            type: dfNode.data.nodeType,
            parameters: dfNode.data.parameters || {},
          });
          // Build connections using orig_ids
          if (dfNode.outputs && dfNode.outputs.output_1 && dfNode.outputs.output_1.connections) {
            const targets = dfNode.outputs.output_1.connections
              .filter(c => c.node)
              .map(c => {
                const tgtDfId = String(c.node);
                // 目标节点不存在映射时丢弃该边，避免把临时 drawflow_id 持久化到 workflow_json。
                return idMap[tgtDfId];
              });
            // 过滤掉无效边，避免“保存后连线丢失/断边”。
            const validTargets = targets.filter(Boolean);
            if (validTargets.length) {
              connections[origId] = validTargets;
            }
          }
        }
      }

      const body = {
        name,
        description,
        workflow_json: { nodes, connections },
      };

      try {
        if (workflowId) {
          await api(`/api/workflows/${workflowId}`, { method: 'PUT', body: JSON.stringify(body) });
        } else {
          const res = await api('/api/workflows/', { method: 'POST', body: JSON.stringify(body) });
          workflowId = res.id;
        }
        toast('保存成功', 'success');
        // 通知父窗口刷新工作流列表
        if (window.opener && typeof window.opener.refreshWorkflows === 'function') {
          window.opener.refreshWorkflows();
        }
      } catch (e) {
        toast('保存失败: ' + e.message, 'error');
      }
    }

    async function loadWorkflow(id) {
      try {
        const wf = await api(`/api/workflows/${id}`);
        document.getElementById('wf-name-input').value = wf.name || '';
        document.getElementById('wf-desc-input').value = wf.description || '';
        const wfJson = wf.workflow_json;
        if (!wfJson || !wfJson.nodes) return;

        // Clear existing nodes
        const exportData = editor.export();
        if (exportData.drawflow && exportData.drawflow.Home && exportData.drawflow.Home.data) {
          for (const key of Object.keys(exportData.drawflow.Home.data)) {
            editor.removeNodeId(key);
          }
        }

        // Map: orig_id -> drawflow_id
        const dfIdMap = {};

        // Load nodes with origId
        let x = 100, y = 80;
        for (const node of wfJson.nodes) {
          addNodeToCanvas(node.type, x, y, node.parameters || {}, node.id);
          dfIdMap[node.id] = null; // will be filled after addNodeToCanvas
          x += 240;
          if (x > 600) { x = 100; y += 150; }
        }

        // Build the mapping from orig_id to drawflow_id
        const freshExport = editor.export();
        if (freshExport.drawflow && freshExport.drawflow.Home) {
          for (const [key, dfNode] of Object.entries(freshExport.drawflow.Home.data)) {
            const dfId = key.replace('node-', '');
            if (dfNode.data.origId) {
              dfIdMap[dfNode.data.origId] = dfId;
            }
          }
        }

        // Load connections
        const connPairs = wfJson.connections || {};
        for (const [srcId, targets] of Object.entries(connPairs)) {
          for (const tgtId of (Array.isArray(targets) ? targets : [targets])) {
            const finalTgt = typeof tgtId === 'object' ? (tgtId.node || tgtId.id) : tgtId;
            connectNodesByDataId(srcId, String(finalTgt), dfIdMap);
          }
        }

        try { if (typeof editor.zoomReset === 'function') editor.zoomReset(); } catch(e) {}
      } catch (e) {
        console.error('Failed to load workflow:', e);
      }
    }

    function connectNodesByDataId(srcDataId, tgtDataId, dfIdMap) {
      // 将工作流 JSON 中稳定的节点 ID 映射回画布 drawflow_id 后再连线。
      const srcDfId = dfIdMap[String(srcDataId)];
      const tgtDfId = dfIdMap[String(tgtDataId)];
      // 缺任一端节点则跳过，避免抛异常中断后续连线恢复。
      if (!srcDfId || !tgtDfId) return;
      try {
        // Drawflow connect 接受“纯数字字符串节点 ID”，不带 node- 前缀。
        editor.addConnection(String(srcDfId), String(tgtDfId), 'output_1', 'input_1');
      } catch (e) {
        // 忽略重复边或非法边错误，确保其余连线继续恢复。
        console.debug('connect failed:', srcDataId, '->', tgtDataId, e?.message || e);
      }
    }

    function clearAll() {
      if (!confirm('确定清空画布所有节点？')) return;
      const exportData = editor.export();
      if (exportData.drawflow && exportData.drawflow.Home && exportData.drawflow.Home.data) {
        for (const key of Object.keys(exportData.drawflow.Home.data)) {
          editor.removeNodeId(key);
        }
      }
      onNodeUnselected();
    }

    // ---------- API helper ----------
    async function api(url, options = {}) {
      const apiKey = await ensureApiKey();
      const res = await fetch(url, {
        method: options.method || 'GET',
        headers: {
          'Content-Type': 'application/json',
          ...(apiKey ? { 'X-API-Key': apiKey } : {}),
          ...options.headers,
        },
        body: options.body,
      });
      if (!res.ok) {
        const err = await res.text();
        throw new Error(`${res.status}: ${err}`);
      }
      return res.json();
    }

    function escapeHtml(value) {
      // 统一转义，避免将建议内容直接插入 HTML 时引起展示异常。
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    async function trackAssistantEvent(eventName, payload = {}) {
      // 工作流编辑器同样上报助手埋点，保持主界面和编辑器统计口径一致。
      try {
        await api('/api/llm/assistant-event', {
          method: 'POST',
          body: JSON.stringify({ event_name: eventName, scene: 'workflow', payload }),
        });
      } catch (e) {
        console.debug('assistant event ignored:', e.message);
      }
    }

    function openWorkflowAssistant() {
      // 打开工作流助手弹层，优先用于节点链路和参数引导。
      const el = document.getElementById('assistant-overlay');
      if (!el) return;
      el.style.display = 'flex';
      trackAssistantEvent('assistant_opened', { mode: 'wizard', from: 'workflow_editor' });
    }

    function closeWorkflowAssistant() {
      const el = document.getElementById('assistant-overlay');
      if (!el) return;
      el.style.display = 'none';
    }

    function applyWorkflowAssistantAction(action) {
      // 为工作流编辑器提供最小可执行动作，避免仅给纯文本建议。
      if (action === 'open_workflow_templates') {
        toast('建议优先使用“分钟转日线/均线生成”模板作为起点', 'success');
        trackAssistantEvent('assistant_action_applied', { action });
      }
      if (action === 'zoom_reset') {
        try { if (typeof editor.zoomReset === 'function') editor.zoomReset(); } catch(e) {}
        trackAssistantEvent('assistant_action_applied', { action });
      }
    }

    async function generateWorkflowAssistantGuide(triggerBtn = null) {
      // 根据当前画布节点结构和用户目标生成步骤化建议。
      const host = document.getElementById('assistant-result');
      if (!host) return;
      const mode = document.getElementById('assistant-mode')?.value || 'wizard';
      const goal = document.getElementById('assistant-goal')?.value || '';
      const lastError = document.getElementById('assistant-last-error')?.value || '';
      const graph = editor.export();
      const nodeCount = Object.keys(graph?.drawflow?.Home?.data || {}).length;
      // 点击后立即更新按钮状态，给出明确的 loading 反馈。
      const originalBtnText = triggerBtn ? triggerBtn.textContent : '';
      if (triggerBtn) {
        triggerBtn.disabled = true;
        triggerBtn.textContent = '生成中...';
      }
      host.innerHTML = '<span style="color:var(--text-dim)">AI 正在生成建议...</span>';
      try {
        const res = await api('/api/llm/assistant-guide', {
          method: 'POST',
          body: JSON.stringify({
            scene: 'workflow',
            mode,
            goal,
            last_error: lastError,
            current_config: { node_count: nodeCount },
          }),
        });
        const steps = (res.steps || []).map((s, idx) =>
          `<li><strong>${idx + 1}. ${escapeHtml(s.title)}</strong> - ${escapeHtml(s.detail)}</li>`
        ).join('');
        const checks = (res.checks || []).map(c => `<li>${escapeHtml(c)}</li>`).join('');
        const troubles = (res.troubleshoot || []).map(t => `<li>${escapeHtml(t)}</li>`).join('');
        host.innerHTML = `
          <div style="background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.2);border-radius:8px;padding:10px;margin-bottom:8px">
            <strong>结论：</strong>${escapeHtml(res.summary || '')}
          </div>
          <div style="margin-bottom:8px"><strong>推荐步骤</strong><ol style="padding-left:18px">${steps || '<li>暂无建议</li>'}</ol></div>
          <div style="margin-bottom:8px"><strong>自检清单</strong><ul style="padding-left:18px">${checks || '<li>暂无清单</li>'}</ul></div>
          ${troubles ? `<div><strong>故障诊断</strong><ul style="padding-left:18px">${troubles}</ul></div>` : ''}
          <div style="margin-top:8px">
            <button class="btn btn-secondary btn-sm" onclick="applyWorkflowAssistantAction('zoom_reset')">重置画布缩放</button>
          </div>
        `;
        trackAssistantEvent('assistant_guidance_generated', { mode, hasError: !!lastError, nodeCount });
      } catch (e) {
        host.innerHTML = `<span style="color:var(--danger)">建议生成失败：${escapeHtml(e.message)}</span>`;
      } finally {
        // 请求完成后恢复按钮状态，允许用户继续发起下一次生成。
        if (triggerBtn) {
          triggerBtn.disabled = false;
          triggerBtn.textContent = originalBtnText || '生成引导建议';
        }
      }
    }

    // ---------- Toast ----------
    function toast(msg, type = 'success') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      setTimeout(() => el.className = 'toast', 2000);
    }

    // ---------- Start ----------
    window.addEventListener('DOMContentLoaded', init);

    // 监听其它窗口主题切换（主界面切换时可实时同步）
    window.addEventListener('storage', (event) => {
      if (event.key === 'theme') {
        applyTheme(event.newValue || 'dark');
      }
    });
  </script>
