async function loadCredentialSelect() {
  const sel = document.getElementById('ks-cfg-credential_id');
  if (!sel) return;
  const creds = await api('/api/credentials/for-select/');
  const currentVal = sel.value;
  sel.innerHTML = '<option value="">— 不使用凭证，手动填写认证信息 —</option>' +
    creds.map(c => `<option value="${c.id}">${c.name} (${labelCredentialType(c.type)})</option>`).join('');
  if (currentVal) sel.value = currentVal;
}

async function onCredSelectChange(credId) {
  if (!credId) return;
  try {
    const cred = await api(`/api/credentials/${credId}`);
    const cfg = cred.config || {};
    const credType = cred.type || '';
    // Inject into headers
    const headersEl = document.getElementById('ks-cfg-headers');
    if (headersEl) {
      let headers = {};
      try { headers = JSON.parse(headersEl.value || '{}'); } catch(e) {}
      if (cfg.token && credType !== 'apikey') {
        headers['Authorization'] = `Bearer ${cfg.token}`;
      } else if (cfg.username && cfg.password) {
        headers['Authorization'] = `Basic ${btoa(cfg.username + ':' + cfg.password)}`;
      }
      headersEl.value = JSON.stringify(headers, null, 2);
    }
    // Inject base_url from credential
    const baseUrlEl = document.getElementById('ks-cfg-base_url');
    if (baseUrlEl && cfg.base_url) {
      baseUrlEl.value = cfg.base_url;
    }
    // Inject into request_template for tushare_token type
    const reqTmpl = document.getElementById('ks-cfg-request_template');
    if (reqTmpl && cfg.token) {
      let tmpl = {};
      try { tmpl = JSON.parse(reqTmpl.value || '{}'); } catch(e) {}
      if (credType === 'tushare_token') {
        tmpl.token = cfg.token;
        reqTmpl.value = JSON.stringify(tmpl, null, 2);
      }
    }
    // 天勤凭证：注入 username/password 到 tqsdk_user/tqsdk_password 字段
    if (credType === 'tqsdk_auth') {
      const userEl = document.getElementById('ks-cfg-tqsdk_user');
      const pwdEl = document.getElementById('ks-cfg-tqsdk_password');
      if (userEl && cfg.username) userEl.value = cfg.username;
      if (pwdEl && cfg.password) pwdEl.value = cfg.password;
    }
  } catch(e) { console.error('credential inject error:', e); }
}

async function loadKlineSourceData(id) {
  try {
    const conn = await api(`/api/kline-sources/${id}`);
    document.getElementById('ks-name').value = conn.name || '';
    // 私有数据源编辑时先恢复解锁状态，再尝试选中隐藏卡片。
    if (conn.type === 'mootdx') await refreshPrivateFeatureStatusUI();
    const el = document.querySelector(`.kline-type-card[data-type="${conn.type}"]`);
    if (el) selectKsType(el, conn.type);
    if (conn.config) {
      // 编辑通达信数据源时更新缓存，后续新建可复用最近一次路径。
      if (conn.type === 'tdx' && conn.config.data_dir) cacheTdxDataDir(conn.config.data_dir);
      // Set credential_id if present
      if (conn.config.credential_id) {
        const credSel = document.getElementById('ks-cfg-credential_id');
        if (credSel) credSel.value = conn.config.credential_id;
      }
      for (const [k, v] of Object.entries(conn.config)) {
        const inp = document.getElementById(`ks-cfg-${k}`);
        if (inp) inp.value = typeof v === 'object' ? JSON.stringify(v, null, 2) : v;
      }
      // 编辑时按保存的预览模式恢复 UI，保证行为可预期。
      setDatasourcePreviewMode(conn.config.preview_mode || 'kline');
      // 编辑 HTTP 数据源时，若存在 selected_api，则恢复逐项参数映射编辑器。
      if (conn.type === 'http' && conn.config.selected_api) {
        // 支持“内置模板 + 自定义模板”回显编辑器。
        const selectedApiInfo = findApiTemplateByName(conn.config.selected_api);
        renderApiParamEditor(selectedApiInfo);
      }
    }
  } catch(e) { console.error(e); }
}

async function saveKlineSource() {
  const name = document.getElementById('ks-name').value;
  const type = document.getElementById('ks-type').value;
  if (!name || !type) { alert('请填写名称并选择类型'); return; }
  // 保存前先把“逐项参数映射”同步到 request_template，避免落库内容滞后。
  if (type === 'http') syncApiRequestTemplateFromEditor();
  const config = {};
  document.querySelectorAll('[id^="ks-cfg-"]').forEach(inp => {
    const key = inp.id.replace('ks-cfg-', '');
    if (key) {
      let val = inp.value;
      // 自动解析 JSON
      if ((key === 'headers' || key === 'request_template' || key === 'column_mapping' || key === 'subscribe_template') && val.startsWith('{')) {
        try { val = JSON.parse(val); } catch(e) {}
      }
      config[key] = val;
    }
  });
  if (type === 'http') {
    // 请求前校验模板结构，避免“请求成功但返回空数据”的静默失败体验。
    const v = validateHttpRequestTemplateConfig(config.request_template);
    if (!v.ok) { alert('配置校验失败: ' + v.message); return; }
  }
  // 保存通达信数据源时缓存目录路径，减少重复输入。
  if (type === 'tdx' && typeof config.data_dir === 'string') {
    cacheTdxDataDir(config.data_dir.trim());
  }
  const editId = document.getElementById('ks-edit-id').value;
  const btn = document.querySelector('#modal-footer .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = '保存中...'; }
  try {
    if (editId) {
      await api(`/api/kline-sources/${editId}`, { method: 'PUT', body: JSON.stringify({ name, type, config }) });
    } else {
      await api('/api/kline-sources/', { method: 'POST', body: JSON.stringify({ name, type, config }) });
    }
    closeModal();
    refreshKlineSources();
  } catch(e) { alert('保存失败: ' + e.message); }
  finally { if (btn) { btn.disabled = false; btn.textContent = '保存'; } }
}

function _hasTemplatePlaceholders(value) {
  // 检查是否包含常见占位符；用于在测试/预览前提醒模板仍是占位状态。
  if (typeof value === 'string') return /\{(codes|start_time|end_time|interval)\}/.test(value);
  if (Array.isArray(value)) return value.some(v => _hasTemplatePlaceholders(v));
  if (value && typeof value === 'object') return Object.values(value).some(v => _hasTemplatePlaceholders(v));
  return false;
}

function validateHttpRequestTemplateConfig(requestTemplate) {
  // 校验 request_template 的最小结构约束，优先拦截 params 非对象等高频错误。
  let tpl = requestTemplate;
  if (typeof tpl === 'string') {
    const raw = tpl.trim();
    if (!raw) return { ok: false, message: 'request_template 不能为空' };
    if (!raw.startsWith('{')) return { ok: false, message: 'request_template 必须是 JSON 对象' };
    try {
      tpl = JSON.parse(raw);
    } catch (e) {
      return { ok: false, message: 'request_template 不是合法 JSON' };
    }
  }
  if (!tpl || typeof tpl !== 'object' || Array.isArray(tpl)) {
    return { ok: false, message: 'request_template 必须是 JSON 对象' };
  }
  if ('params' in tpl && (!tpl.params || typeof tpl.params !== 'object' || Array.isArray(tpl.params))) {
    return { ok: false, message: 'request_template.params 必须是对象，例如 {"ts_code":"{codes}"}，不能是数组' };
  }
  if (_hasTemplatePlaceholders(tpl) && ('params' in tpl) && (!tpl.params || Object.keys(tpl.params).length === 0)) {
    return { ok: false, message: '模板存在占位符，但 params 为空，无法替换成真实请求参数' };
  }
  return { ok: true };
}

async function validateSourceTemplateById(sourceId) {
  // 列表页“测试/预览”前先读取已保存配置做结构校验，失败时直接提示并阻断请求。
  const source = await api(`/api/kline-sources/${sourceId}`, { silent: true });
  if (!source || source.error) return { ok: false, message: source?.error || '读取数据源配置失败' };
  if (source.type !== 'http') return { ok: true };
  return validateHttpRequestTemplateConfig(source?.config?.request_template);
}

async function testKlineSource(id) {
  try {
    const validateRes = await validateSourceTemplateById(id);
    if (!validateRes.ok) { alert('配置校验失败: ' + validateRes.message); return; }
    const res = await api(`/api/kline-sources/${id}/test`, { method: 'POST' });
    if (res.success) {
      // 记录数据源测试成功事件，便于后续分析问题闭环效率。
      await trackAssistantEvent('datasource_test_result', 'datasource', { success: true });
      alert('✅ ' + res.message);
      return;
    }
    // 记录数据源测试失败事件，和排查助手联动计算修复率。
    await trackAssistantEvent('datasource_test_result', 'datasource', {
      success: false,
      error: String(res.message || '数据源测试失败').slice(0, 200),
    });
    const askAI = confirm(`❌ ${res.message || '数据源测试失败'}\n\n是否打开 AI 交互式排查助手？`);
    if (!askAI) return;
    openAIAssistantModal('datasource', {
      mode: 'troubleshoot',
      sourceId: id,
      currentConfig: { source_id: id },
      lastError: res.message || '',
    });
    await generateAssistantGuide('datasource');
  } catch(e) { alert('测试失败: ' + e.message); }
}

async function previewSourceById(id) {
  try {
    const validateRes = await validateSourceTemplateById(id);
    if (!validateRes.ok) { showPreviewModal({ error: '配置校验失败: ' + validateRes.message }); return; }
    // 先读取数据源配置，按预览模式决定请求“股票列表”还是“K线样例”。
    const source = await api(`/api/kline-sources/${id}`, { silent: true });

      showPreviewModal(res, { title: 'K线样例预览' });

    showPreviewModal({ error: e.message });
  }
}

  const rawCodes = Array.isArray(res?.codes) ? res.codes : [];

    return { code: String(item || '') };
  });
  const columns = rows.length ? Object.keys(rows[0]) : ['code'];
  const summary = `${sourceName || '当前数据源'} 返回 ${res?.count ?? rows.length} 条代码`;

function inferColumnTypes(rows, columns) {
  return columns.map(c => {
    const vals = rows.slice(0, 10).map(r => r[c]).filter(v => v !== null && v !== undefined);
    if (!vals.length) return 'unknown';
    const first = String(vals[0]);
    if (/^\d+$/.test(first)) return 'integer';
    if (/^\d+\.\d+$/.test(first)) return 'float';
    if (/^\d{4}-\d{2}-\d{2}/.test(first) || /^\d{2}:\d{2}/.test(first)) return 'datetime';
    if (first.length <= 50) return 'string';
    return 'text';
  });
}

async function refreshCredentials() {
  try {
    const list = await api('/api/credentials/');

  } catch(e) { console.error(e); }

async function loadCredentialData(id) {
  try {
    const cred = await api(`/api/credentials/${id}`);
    document.getElementById('cred-name').value = cred.name || '';
    // Select the type
    const card = document.querySelector(`.cred-type-card[data-type="${cred.type}"]`);
    if (card) selectCredType(card, cred.type);
    // Fill fields (masked ones show ***)
    if (cred.config) {
      for (const [k, v] of Object.entries(cred.config)) {
        const inp = document.getElementById(`cred-cfg-${k}`);
        if (inp) inp.value = typeof v === 'object' ? JSON.stringify(v) : v;
      }
    }
  } catch(e) { console.error(e); }

function selectCredType(el, type) {

async function saveCredential() {
  const name = document.getElementById('cred-name').value;
  const type = document.getElementById('cred-type').value;
  if (!name || !type) { alert('请填写名称并选择类型'); return; }

  const config = {};
  document.querySelectorAll('[id^="cred-cfg-"]').forEach(input => {
    const key = input.id.replace('cred-cfg-', '');
    if (key && input.value) config[key] = input.value;
  });

  const editId = document.getElementById('cred-edit-id').value;
  try {
    if (editId) {
      await api(`/api/credentials/${editId}`, { method: 'PUT', body: JSON.stringify({ name, type, config }) });
    } else {
      await api('/api/credentials/', { method: 'POST', body: JSON.stringify({ name, type, config }) });
    }
    closeModal();
    refreshCredentials();
  } catch(e) { alert('保存失败: ' + e.message); }
}

async function deleteCredential(id) {
  if (!confirm('确定删除此凭证？')) return;
  try {
    await api(`/api/credentials/${id}`, { method: 'DELETE' });
    refreshCredentials();
  } catch(e) { alert('删除失败: ' + e.message); }
}

async function testCredential(id) {
  try {
    const res = await api(`/api/credentials/${id}/test`, { method: 'POST', loadingMsg: '正在测试连通性...' });
    if (res.success) {
      // 记录凭证测试成功事件，用于“失败后恢复率”统计。
      await trackAssistantEvent('credential_test_result', 'credential', { success: true });
      alert('✅ ' + res.message);
    } else {
      // 记录凭证测试失败事件，后续可关联 AI 排查转化效果。
      await trackAssistantEvent('credential_test_result', 'credential', {
        success: false,
        error: String(res.message || '未知错误').slice(0, 200),
      });
      const askAI = confirm(`❌ ${res.message || '未知错误'}\n\n是否打开 AI 交互式排查助手？`);
      if (!askAI) return;
      openAIAssistantModal('credential', { mode: 'troubleshoot' });
      const errEl = document.getElementById('assistant-last-error');
      if (errEl) errEl.value = res.message || '';
      await generateAssistantGuide('credential');
    }
  } catch(e) { alert('测试失败: ' + e.message); }
}


// ============ API 模板中心（按数据源 + 分类搜索） ============
const CUSTOM_API_TEMPLATES_KEY = 'qs_custom_api_templates_v1';

function getCustomApiTemplates() {
  // 从本地存储加载“用户自定义 API 模板”，失败时返回空数组。
  try {
    const raw = localStorage.getItem(CUSTOM_API_TEMPLATES_KEY) || '[]';
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return [];
    return parsed
      .map((item) => ({
        src: String(item?.src || 'tushare'),
        cat: String(item?.cat || 'market'),
        apiName: String(item?.apiName || '').trim(),
        desc: String(item?.desc || '自定义模板'),
        params: String(item?.params || ''),
        fields: String(item?.fields || ''),
        reqExample: String(item?.reqExample || '{}'),
        baseUrl: String(item?.baseUrl || ''),
        method: String(item?.method || 'POST').toUpperCase(),
        isCustom: true,
      }))
      .filter((item) => item.apiName);
  } catch (e) {
    return [];
  }
}

function saveCustomApiTemplates(templates) {
  // 统一保存自定义模板，避免出现 localStorage 写入格式不一致。
  const safeList = Array.isArray(templates) ? templates : [];
  localStorage.setItem(CUSTOM_API_TEMPLATES_KEY, JSON.stringify(safeList));
}

function getAllApiTemplates() {
  // 运行时合并“内置模板 + 自定义模板”，供卡片渲染和“使用接口”复用。
  return [...allApis, ...getCustomApiTemplates()];
}

function filterApiRef(query) {

  const container = document.getElementById('api-ref-cards');

  container.querySelectorAll('.api-ref-card').forEach(card => {
    const name = (card.dataset.name || '').toLowerCase();
    const desc = (card.dataset.desc || '').toLowerCase();
    card.style.display = (!q || name.includes(q) || desc.includes(q)) ? '' : 'none';
  });
}

function saveCustomApiTemplateFromModal() {
  // 保存自定义模板到本地存储，并立即刷新模板中心视图。
  const originalName = String(document.getElementById('api-tpl-original-name')?.value || '').trim();
  const src = String(document.getElementById('api-tpl-src')?.value || 'tushare').trim();
  const cat = String(document.getElementById('api-tpl-cat')?.value || 'market').trim();
  const apiName = String(document.getElementById('api-tpl-name')?.value || '').trim();
  const desc = String(document.getElementById('api-tpl-desc')?.value || '').trim();
  const params = String(document.getElementById('api-tpl-params')?.value || '').trim();
  const fields = String(document.getElementById('api-tpl-fields')?.value || '').trim();
  const baseUrl = String(document.getElementById('api-tpl-base-url')?.value || '').trim();
  const method = String(document.getElementById('api-tpl-method')?.value || 'POST').toUpperCase();
  const reqExampleRaw = String(document.getElementById('api-tpl-req-example')?.value || '{}').trim();

  if (!apiName) { alert('请填写 api_name'); return; }
  if (!desc) { alert('请填写描述'); return; }
  if (!params) { alert('请填写参数列表'); return; }
  let reqExample = '{}';
  try {
    // 保存前统一校验并格式化 reqExample，避免后续渲染时 JSON 解析失败。
    reqExample = JSON.stringify(JSON.parse(reqExampleRaw), null, 2);
  } catch (e) {
    alert('reqExample 不是合法 JSON');
    return;
  }

  const builtInConflict = allApis.some((a) => a.apiName === apiName && apiName !== originalName);
  if (builtInConflict) {
    alert(`api_name "${apiName}" 与内置模板重复，请改一个名称`);
    return;
  }
  const customApis = getCustomApiTemplates();
  const duplicate = customApis.some((a) => a.apiName === apiName && a.apiName !== originalName);
  if (duplicate) {
    alert(`api_name "${apiName}" 已存在，请改一个名称`);
    return;
  }

  const next = customApis.filter((a) => a.apiName !== originalName);
  next.push({ src, cat, apiName, desc, params, fields, reqExample, baseUrl, method, isCustom: true });
  saveCustomApiTemplates(next);
  closeModal();
  // 保存后立刻回到模板中心，用户可直接点击“使用此接口”。
  setTimeout(() => openApiRefModal(), 50);
}

function deleteCustomApiTemplate(apiName, closeThenReopen = false) {
  // 删除单个自定义模板，并按需刷新模板中心列表。
  if (!apiName) return;
  if (!confirm(`确定删除自定义模板 ${apiName} ?`)) return;
  const next = getCustomApiTemplates().filter((a) => a.apiName !== apiName);
  saveCustomApiTemplates(next);
  if (closeThenReopen) closeModal();
  setTimeout(() => openApiRefModal(), 50);
}

function stopApiTemplateSSE() {
  // 关闭仍在进行中的 SSE 会话，避免弹窗关闭后继续回写 UI。
  if (_apiTemplateSSE) {
    try { _apiTemplateSSE.close(); } catch (e) {}
    _apiTemplateSSE = null;
  }
}

function runApiTemplateSSE(docUrl, sourceHint, catHint, statusEl) {
  // SSE 解析：实时接收 progress/delta/final/error 事件。
  return new Promise((resolve, reject) => {
    stopApiTemplateSSE();
    const sseUrl = `/api/llm/api-template-from-url/stream?doc_url=${encodeURIComponent(docUrl)}&source_hint=${encodeURIComponent(sourceHint)}&cat_hint=${encodeURIComponent(catHint)}`;
    const source = new EventSource(sseUrl);
    _apiTemplateSSE = source;

    source.addEventListener('progress', (evt) => {
      try {
        const data = JSON.parse(evt.data || '{}');
        if (statusEl) statusEl.innerHTML = `<span class="log-line">⏳ ${escapeHtml(String(data.message || '处理中...'))}</span>`;
      } catch (e) {}
    });

    source.addEventListener('delta', (evt) => {
      // 这里只展示“正在流式接收”状态，避免大段模型输出淹没关键信息。
      if (statusEl) statusEl.innerHTML = '<span class="log-line">⏳ 正在流式接收模型输出...</span>';
    });

    source.addEventListener('final', (evt) => {
      try {
        const data = JSON.parse(evt.data || '{}');
        source.close();
        _apiTemplateSSE = null;
        resolve(data);
      } catch (e) {
        source.close();
        _apiTemplateSSE = null;
        reject(new Error('SSE final 数据解析失败'));
      }
    });

    source.addEventListener('error', (evt) => {
      // 后端业务错误也通过 error 事件下发，这里统一解析 message 字段。
      try {
        const data = JSON.parse(evt.data || '{}');
        if (data?.message) {
          source.close();
          _apiTemplateSSE = null;
          reject(new Error(String(data.message)));
          return;
        }
      } catch (e) {}
      source.close();
      _apiTemplateSSE = null;
      reject(new Error('SSE 连接异常，请稍后重试'));
    });
  });
}

async function generateApiTemplateByDocUrl() {
  // 调用后端 LLM 抽取接口，从文档链接生成模板草稿并回填到“自定义模板”弹窗。
  const docUrl = String(document.getElementById('api-ai-doc-url')?.value || '').trim();
  const sourceHint = String(document.getElementById('api-ai-source-hint')?.value || 'tushare').trim();
  const catHint = String(document.getElementById('api-ai-cat-hint')?.value || 'market').trim();
  if (!docUrl) { alert('请先填写文档链接'); return; }
  const btn = document.getElementById('api-ai-parse-btn');
  const statusEl = document.getElementById('api-ai-status');
  const streamMode = getCurrentLLMStreamMode();
  let progressTimer = null;
  const progressSteps = [
    '正在抓取网页文档...',
    '正在清洗正文内容...',
    '正在调用大模型抽取模板...',
    '正在校验模板字段结构...',
  ];
  let stepIdx = 0;
  if (btn) {
    // 防止重复点击触发并发解析请求。
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = '解析中...';
  }
  if (statusEl) {
    statusEl.style.display = 'block';
    statusEl.innerHTML = `<span class="log-line">⏳ ${progressSteps[0]}</span>`;
    progressTimer = setInterval(() => {
      stepIdx = (stepIdx + 1) % progressSteps.length;
      statusEl.innerHTML = `<span class="log-line">⏳ ${progressSteps[stepIdx]}</span>`;
    }, 1500);
  }
  try {
    // 全局开关控制调用模式：SSE 模式优先实时反馈，普通模式走原有 POST 接口。
    const res = streamMode === 'sse'
      ? await runApiTemplateSSE(docUrl, sourceHint, catHint, statusEl)
      : await api('/api/llm/api-template-from-url', {
          method: 'POST',
          body: JSON.stringify({ doc_url: docUrl, source_hint: sourceHint, cat_hint: catHint }),
          // 使用弹窗内状态提示，避免被弹窗遮罩层盖住看不到全局 loading。
          silent: true,
        });
    if (res?.error) {
      if (statusEl) statusEl.innerHTML = `<span class="log-danger">❌ 解析失败：${escapeHtml(res.error)}</span>`;
      alert('解析失败: ' + res.error);
      return;
    }
    const tpl = res?.template || null;
    if (!tpl || !tpl.apiName) {
      if (statusEl) statusEl.innerHTML = '<span class="log-danger">❌ 解析结果缺少 api_name，请手动补充</span>';
      alert('解析结果缺少 api_name，请手动补充');
      return;
    }
    if (statusEl) statusEl.innerHTML = '<span class="log-success">✅ 解析完成，正在打开模板编辑器...</span>';
    closeModal();
    // 解析完成后打开编辑弹窗，用户可人工修订后再保存，避免误入库。
    setTimeout(() => openCustomApiTemplateModal('', tpl), 80);
  } catch (e) {
    if (statusEl) statusEl.innerHTML = `<span class="log-danger">❌ 解析失败：${escapeHtml(String(e.message || e))}</span>`;
    alert('解析失败: ' + (e.message || e));
  } finally {
    stopApiTemplateSSE();
    if (progressTimer) clearInterval(progressTimer);
    if (btn) {
      btn.disabled = false;
      btn.textContent = '开始解析';
    }
  }
}

function defaultParamValueByName(paramName) {
  // 仅提供最小必要默认值，避免误导用户输入无关字段。
  const key = String(paramName || '').trim();
  if (!key) return '';
  if (['ts_code', 'symbol', 'code'].includes(key)) return '{codes}';
  if (['start_date', 'start_time'].includes(key)) return '{start_time}';
  if (['end_date', 'end_time'].includes(key)) return '{end_time}';
  if (key === 'freq') return '{interval}';
  if (key === 'limit') return '241';
  if (key === 'asset') return 'E';
  if (key === 'adj') return 'qfq';
  if (['period', 'interval'].includes(key)) return '{interval}';
  return '';
}

function parseApiParamKeys(paramsText) {
  // 从“a, b(xxx), c”格式提取参数名，用于构建逐项参数编辑器。
  return String(paramsText || '')
    .split(',')
    .map(part => part.trim())
    .filter(Boolean)
    .map(part => part.replace(/\(.*\)/g, '').trim())
    .filter(Boolean);
}

function parseApiReqExample(apiInfo) {
  // 统一解析 reqExample，失败时返回空对象，避免中断表单渲染。
  if (!apiInfo?.reqExample) return {};
  try { return JSON.parse(apiInfo.reqExample); } catch (e) { return {}; }
}

function buildApiParamDefs(apiInfo) {
  // 将接口文档参数转成“键 + 默认值 + placeholder”定义，供逐项映射填写。
  const defs = [];
  const keys = parseApiParamKeys(apiInfo?.params);
  const reqExample = parseApiReqExample(apiInfo);
  const src = String(apiInfo?.src || '');
  keys.forEach((key) => {
    let defaultValue = '';
    if (src === 'tushare' && reqExample?.params && reqExample.params[key] !== undefined) {
      defaultValue = String(reqExample.params[key]);
    } else if (src === 'akshare' && reqExample[key] !== undefined) {
      defaultValue = String(reqExample[key]);
    } else {
      defaultValue = defaultParamValueByName(key);
    }
    defs.push({
      key,
      defaultValue,
      placeholder: API_PARAM_PLACEHOLDERS[key] || `请按 ${apiInfo?.apiName || '接口'} 官方文档填写`,
    });
  });
  return defs;
}

function parseRequestTemplateObject(templateValue) {
  // request_template 可能是对象或 JSON 字符串，统一转为对象结构便于回填参数值。
  if (!templateValue) return null;
  if (typeof templateValue === 'object') return templateValue;
  const raw = String(templateValue || '').trim();
  if (!raw || !raw.startsWith('{')) return null;
  try { return JSON.parse(raw); } catch (e) { return null; }
}

function renderApiParamEditor(apiInfo) {
  // 仅 Tushare/AkShare 需要“逐项参数映射”编辑器，通达信保持本地目录模式。
  const editor = document.getElementById('ks-api-param-editor');
  if (!editor) return;
  const src = String(apiInfo?.src || '');
  if (!apiInfo || !['tushare', 'akshare'].includes(src)) {
    editor.innerHTML = '';
    return;
  }
  const defs = buildApiParamDefs(apiInfo);
  if (!defs.length) {
    editor.innerHTML = `
      <div class="form-group">
        <label>接口参数映射（按官方文档）</label>
        <div class="text-dim" style="font-size:12px">当前接口未预置参数，请直接编辑请求体模板。</div>
      </div>
    `;
    return;
  }
  const templateObj = parseRequestTemplateObject(document.getElementById('ks-cfg-request_template')?.value || '');
  editor.innerHTML = `
    <div class="form-group">
      <label>接口参数映射（按官方文档逐项填写）</label>
      <div class="text-dim" style="font-size:12px;margin-bottom:6px">填写后会自动同步到“请求体模板”。支持占位变量：{start_time}/{end_time}/{codes}/{interval}</div>
      ${defs.map((def) => {
        let value = def.defaultValue;
        if (templateObj) {
          // 读取现有模板值：Tushare 从 params 取值，AkShare 从顶层取值。
          const fromTemplate = src === 'tushare'
            ? templateObj?.params?.[def.key]
            : templateObj?.[def.key];
          if (fromTemplate !== undefined && fromTemplate !== null) value = String(fromTemplate);
        }
        return `
          <div class="form-row">
            <div class="form-group">
              <label>${escapeHtml(def.key)}</label>
              <input class="form-control ks-api-param-input" data-param-key="${escapeHtml(def.key)}" value="${escapeHtml(value)}" placeholder="${escapeHtml(def.placeholder)}" oninput="syncApiRequestTemplateFromEditor()">
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function syncApiRequestTemplateFromEditor() {
  // 参数映射输入发生变化时，实时重建 request_template，保证保存与测试行为一致。
  const selectedApi = document.getElementById('ks-cfg-selected_api')?.value || '';
  if (!selectedApi) return;
  const apiInfo = findApiTemplateByName(selectedApi);
  if (!apiInfo) return;
  const src = String(apiInfo.src || '');
  if (!['tushare', 'akshare'].includes(src)) return;
  const reqTemplateEl = document.getElementById('ks-cfg-request_template');
  if (!reqTemplateEl) return;

  const values = {};
  document.querySelectorAll('.ks-api-param-input').forEach((input) => {
    const key = String(input.dataset.paramKey || '').trim();
    if (!key) return;
    values[key] = String(input.value || '').trim();
  });

  let templateObj = {};
  if (src === 'tushare') {
    // SDK 模板统一映射回真实 Tushare 接口名：xxx_sdk -> xxx。
    const normalizedApiName = String(apiInfo.apiName || '').endsWith('_sdk')
      ? String(apiInfo.apiName || '').slice(0, -4)
      : String(apiInfo.apiName || '');
    // 支持模板级 SDK 模式透传，确保“使用此接口”后保存的请求体仍保留 call_mode。
    const reqExample = parseApiReqExample(apiInfo);
    const callMode = String(apiInfo?.callMode || reqExample?.call_mode || '').trim().toLowerCase();
    templateObj = { api_name: normalizedApiName, token: '{YOUR_TOKEN}', params: {}, fields: apiInfo.fields || '' };
    if (callMode === 'sdk') templateObj.call_mode = 'sdk';
    Object.entries(values).forEach(([key, value]) => {
      if (value) templateObj.params[key] = value;
    });
  } else if (src === 'akshare') {
    templateObj = { func: apiInfo.apiName };
    Object.entries(values).forEach(([key, value]) => {
      if (value) templateObj[key] = value;
    });
  }
  reqTemplateEl.value = JSON.stringify(templateObj, null, 2);
}

function fillApiTemplate(apiName, apiInfo, src) {
  const baseUrl = document.getElementById('ks-cfg-base_url');
  const method = document.getElementById('ks-cfg-method');
  const selectedApiInput = document.getElementById('ks-cfg-selected_api');
  const previewCodes = document.getElementById('ks-cfg-preview_codes');
  if (selectedApiInput) selectedApiInput.value = apiName;
  if (src === 'tushare') {
    // SDK 模板统一映射回真实 Tushare 接口名：xxx_sdk -> xxx。
    const normalizedApiName = String(apiName || '').endsWith('_sdk') ? String(apiName || '').slice(0, -4) : String(apiName || '');
    const reqExample = parseApiReqExample(apiInfo);
    const callMode = String(apiInfo?.callMode || reqExample?.call_mode || '').trim().toLowerCase();
    // 支持模板内覆写 baseUrl/method；未配置时沿用默认逻辑。
    if (baseUrl) baseUrl.value = apiInfo?.baseUrl || (apiName === 'stk_mins' ? 'http://tushare.xyz' : (callMode === 'sdk' ? '' : 'http://api.tushare.pro'));
    if (method) method.value = apiInfo?.method || 'POST';
    // 优先使用模板内 reqExample，保证“使用此接口”与模板内容一致。
    const tmpl = (reqExample && typeof reqExample === 'object' && Object.keys(reqExample).length)
      ? { ...reqExample }
      : { api_name: normalizedApiName, token: '{YOUR_TOKEN}', params: { ts_code: '{codes}', start_date: '{start_time}', end_date: '{end_time}' }, fields: apiInfo ? apiInfo.fields : '' };
    if (!tmpl.api_name) tmpl.api_name = normalizedApiName;
    // 若模板被手工改成 *_sdk，也在回填时做兜底纠正。
    if (String(tmpl.api_name).toLowerCase().endsWith('_sdk')) tmpl.api_name = String(tmpl.api_name).slice(0, -4);
    if (!tmpl.token) tmpl.token = '{YOUR_TOKEN}';
    if (!tmpl.params || typeof tmpl.params !== 'object') tmpl.params = {};
    if (callMode === 'sdk') tmpl.call_mode = 'sdk';
    const requestTemplate = document.getElementById('ks-cfg-request_template');
    if (requestTemplate) requestTemplate.value = JSON.stringify(tmpl, null, 2);
    // 先渲染映射编辑器，再通过同步函数生成最终请求体模板。
    renderApiParamEditor(apiInfo);
    syncApiRequestTemplateFromEditor();
    if (callMode === 'sdk') {
      // SDK 模式提示：主要依赖后端 tushare 包与 token，不依赖 HTTP base_url。
      addLog('Tushare SDK 模式已启用：将优先使用后端 tushare 包调用。base_url 可留空，确保 token 可用。', 'info');
    }
    // 预览阶段使用可直接命中的测试代码；任务执行阶段仍使用 request_template 占位符。
    if (previewCodes) previewCodes.value = '000001.SZ';
    const respPath = document.getElementById('ks-cfg-response_data_path');
    if (respPath) respPath.value = 'data.items';
    const colMapping = document.getElementById('ks-cfg-column_mapping');
    if (colMapping) colMapping.value = JSON.stringify({ trade_date: 'datetime', open: 'open', high: 'high', low: 'low', close: 'close', vol: 'vol', amount: 'amount' }, null, 2);
  } else if (src === 'akshare') {
    // AkShare 改为本地 Python 直连模式：base_url 非必填，仅作为兼容字段保留。
    if (baseUrl) {
      baseUrl.value = apiInfo?.baseUrl || '';
      // 显式提示该字段可留空，避免用户继续按 HTTP 网关模式配置。
      baseUrl.placeholder = '本地 AkShare 直连模式可留空';
    }
    if (method) method.value = apiInfo?.method || 'POST';
    const tmpl = { func: apiName };
    const requestTemplate = document.getElementById('ks-cfg-request_template');
    if (requestTemplate) requestTemplate.value = JSON.stringify(tmpl, null, 2);
    // 先渲染映射编辑器，再通过同步函数生成最终请求体模板。
    renderApiParamEditor(apiInfo);
    syncApiRequestTemplateFromEditor();
    // 主动提示当前模式已切换为本地直连，减少用户配置心智负担。
    addLog('AkShare 提示：当前为本地 Python 直连模式，确保后端环境已安装 akshare 包即可', 'info');
    // AkShare 预览默认使用纯 6 位代码，减少首测失败概率。
    if (previewCodes) previewCodes.value = '000001';
    const respPath = document.getElementById('ks-cfg-response_data_path');
    if (respPath) respPath.value = 'result';
  } else if (src === 'tdx') {
    // 通达信模式只允许本地目录读取，不存在远程请求体参数映射。
    renderApiParamEditor(null);
    // 通达信本地目录模式仅需要预览代码，无需 HTTP 请求体字段。
    const codesEl = document.getElementById('ks-cfg-preview_codes');
    if (codesEl) codesEl.value = '000001';
    // Show API reference info for user
    if (apiName === 'local_minute_kline') {
      addLog('通达信 local_minute_kline：已启用按周期筛选，请确认 interval 参数(1min/5min等)与本地 .1min/.5min 文件匹配', 'info');
    } else {
      addLog(`通达信 ${apiName}：请选择本地数据目录后点击"测试连接"验证`, 'info');
    }
  } else if (src === 'binance') {
    const symbols = document.getElementById('ks-cfg-symbols');
    const interval = document.getElementById('ks-cfg-interval');
    if (symbols && apiInfo.symbols) symbols.value = apiInfo.symbols;
    if (interval && apiInfo.interval) interval.value = apiInfo.interval;
    if (previewCodes) previewCodes.value = apiInfo.defaultCode || 'BTCUSDT';
    addLog('Binance 免费行情数据：无需 API Key，点击"测试连接"验证', 'info');
  } else if (src === 'yfinance') {
    const symbols = document.getElementById('ks-cfg-symbols');
    const interval = document.getElementById('ks-cfg-interval');
    if (symbols && apiInfo.symbols) symbols.value = apiInfo.symbols;
    if (interval && apiInfo.interval) interval.value = apiInfo.interval;
    if (previewCodes) previewCodes.value = apiInfo.defaultCode || 'AAPL';
    addLog('Yahoo Finance 免费数据：无需 API Key，注意部分市场数据可能有延迟', 'info');
  }
}

        ${timeCell(p.updated_at)}
        <td class="actions">
          <button class="btn btn-success btn-sm" onclick="runPipeline('${p.id}')">执行</button>
          <button class="btn btn-secondary btn-sm" onclick="previewPipeline('${p.id}')">预览</button>
          <button class="btn btn-secondary btn-sm" onclick="openPipelineModal('${p.id}')">编辑</button>
          <button class="btn btn-secondary btn-sm" onclick="showPipelineRuns('${p.id}')">记录</button>
          <button class="btn btn-danger btn-sm" onclick="deletePipeline('${p.id}')">删除</button>
        </td>
      </tr>`;
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  } catch(e) { console.error(e); }
}

let _pipelineModalData = null;
let plSourceIdx = 0;
let _pipelineSourceFields = [];
let _pipelineTargetFields = [];

function ensurePipelineModalInputsEditable() {
  // 仅修复数据流弹窗内控件，避免影响其他需要只读的弹窗字段。
  const root = document.getElementById('modal-body');
  if (!root) return;
  root.querySelectorAll('[id^="pl-"], #pl-sources-list input, #pl-sources-list select').forEach((node) => {
    if (!(node instanceof HTMLElement)) return;
    // 被工作流能力禁用的区块，尊重其禁用状态，不要强制恢复。
    if (node.closest('.pl-disabled-block')) return;
    // 在部分 Electron/Windows 环境中，动态渲染后控件可能残留不可编辑状态，这里统一恢复。
    if ('disabled' in node) node.disabled = false;
    if ('readOnly' in node) node.readOnly = false;
    node.style.pointerEvents = 'auto';
  });
}

function renderPipelineSourceFieldOptions() {
  // 将候选源字段写入 datalist，映射行的“源字段”输入框可直接下拉选择。
  const listEl = document.getElementById('pl-source-field-options');
  if (!listEl) return;
  listEl.innerHTML = _pipelineSourceFields
    .map(f => `<option value="${escapeHtml(f)}"></option>`)
    .join('');
}

function renderPipelineTargetFieldOptions() {
  // 将候选目标字段写入 datalist，映射行的“目标字段”输入框可直接下拉选择。
  const listEl = document.getElementById('pl-target-field-options');
  if (!listEl) return;
  listEl.innerHTML = _pipelineTargetFields
    .map(f => `<option value="${escapeHtml(f)}"></option>`)
    .join('');
}

async function refreshPipelineSourceFieldOptions() {
  // 汇总当前已选数据源的预览字段，形成映射下拉候选。
  const sourceIds = Array.from(document.querySelectorAll('[id^="pl-src-conn-"]'))
    .map(el => el.value)
    .filter(Boolean);
  const uniqSourceIds = Array.from(new Set(sourceIds));
  if (!uniqSourceIds.length) {
    _pipelineSourceFields = [];
    renderPipelineSourceFieldOptions();
    return;
  }

  const columnsList = await Promise.all(uniqSourceIds.map(async (sourceId) => {
    try {
      // 先读取数据源配置，根据预览模式决定取字段来源，避免“代码列表”模式混入 K 线字段。
      const sourceRes = await api(`/api/kline-sources/${sourceId}`, { silent: true });
      const previewMode = String(sourceRes?.config?.preview_mode || 'kline').toLowerCase();
      const columnMapping = sourceRes?.config?.column_mapping;
      const mappedSourceKeys = columnMapping && typeof columnMapping === 'object'
        ? Object.keys(columnMapping)
        : [];

      if (previewMode === 'codes') {
        // 代码列表模式：字段候选来自 /codes 返回结构，不再读取 /preview 的 K 线列。
        const codesRes = await api(`/api/kline-sources/${sourceId}/codes`, { silent: true });
        const codes = Array.isArray(codesRes?.codes) ? codesRes.codes : [];
        const codeFields = new Set();
        for (const item of codes) {
          if (item && typeof item === 'object' && !Array.isArray(item)) {
            Object.keys(item).forEach((k) => codeFields.add(k));
          } else if (typeof item === 'string') {
            codeFields.add('code');
          }
        }
        if (codes.length && codeFields.size === 0) {
          codeFields.add('code');
        }
        return Array.from(new Set([...Array.from(codeFields), ...mappedSourceKeys]));
      }

      // K 线模式：沿用原有预览列 + 数据样例首行 key 聚合方式。
      const previewRes = await api(`/api/kline-sources/${sourceId}/preview`, { silent: true });
      const previewColumns = Array.isArray(previewRes?.columns) ? previewRes.columns : [];
      const previewDataRows = Array.isArray(previewRes?.data) ? previewRes.data : [];
      const previewDataKeys = previewDataRows.length && previewDataRows[0] && typeof previewDataRows[0] === 'object'
        ? Object.keys(previewDataRows[0])
        : [];
      return Array.from(new Set([...previewColumns, ...previewDataKeys, ...mappedSourceKeys]));
    } catch (e) {
      console.warn('加载数据源字段失败:', sourceId, e.message);
      return [];
    }
  }));
  _pipelineSourceFields = Array.from(
    new Set(columnsList.flat().map(v => String(v || '').trim()).filter(Boolean))
  ).sort((a, b) => a.localeCompare(b, 'zh-Hans-CN'));
  renderPipelineSourceFieldOptions();
}

async function onPipelineSourceChanged() {
  // 数据源发生变化后立即刷新字段候选，确保映射下拉项与实际数据源一致。
  await refreshPipelineSourceFieldOptions();
}

function removePipelineSource(idx) {
  // 删除数据源块后同步刷新字段候选，避免保留已删除来源的字段。
  document.getElementById(`pl-src-${idx}`)?.remove();
  refreshPipelineSourceFieldOptions();
}

async function refreshPipelineTargetTables() {
  // 目标连接变化时拉取目标库表名，供“目标表名”输入框下拉建议使用。
  const targetConnId = document.getElementById('pl-target-conn')?.value;
  const tableInput = document.getElementById('pl-target-table');
  const tableOptions = document.getElementById('pl-target-table-options');
  const tableHint = document.getElementById('pl-target-table-hint');
  const initialTable = String(document.getElementById('pl-target-table-initial')?.value || '').trim();
  if (!tableInput || !tableOptions) return;
  if (!targetConnId) {
    // 未选连接时清空建议，但保留用户可能已输入的目标表文本。
    tableOptions.innerHTML = '';
    if (tableHint) tableHint.textContent = '请先选择目标连接';
    _pipelineTargetFields = [];
    renderPipelineTargetFieldOptions();
    return;
  }
  try {
    const res = await api(`/api/connections/${targetConnId}/tables`, { silent: true });
    const tables = Array.isArray(res?.tables) ? res.tables : [];
    const normalizedTables = Array.from(
      new Set(tables.map(v => String(v || '').trim()).filter(Boolean))
    ).sort((a, b) => a.localeCompare(b, 'zh-Hans-CN'));
    const currentValue = String(tableInput.value || '').trim();
    const preferredTable = currentValue || initialTable;
    tableOptions.innerHTML = normalizedTables
      .map(t => `<option value="${escapeHtml(t)}"></option>`)
      .join('');
    // 若当前为空且库里有表，默认填第一张，保证目标字段候选可自动加载。
    if (!tableInput.value && normalizedTables.length) {
      tableInput.value = preferredTable || normalizedTables[0];
    } else if (preferredTable && !tableInput.value) {
      tableInput.value = preferredTable;
    }
    if (tableHint) {
      tableHint.textContent = normalizedTables.length
        ? `已加载 ${normalizedTables.length} 张表，可直接输入新表名`
        : '未读取到现有表，可直接输入新表名';
    }
    // 目标连接/表变化后同步刷新“目标字段”候选。
    await refreshPipelineTargetFieldOptions();
  } catch (e) {
    console.warn('加载目标表列表失败:', e.message);
    tableOptions.innerHTML = '';
    if (tableHint) tableHint.textContent = '读取目标表失败，可直接输入新表名';
    _pipelineTargetFields = [];
    renderPipelineTargetFieldOptions();
  }
}

async function refreshPipelineTargetFieldOptions() {
  // 基于“目标连接 + 目标表名”拉取字段，供映射目标字段下拉候选使用。
  const targetConnId = document.getElementById('pl-target-conn')?.value;
  const targetTable = String(document.getElementById('pl-target-table')?.value || '').trim();
  if (!targetConnId || !targetTable) {
    _pipelineTargetFields = [];
    renderPipelineTargetFieldOptions();
    return;
  }
  try {
    const res = await api(
      `/api/connections/${targetConnId}/columns?table=${encodeURIComponent(targetTable)}`,
      { silent: true }
    );
    const columns = Array.isArray(res?.columns) ? res.columns : [];
    _pipelineTargetFields = Array.from(
      new Set(columns.map(v => String(v || '').trim()).filter(Boolean))
    ).sort((a, b) => a.localeCompare(b, 'zh-Hans-CN'));
    renderPipelineTargetFieldOptions();
  } catch (e) {
    console.warn('加载目标字段失败:', e.message);
    _pipelineTargetFields = [];
    renderPipelineTargetFieldOptions();
  }
}

// 分析指定工作流是否自带数据源拉取 / 写入目标库节点，用于动态启停 Pipeline 表单字段。
function analyzePipelineWorkflowCapabilities(workflowId) {
  const caps = { source_fetch: false, target_write: false };
  if (!workflowId) return caps;
  const workflows = (_pipelineModalData && _pipelineModalData.workflows) || [];
  const wf = workflows.find(w => w.id === workflowId);
  if (!wf || !wf.workflow_json) return caps;
  const types = new Set((wf.workflow_json.nodes || []).map(n => n && n.type));
  caps.source_fetch = types.has('source_fetch');
  caps.target_write = types.has('target_write');
  return caps;
}

// 工作流下拉变化时，按工作流能力禁用/启用数据源、目标存储区块，并给出明确提示。
function onPipelineWorkflowChange() {
  const workflowId = document.getElementById('pl-workflow')?.value || '';
  const caps = analyzePipelineWorkflowCapabilities(workflowId);

  const sourceWrapper = document.getElementById('pl-sources-wrapper');
  const sourceHint = document.getElementById('pl-source-hint');
  const targetRow = document.getElementById('pl-target-row');
  const targetHint = document.getElementById('pl-target-hint');

  if (sourceWrapper) {
    if (caps.source_fetch) {
      sourceWrapper.classList.add('pl-disabled-block');
      sourceWrapper.querySelectorAll('input, select, button').forEach(el => {
        el.dataset.plPrevDisabled = el.disabled ? '1' : '0';
        el.disabled = true;
      });
      if (sourceHint) {
        sourceHint.style.display = 'block';
        sourceHint.innerHTML = '💡 当前工作流已包含「数据源拉取」节点，此处配置将被忽略，由工作流独立完成拉取。';
      }
    } else {
      sourceWrapper.classList.remove('pl-disabled-block');
      sourceWrapper.querySelectorAll('input, select, button').forEach(el => {
        if (el.dataset.plPrevDisabled === '0') el.disabled = false;
        delete el.dataset.plPrevDisabled;
      });
      if (sourceHint) {
        sourceHint.style.display = 'none';
        sourceHint.innerHTML = '';
      }
    }
  }

  if (targetRow) {
    if (caps.target_write) {
      targetRow.classList.add('pl-disabled-block');
      targetRow.querySelectorAll('input, select').forEach(el => {
        el.dataset.plPrevDisabled = el.disabled ? '1' : '0';
        el.disabled = true;
      });
      if (targetHint) {
        targetHint.style.display = 'block';
        targetHint.innerHTML = '💡 当前工作流已包含「写入目标库」节点，此处目标配置将被忽略，由工作流独立完成写入。';
      }
    } else {
      targetRow.classList.remove('pl-disabled-block');
      targetRow.querySelectorAll('input, select').forEach(el => {
        if (el.dataset.plPrevDisabled === '0') el.disabled = false;
        delete el.dataset.plPrevDisabled;
      });
      if (targetHint) {
        targetHint.style.display = 'none';
        targetHint.innerHTML = '';
      }
    }
  }
}

    api('/api/connections'),
    api('/api/workflows/'),
  ]);
  _pipelineModalData = { sources, connections, workflows };
  const dbConns = connections.filter(c => ['mysql','postgresql','duckdb','clickhouse'].includes(c.type));
  let cfg = null;
  let pjson = { sources: [], target: {}, field_mappings: [], batch_size: 5000, on_duplicate: 'ignore' };
  if (editId) {
    cfg = await api(`/api/pipelines/${editId}`);
    pjson = cfg?.pipeline_json || pjson;
  }

  openModal(editId ? '编辑数据流' : '新建数据流', `
    <input type="hidden" id="pl-edit-id" value="${editId || ''}">
    <div class="form-group"><label>数据流名称</label><input class="form-control" id="pl-name" value="${cfg?.name || ''}" placeholder="每日K线同步数据流"></div>
    <div class="form-group"><label>描述</label><input class="form-control" id="pl-desc" value="${cfg?.description || ''}" placeholder="简要描述此数据流用途"></div>

    <div class="panel-title" style="margin:16px 0 8px;font-size:13px;color:var(--accent)">数据源</div>
    <div id="pl-source-hint" class="pl-capability-hint" style="display:none"></div>
    <div id="pl-sources-wrapper">
      <div id="pl-sources-list"></div>
      <button class="btn btn-secondary btn-sm" id="pl-add-source-btn" onclick="addPipelineSource()">+ 添加数据源</button>
    </div>

    <div class="panel-title" style="margin:16px 0 8px;font-size:13px;color:var(--accent)">ETL工作流（可选）</div>
    <div class="form-group">
      <select class="form-control" id="pl-workflow" onchange="onPipelineWorkflowChange()">
        <option value="">不使用工作流</option>
        ${workflows.map(w => `<option value="${w.id}" ${pjson.workflow_id === w.id ? 'selected' : ''}>${w.name}</option>`).join('')}
      </select>
    </div>

    <div class="panel-title" style="margin:16px 0 8px;font-size:13px;color:var(--accent)">目标存储</div>
    <div id="pl-target-hint" class="pl-capability-hint" style="display:none"></div>
    <div class="form-row" id="pl-target-row">
      <div class="form-group">
        <label>目标数据库连接</label>
        <select class="form-control" id="pl-target-conn" onchange="refreshPipelineTargetTables()">
          <option value="">请选择</option>
          ${dbConns.map(c => `<option value="${c.id}" ${pjson.target?.connection_id === c.id ? 'selected' : ''}>${c.name} (${labelConnectionType(c.type)})</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label>目标表名</label>
        <input type="hidden" id="pl-target-table-initial" value="${pjson.target?.table || ''}">
        <!-- 目标表支持“输入 + 下拉建议”：即使拉不到表清单，用户也可继续手工输入。 -->
        <input class="form-control" id="pl-target-table" list="pl-target-table-options" value="${pjson.target?.table || ''}" placeholder="请输入或选择目标表" oninput="refreshPipelineTargetFieldOptions()">
        <datalist id="pl-target-table-options"></datalist>
        <div id="pl-target-table-hint" class="text-dim" style="font-size:12px;margin-top:4px">请选择目标连接后加载表列表</div>
      </div>
    </div>

    <div class="panel-title" style="margin:16px 0 8px;font-size:13px;color:var(--accent)">字段映射（可选）</div>
    <datalist id="pl-source-field-options"></datalist>
    <datalist id="pl-target-field-options"></datalist>
    <div id="pl-field-mappings"></div>
    <button class="btn btn-secondary btn-sm mt-8" onclick="addPlMapping()">+ 添加映射</button>

    <div class="panel-title" style="margin:16px 0 8px;font-size:13px;color:var(--accent)">调度与配置</div>
    <div class="form-row">
      <div class="form-group">
        <label>Cron表达式</label>
        <input class="form-control" id="pl-cron" value="${cfg?.cron_expression || ''}" placeholder="0 9 * * 1-5">
      </div>
      <div class="form-group"><label>批次大小</label><input class="form-control" id="pl-batch" value="${pjson.batch_size || 5000}"></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>重复写入策略</label>
        <select class="form-control" id="pl-dup">
          <option value="ignore" ${(pjson.on_duplicate || 'ignore') === 'ignore' ? 'selected' : ''}>忽略重复</option>
          <option value="update" ${pjson.on_duplicate === 'update' ? 'selected' : ''}>更新覆盖</option>
        </select>
      </div>
    </div>
  `, `
    <button class="btn btn-secondary" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" onclick="savePipeline()">保存</button>
  `);
  // 弹窗刚渲染时先做一次输入状态兜底，避免首个字段无法编辑。
  ensurePipelineModalInputsEditable();

  plSourceIdx = 0;
  if (pjson.sources && pjson.sources.length) {
    for (const s of pjson.sources) addPipelineSource(s);
  } else {
    addPipelineSource();
  }
  const mappings = pjson.field_mappings || [];
  if (mappings.length) {
    for (const m of mappings) addPlMapping(m.source_field, m.target_field);
  }
  // 模态框初始化后同步刷新目标表、源字段和目标字段候选。
  await refreshPipelineTargetTables();
  await refreshPipelineSourceFieldOptions();
  await refreshPipelineTargetFieldOptions();
  // 按已选工作流能力，禁用/启用数据源和目标区块（编辑态也要立即生效）。
  onPipelineWorkflowChange();
}

let plMapId = 0;
function addPlMapping(src = '', tgt = '') {
  plMapId++;
  const c = document.getElementById('pl-field-mappings');
  if (!c) return;
  // 使用 append 方式新增行，避免 innerHTML 重建节点导致已填写映射被清空。
  c.insertAdjacentHTML('beforeend', `<div class="field-map-row" id="pl-map-${plMapId}">
    <input class="form-control" id="pl-src-f-${plMapId}" list="pl-source-field-options" value="${src}" placeholder="源字段">
    <input class="form-control" id="pl-tgt-f-${plMapId}" list="pl-target-field-options" value="${tgt}" placeholder="目标字段">
    <button class="btn btn-danger btn-sm btn-icon" title="删除映射" aria-label="删除映射" onclick="document.getElementById('pl-map-${plMapId}').remove()">🗑</button>
  </div>`);
  // 新增映射行后同步恢复输入状态，确保可立即输入。
  ensurePipelineModalInputsEditable();
}

async function savePipeline() {
  const name = document.getElementById('pl-name').value;
  const desc = document.getElementById('pl-desc').value;
  const workflowId = document.getElementById('pl-workflow').value;
  const targetConnId = document.getElementById('pl-target-conn').value;
  const targetTable = document.getElementById('pl-target-table').value;
  const batch = parseInt(document.getElementById('pl-batch').value) || 5000;
  const dup = document.getElementById('pl-dup').value;
  const cron = document.getElementById('pl-cron').value;

  // 按工作流能力决定哪些字段必填、哪些留空，与后端执行分支保持一致。
  const caps = analyzePipelineWorkflowCapabilities(workflowId);

  if (!name) { alert('请填写数据流名称'); return; }
  if (!caps.target_write && !targetConnId) { alert('请选择目标数据库连接'); return; }

  // Collect sources
  const sources = [];
  if (!caps.source_fetch) {
    document.querySelectorAll('[id^="pl-src-conn-"]').forEach(el => {
      const idx = el.id.replace('pl-src-conn-', '');
      const codesStr = document.getElementById(`pl-src-codes-${idx}`)?.value || '';
      const codes = codesStr ? codesStr.split(',').map(c => c.trim()).filter(c => c) : [];
      sources.push({
        connection_id: el.value,
        params: {
          codes,
          interval: document.getElementById(`pl-src-interval-${idx}`)?.value || '1min',
          lookback_days: parseInt(document.getElementById(`pl-src-lookback-${idx}`)?.value) || 10,
        }
      });
    });
  }

  // Collect field mappings
  const fieldMappings = [];
  document.querySelectorAll('[id^="pl-map-"]').forEach(row => {
    const id = row.id.replace('pl-map-', '');
    const s = document.getElementById(`pl-src-f-${id}`)?.value;
    const t = document.getElementById(`pl-tgt-f-${id}`)?.value;
    if (s && t) fieldMappings.push({ source_field: s, target_field: t });
  });

  const pipelineJson = {
    sources,
    target: caps.target_write ? {} : { connection_id: targetConnId, table: targetTable },
    field_mappings: fieldMappings,
    batch_size: batch,
    on_duplicate: dup,
  };

      });
    } else {

        method: 'POST',

      });

async function runPipeline(id) {
  try {
    // 先获取数据流详情，供阻断项修复弹窗生成上下文 SQL（如目标表名）。
    const pipelineDetail = await api(`/api/pipelines/${id}`, { silent: true });
    // 执行前先调用预检查接口，提前暴露配置问题，避免运行后才发现失败。
    const precheck = await api(`/api/pipelines/${id}/precheck`, { method: 'POST', silent: true });
    if (precheck.error) {
      showPipelinePrecheckGuideModal(id, {
        ok: false,
        errors: [String(precheck.error || '执行前检查失败')],
        warnings: [],
      }, pipelineDetail);
      return;
    }
    if (Array.isArray(precheck.errors) && precheck.errors.length) {
      showPipelinePrecheckGuideModal(id, precheck, pipelineDetail);
      return;
    }

    let forceRun = false;
    if (Array.isArray(precheck.warnings) && precheck.warnings.length) {
      // 有风险提示时要求用户二次确认，符合“先检查再决定是否继续执行”的交互预期。
      const ok = confirm(`执行前检查发现风险提示:\n- ${precheck.warnings.join('\n- ')}\n\n是否仍继续执行？`);
      if (!ok) return;
      forceRun = true;
    }

    const runUrl = forceRun ? `/api/pipelines/${id}/run?force=true` : `/api/pipelines/${id}/run`;
    const res = await api(runUrl, { method: 'POST' });
    if (res.need_confirm && res.precheck?.warnings?.length) {
      const ok = confirm(`运行前风险提示:\n- ${res.precheck.warnings.join('\n- ')}\n\n是否强制执行？`);
      if (!ok) return;
      const forced = await api(`/api/pipelines/${id}/run?force=true`, { method: 'POST' });
      alert('数据流已启动: ' + forced.message);
      setTimeout(refreshPipelines, 2000);
      return;
    }
    if (res.error) {
      const mergedErrors = [String(res.error || '执行失败')]
        .concat(Array.isArray(res.precheck?.errors) ? res.precheck.errors : []);
      showPipelinePrecheckGuideModal(id, {
        ok: false,
        errors: mergedErrors,
        warnings: Array.isArray(res.precheck?.warnings) ? res.precheck.warnings : [],
      }, pipelineDetail);
      return;
    }
    alert('数据流已启动: ' + (res.message || '已加入后台执行队列'));
    setTimeout(refreshPipelines, 2000);
  } catch(e) { alert('执行失败: ' + e.message); }
}

function buildPipelineFixSql(errors = [], pipeline = null) {
  // 根据阻断错误自动生成“可直接执行”的修复 SQL，减少用户查资料成本。
  const targetTable = String(pipeline?.pipeline_json?.target?.table || '').trim() || '<目标表名>';
  const sqlBlocks = [];
  for (const msg of (errors || [])) {
    const text = String(msg || '');
    const uniqueMatch = text.match(/PostgreSQL\s*缺少唯一约束:\s*\(([^)]+)\)/i);
    if (uniqueMatch) {
      const cols = uniqueMatch[1]
        .split(',')
        .map(v => v.trim())
        .filter(Boolean);
      if (cols.length) {
        const constraint = `${targetTable}_${cols.join('_')}_uniq`.replace(/[^a-zA-Z0-9_]/g, '_');
        const dedupeWhere = cols.map(c => `a.${c} = b.${c}`).join(' AND ');
        const sql = [
          `-- 1) 先去重（若无重复可跳过）`,
          `DELETE FROM ${targetTable} a`,
          `USING ${targetTable} b`,
          `WHERE a.ctid < b.ctid`,
          `  AND ${dedupeWhere};`,
          ``,
          `-- 2) 补唯一约束（与 ON CONFLICT 键一致）`,
          `ALTER TABLE ${targetTable}`,
          `ADD CONSTRAINT ${constraint} UNIQUE (${cols.join(', ')});`,
        ].join('\n');
        sqlBlocks.push(sql);
      }
    }
  }
  // 去重，避免同类错误生成重复 SQL。
  return Array.from(new Set(sqlBlocks));
}

function copyPipelineFixSql() {
  // 复制修复 SQL 到剪贴板，失败时回退到 execCommand。
  const el = document.getElementById('pipeline-fix-sql');
  const text = el ? String(el.value || '').trim() : '';
  if (!text) {
    alert('暂无可复制 SQL');
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => alert('已复制 SQL 到剪贴板'),
      () => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert('已复制 SQL 到剪贴板');
      }
    );
    return;
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  alert('已复制 SQL 到剪贴板');
}

function showPipelinePrecheckGuideModal(pipelineId, precheck = {}, pipeline = null) {
  // 阻断项修复引导弹窗：展示错误清单 + 可执行 SQL + 复制按钮 + 重新检查入口。
  const errors = Array.isArray(precheck.errors) ? precheck.errors : [];
  const warnings = Array.isArray(precheck.warnings) ? precheck.warnings : [];
  const sqlBlocks = buildPipelineFixSql(errors, pipeline);
  const errorHtml = errors.length
    ? `<ul style="margin:6px 0 0 18px">${errors.map(e => `<li>${escapeHtml(e)}</li>`).join('')}</ul>`
    : '<div class="text-dim">无阻断项</div>';
  const warningHtml = warnings.length
    ? `<ul style="margin:6px 0 0 18px">${warnings.map(w => `<li>${escapeHtml(w)}</li>`).join('')}</ul>`
    : '<div class="text-dim">无风险提示</div>';
  const sqlText = sqlBlocks.join('\n\n');
  const sqlHtml = sqlText
    ? `<textarea id="pipeline-fix-sql" class="form-control" rows="12" readonly style="font-family:monospace">${escapeHtml(sqlText)}</textarea>`
    : `<div class="text-dim">当前错误暂无自动 SQL 建议，请按错误提示修复后再试。</div>`;

  openModal('执行前检查未通过', `
    <div class="panel-title" style="margin-bottom:8px;color:var(--danger)">阻断项（必须修复）</div>
    ${errorHtml}
    <div class="panel-title" style="margin:14px 0 8px">风险提示</div>
    ${warningHtml}
    <div class="panel-title" style="margin:14px 0 8px">修复 SQL（可执行）</div>
    ${sqlHtml}
  `, `
    <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
    <button class="btn btn-secondary" onclick="copyPipelineFixSql()">复制 SQL</button>
    <button class="btn btn-primary" onclick="closeModal(); runPipeline('${pipelineId}')">我已修复，重新检查</button>
  `);
}

  const cls = enabled ? 'btn-success' : 'btn-secondary';

    : `定时已暂停 (${p.cron_expression.trim()})，点击启用`;

       + `title="${escapeHtml(title)}" `
       + `onclick="togglePipelineSchedule('${p.id}', ${enabled ? 0 : 1})">`
       + `${icon} ${label}</button>`;
}

async function loadAssistantMetrics() {
  // 统计助手核心漏斗 + 7天趋势 + 失败后恢复率（连接/凭证/数据源测试场景）。
  const host = document.getElementById('assistant-metrics');
  if (!host) return;
  host.innerHTML = '<span class="text-dim">统计加载中...</span>';
  try {
    const raw = await api('/api/llm/assistant-events?limit=500', { silent: true });
    // 兼容后端异常对象/包装对象返回，避免直接展开时报不可迭代错误。
    if (raw && typeof raw === 'object' && !Array.isArray(raw) && raw.error) {
      throw new Error(raw.error);
    }
    const events = Array.isArray(raw)
      ? raw
      : (Array.isArray(raw?.items) ? raw.items : []);
    const counters = { opened: 0, generated: 0, applied: 0 };
    const byScene = {};
    const trend = {};
    const sortedEvents = [...events]
      .filter(e => !!e.created_at)
      .sort((a, b) => new Date(a.created_at).getTime() - new Date(b.created_at).getTime());
    const failureQueue = { credential: [], connection: [], datasource: [] };
    let recoveredCount = 0;
    let failureCount = 0;

    const dayKey = (iso) => {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return 'unknown';
      return d.toISOString().slice(0, 10);
    };

    // 生成近7天日期索引，确保趋势展示稳定不缺天。
    const today = new Date();
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      trend[d.toISOString().slice(0, 10)] = { opened: 0, generated: 0, applied: 0 };
    }

    for (const evt of sortedEvents) {
      const scene = evt.scene || 'unknown';
      if (!byScene[scene]) byScene[scene] = { opened: 0, generated: 0, applied: 0 };
      const dKey = dayKey(evt.created_at);
      if (evt.event_name === 'assistant_opened') {
        counters.opened += 1;
        byScene[scene].opened += 1;
        if (trend[dKey]) trend[dKey].opened += 1;
      }
      if (evt.event_name === 'assistant_guidance_generated') {
        counters.generated += 1;
        byScene[scene].generated += 1;
        if (trend[dKey]) trend[dKey].generated += 1;
      }
      if (evt.event_name === 'assistant_action_applied') {
        counters.applied += 1;
        byScene[scene].applied += 1;
        if (trend[dKey]) trend[dKey].applied += 1;
      }

      // 失败后恢复率逻辑：失败测试 -> 打开 troubleshoot -> 后续测试成功。
      if (
        (evt.event_name === 'credential_test_result' ||
          evt.event_name === 'connection_test_result' ||
          evt.event_name === 'datasource_test_result') &&
        evt.payload
      ) {
        // 仅统计受支持场景，避免未知 scene 破坏口径。
        const sceneMap = { credential: 'credential', connection: 'connection', datasource: 'datasource' };
        const testScene = sceneMap[evt.scene];
        if (!testScene) continue;
        if (evt.payload.success === false) {
          failureCount += 1;
          failureQueue[testScene].push({ failedAt: evt.created_at, usedTroubleshoot: false });
        }
        if (evt.payload.success === true && failureQueue[testScene].length) {
          // 命中一次恢复后，消费最早失败记录，避免重复计数。
          const firstFailure = failureQueue[testScene].shift();
          if (firstFailure?.usedTroubleshoot) recoveredCount += 1;
        }
      }

      if (
        evt.event_name === 'assistant_opened' &&
        evt.payload?.mode === 'troubleshoot' &&
        (scene === 'credential' || scene === 'connection' || scene === 'datasource')
      ) {
        const queue = failureQueue[scene];
        if (queue && queue.length) {
          queue[queue.length - 1].usedTroubleshoot = true;
        }
      }
    }
    const genRate = counters.opened ? ((counters.generated / counters.opened) * 100).toFixed(1) : '0.0';
    const applyRate = counters.generated ? ((counters.applied / counters.generated) * 100).toFixed(1) : '0.0';
    const recoveryRate = failureCount ? ((recoveredCount / failureCount) * 100).toFixed(1) : '0.0';
    const sceneRows = Object.entries(byScene).map(([scene, data]) => `
      <tr>
        <td>${scene}</td>
        <td>${data.opened}</td>
        <td>${data.generated}</td>
        <td>${data.applied}</td>
      </tr>
    `).join('') || '<tr><td colspan="4" class="text-dim">暂无场景数据</td></tr>';
    const trendRows = Object.entries(trend).map(([date, data]) => `
      <tr>
        <td>${date}</td>
        <td>${data.opened}</td>
        <td>${data.generated}</td>
        <td>${data.applied}</td>
      </tr>
    `).join('');
    host.innerHTML = `
      <div class="stats-grid" style="margin-bottom:12px">
        <div class="stat-card"><div class="stat-label">助手打开</div><div class="stat-value accent">${counters.opened}</div></div>
        <div class="stat-card"><div class="stat-label">建议生成</div><div class="stat-value success">${counters.generated}</div></div>
        <div class="stat-card"><div class="stat-label">动作应用</div><div class="stat-value warning">${counters.applied}</div></div>
        <div class="stat-card"><div class="stat-label">生成率 / 采用率</div><div class="stat-value" style="font-size:18px">${genRate}% / ${applyRate}%</div></div>
        <div class="stat-card"><div class="stat-label">失败后恢复率</div><div class="stat-value success" style="font-size:18px">${recoveryRate}%</div></div>
      </div>
      <table class="data-table">
        <thead><tr><th>场景</th><th>打开</th><th>生成</th><th>应用</th></tr></thead>
        <tbody>${sceneRows}</tbody>
      </table>
      <div style="margin-top:12px">
        <div class="panel-title" style="font-size:13px;margin-bottom:8px">近7天趋势（助手漏斗）</div>
        <table class="data-table">
          <thead><tr><th>日期</th><th>打开</th><th>生成</th><th>应用</th></tr></thead>
          <tbody>${trendRows}</tbody>
        </table>
      </div>
    `;
  } catch (e) {
    host.innerHTML = `<div style="color:var(--danger)">统计加载失败：${escapeHtml(e.message)}</div>`;
  }
}

async function generateAiScript() {
  const prompt = document.getElementById('ai-prompt').value.trim();
  if (!prompt) {
    showAiNotice('请先输入需求描述');
    return;
  }

  const btn = document.getElementById('ai-gen-btn');
  btn.disabled = true;
  btn.textContent = '生成中...';
  document.getElementById('ai-output').value = '';

  try {
    const ctx = {
      source_type: document.getElementById('ai-ctx-source').value,
      target_type: document.getElementById('ai-ctx-target').value,
      table_name: document.getElementById('ai-ctx-table').value,
    };
    const res = await api('/api/ai-script/generate', {
      method: 'POST',
      body: JSON.stringify({ prompt, context: ctx }),
    });

    if (res.success) {
      document.getElementById('ai-output').value = res.script;
      if (res.compliance_notice) {
        showAiNotice(res.compliance_notice);
      }
      // Update remaining counter
      if (res.remaining_today >= 0) {
        const el = document.getElementById('ai-remaining');
        if (el) {
          el.textContent = `今日剩余 ${res.remaining_today}/3`;
          if (res.remaining_today === 0) {
            el.style.background = 'rgba(239,68,68,0.15)';
            el.style.color = '#ef4444';
          }
        }
      }
    } else {
      showAiNotice(res.error || res.compliance_notice || '生成失败');
    }
  } catch(e) {
    showAiNotice('网络错误：' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '生成脚本';
  }
}

async function optimizeAiScript() {
  const script = document.getElementById('ai-output').value.trim();
  if (!script) {
    showAiNotice('先生成或输入脚本');

    showAiNotice('优化失败：' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '优化脚本';
  }

function copyAiScript() {
  const code = document.getElementById('ai-output').value;
  if (!code) return;
  navigator.clipboard.writeText(code).then(() => {
    showAiNotice('已复制到剪贴板');
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = code;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showAiNotice('已复制到剪贴板');
  });
}

async function saveAiConfig() {

### 📦 各节点详解

#### 1️⃣ n1: 设置表名列表

#### 3️⃣ n3: 获取股票列表

**作用**：查询当前表的所有股票代码，存入 \`context['codes']\` 供内层循环使用。

**这是核心计算节点**，每次只处理一只股票：

5. **写入目标表** — 分别写入 \`_raw\`、\`_qfq\`、\`_hfq\` 三张表

#### 6️⃣ n6: 股票间隔等待（0.1秒）

避免 baostock 请求过快被限流。

---

#### 7️⃣ n7: 表间隔等待（2秒）

每张表处理完后休息 2 秒，给系统喘息时间。

  │   ├─ 拉取复权因子
  │   ├─ 计算复权价
  │   ├─ 写入 3 张目标表
  │   └─ 等待 0.1s
  └─ 等待 2s

第2张表 dat_60mins：
  ├─ 获取 ~5000 只股票代码
  ├─ 遍历每只股票（单股 ~35000行）
  └─ ...同上

... 重复 7 次 ...

第7张表 dat_1mins（33亿行）：
  ├─ 获取 ~5000 只股票代码
  ├─ 遍历每只股票（单股最多 ~200万行）
  └─ ...同上
\`\`\`

---

### ✅ 最终效果

| 输入 | 输出 |
|-----|------|
| 源库 7 张表 | 目标库 21 张表 |
| 共 33 亿行（dat_1mins） | \`{表名}_raw\`（未复权）|
| | \`{表名}_qfq\`（前复权）|
| | \`{表名}_hfq\`（后复权）|

---

### 💡 设计亮点

1. **嵌套循环**：外层表循环 + 内层股票循环，进度可视化到每一只股票
2. **内存友好**：单次只处理一只股票的数据，内存占用极低
3. **细粒度容错**：单只股票失败不影响其他股票，可从失败位置继续
4. **流量控制**：股票间隔 0.1s + 表间隔 2s，避免被限流

### ⚠️ 性能对比

| 维度 | 旧设计（单循环） | 新设计（嵌套循环） |
|-----|----------------|------------------|
| 循环层级 | 1 层（表） | 2 层（表 + 股票） |
| 单次处理量 | 整张表所有股票 | 单只股票 |
| 内存峰值 | 较高 | **极低** |
| 进度可视化 | 只能看到表级 | **表级 + 股票级** |
| 错误恢复 | 一张表失败需整表重跑 | **单股票失败只影响该股票** |`

// ---------- 简单 Markdown 渲染 ----------
function renderMarkdown(md) {
  if (!md) return '';
  let html = md
    // 代码块
    .replace(/\`\`\`([\s\S]*?)\`\`\`/g, (_, code) => `<pre><code>${escapeHtml(code.trim())}</code></pre>`)
    // 行内代码
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // 表格
    .replace(/^\|(.+)\|\s*\n\|[-|\s:]+\|\s*\n((?:\|.+\|\s*\n)*)/gm, (_, header, body) => {
      const ths = header.split('|').map(h => h.trim()).filter(Boolean).map(h => `<th>${h}</th>`).join('');
      const rows = body.trim().split('\n').map(row => {
        const tds = row.split('|').map(c => c.trim()).filter(Boolean).map(c => `<td>${c}</td>`).join('');
        return `<tr>${tds}</tr>`;
      }).join('');
      return `<table><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table>`;
    })
    // 标题
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    // 粗体和斜体
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // 列表
    .replace(/^(\s*)- (.+)$/gm, (_, indent, text) => {
      const level = indent.length / 2;
      return `<li data-level="${level}">${text}</li>`;
    })
    .replace(/(<li[^>]*>[\s\S]*?<\/li>)/g, '<ul>$1</ul>')
    .replace(/<\/ul>\s*<ul>/g, '')
    // 分隔线
    .replace(/^---$/gm, '<hr>')
    // 段落
    .replace(/\n\n/g, '</p><p>')
    // 换行
    .replace(/\n/g, '<br>');
  return `<p>${html}</p>`;
}

  if (!ex) {

    return;
  }

  // 获取已安装的内容包列表
  let packStatus;
  try {
    packStatus = await api('/api/content-packs/status', { silent: true });
  } catch (e) {
    alert('获取内容包状态失败：' + e.message);
    return;
  }

  // 找到第一个包含工作流的包
  const pack = (packStatus.installed_packs || []).find(p => (p.workflows || []).length > 0);
  if (!pack) {
    alert('未找到已安装的内容包，请先导入内容包');
    return;
  }

  // 用 ID 匹配索引：示例 ID 1 → 索引 0，ID 2 → 索引 1，...
  const workflowIndex = ex.id - 1;

  // 调用后端接口获取单条工作流 JSON
  try {
    const wf = await api(`/api/content-packs/workflow/${encodeURIComponent(pack.name)}/${workflowIndex}`, { silent: true });
    if (wf.error) {
      alert('获取工作流失败：' + wf.error);
      return;
    }

    // POST 到 /api/workflows/ 创建新工作流
    await api('/api/workflows/', {
      method: 'POST',
      body: JSON.stringify({
        name: wf.name,
        description: wf.description || '',
        workflow_json: wf.workflow_json || {},
      }),
    });

    alert(`✅ 已导入「${wf.name}」到 ETL 工作流列表`);
    // 刷新工作流列表（如果在 ETL 工作流页面）
    if (typeof refreshWorkflows === 'function') refreshWorkflows();
  } catch (e) {
    alert('导入失败：' + e.message);
  }
}

function toggleSelectAllPro(checked) {

async function importSelectedExamples() {
  const checkedPresets = Array.from(document.querySelectorAll('#modal-body .import-cb:checked'));
  const checkedPro = Array.from(document.querySelectorAll('#modal-body .import-cb-pro:checked'));

  if (!checkedPresets.length && !checkedPro.length) {
    alert('请先勾选要导入的预设或专业版示例');
    return;
  }

  const presets = JSON.parse(document.getElementById('modal-body').dataset.presetsCache || '[]');

  // 获取已安装包信息（用于按名称读取专业版工作流）
  let packStatus;
  try {
    packStatus = await api('/api/content-packs/status', { silent: true });
  } catch (e) {
    alert('获取内容包状态失败：' + e.message);
    return;
  }

  let ok = 0, fail = 0, total = checkedPresets.length + checkedPro.length;

  // 显示进度
  const statusDiv = document.createElement('div');
  statusDiv.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;border-radius:8px;z-index:9999;font-size:14px';
  document.body.appendChild(statusDiv);

  // 导入内置预设
  for (const cb of checkedPresets) {
    const p = presets[Number(cb.dataset.idx)];
    if (!p) continue;
    try {
      await api('/api/workflows/', {
        method: 'POST',
        body: JSON.stringify({ name: p.name, description: p.description || '', workflow_json: p.workflow_json })
      });
      ok++;
      statusDiv.textContent = `正在导入... ${ok}/${total}`;
    } catch (e) {
      fail++;
    }
  }

  // 导入专业版示例
  // 获取第一个包含工作流的包（用于按索引读取）
  const pack = (packStatus.installed_packs || []).find(p => (p.workflows || []).length > 0);

  for (const cb of checkedPro) {
    const exampleId = Number(cb.dataset.id);
    if (!pack) {
      fail++;
      continue;
    }

    // 用 ID 匹配索引：示例 ID 1 → 索引 0，ID 2 → 索引 1，...
    const workflowIndex = exampleId - 1;

    try {
      // 从后端获取单条工作流 JSON（按包名 + 索引）
      const wf = await api(`/api/content-packs/workflow/${encodeURIComponent(pack.name)}/${workflowIndex}`, { silent: true });
      if (wf.error) {
        fail++;
        continue;
      }
      // POST 到 /api/workflows/
      await api('/api/workflows/', {
        method: 'POST',
        body: JSON.stringify({ name: wf.name, description: wf.description || '', workflow_json: wf.workflow_json }),
      });
      ok++;
      statusDiv.textContent = `正在导入... ${ok}/${total}`;
    } catch (e) {
      fail++;
    }
  }

  // 移除进度条
  statusDiv.remove();

  alert(`✅ 导入完成：成功 ${ok} 项${fail ? `，失败 ${fail} 项` : ''}`);
  closeModal();
  refreshWorkflows();
}

async function refreshWorkflows() {
  try {
    const list = await api('/api/workflows/');
    const el = document.getElementById('workflows-list');
    if (!list.length) {
      el.innerHTML = '<div class="empty-state"><div class="icon">🔀</div><p>暂无工作流</p><button class="btn btn-primary" onclick="openWorkflowModal()">新建工作流</button></div>';
      return;
    }
    let html = `<div class="table-toolbar">
      <input class="table-search" id="wf-search" placeholder="搜索工作流名称、描述..." oninput="filterTableRows('wf-table', this.value)">
      <span class="text-dim" style="font-size:12px">共 ${list.length} 个</span>
    </div>
    <table class="data-table" id="wf-table"><thead><tr>
      ${thPlain('名称')}${thPlain('描述')}${thPlain('节点数')}
      ${th('创建时间', 'created_at', 'wf-table')}
      ${th('更新时间', 'updated_at', 'wf-table')}
      ${thPlain('操作')}
    </tr></thead><tbody>`;
    for (const w of list) {
      const nodes = (w.workflow_json?.nodes || []).length;
      html += `<tr>
        <td>${w.name}</td>
        <td class="text-dim">${w.description || '-'}</td>
        <td>${nodes}</td>
        ${timeCell(w.created_at)}
        ${timeCell(w.updated_at)}
        <td class="actions">
          <button class="btn btn-secondary btn-sm" onclick="openWorkflowModal('${w.id}')">编辑</button>
          <button class="btn btn-secondary btn-sm" onclick="previewWorkflow('${w.id}')">预览</button>
          <button class="btn btn-secondary btn-sm" onclick="exportWorkflowJson('${w.id}')">导出</button>
          <button class="btn btn-secondary btn-sm" onclick="importWorkflowJson()">导入</button>
          <button class="btn btn-danger btn-sm" onclick="deleteWorkflow('${w.id}')">删除</button>
        </td>
      </tr>`;
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  } catch(e) { console.error(e); }
}

async function loadPluginMarket() {
  try {
    const res = await api('/api/workflows/nodes');
    const nodes = (res.nodes || res || []).map(n => ({ ...n, ...(n.info || {}) }));
    const builtin = nodes.filter(n => n.tier === 'built-in');
    const official = nodes.filter(n => n.tier === 'official');
    const custom = nodes.filter(n => n.tier === 'custom');
    document.getElementById('plugin-market-builtin').innerHTML =
      renderPluginList(builtin, { tier: 'built-in' });
    document.getElementById('plugin-market-official').innerHTML =
      official.length
        ? renderPluginList(official, { tier: 'official' })
        : '<div class="text-dim" style="font-size:12px;padding:8px 0">暂无官方精选插件。在 <code>plugins/official.json</code> 中添加插件清单即可。</div>';
    document.getElementById('plugin-market-custom').innerHTML =
      custom.length
        ? renderPluginList(custom, { tier: 'custom' })
        : '<div class="text-dim" style="font-size:12px;padding:8px 0">暂无自定义插件。点下方「创建自定义插件」开始。</div>';
  } catch(e) {
    document.getElementById('plugin-market-builtin').innerHTML = '<div class="text-dim">加载失败：' + e.message + '</div>';
  }
}

function renderPluginList(nodes, opts = {}) {
  if (!nodes.length) return '<div class="text-dim">无</div>';
  const tier = opts.tier || 'custom';
  const categoryColors = {
    '指标计算': '#6366f1', '数据处理': '#22c55e', '流程控制': '#ec4899',
    '高级': '#f59e0b', '数据源': '#3b82f6', '数据输出': '#8b5cf6',
    '因子库': '#14b8a6',
  };
  const tierBadges = {
    'built-in': '<span style="background:#e0e7ff;color:#4338ca;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:6px">内置</span>',
    'official': '<span style="background:#fef3c7;color:#92400e;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:6px">⭐ 官方</span>',
    'custom':   '<span style="background:#dcfce7;color:#166534;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:6px">自定义</span>',
  };
  let html = '';
  for (const n of nodes) {
    const color = categoryColors[n.category] || '#6366f1';
    const officialDesc = (n.official_meta && n.official_meta.description) ? n.official_meta.description : '';
    html += `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="flex:1;min-width:0">
        <div>
          <span style="color:${color};font-weight:600;font-size:13px">${n.display_name}</span>
          ${tierBadges[tier] || ''}
          <span class="badge badge-pending" style="margin-left:6px">${n.category}</span>
        </div>
        <div class="text-dim" style="font-size:11px;margin-top:2px;font-family:monospace">${n.type}</div>
        ${officialDesc ? `<div class="text-dim" style="font-size:11px;margin-top:4px">${officialDesc}</div>` : ''}
      </div>
      ${tier === 'custom' ? `<button class="btn btn-danger btn-sm" style="margin-left:10px" onclick="deletePlugin('${n.type}')">删除</button>` : ''}
    </div>`;
  }
  return html;
}

async function deletePlugin(nodeType) {
  if (!confirm(`确认删除插件「${nodeType}」？源文件也会被删除，无法恢复。`)) return;
  try {
    const res = await api(`/api/workflows/plugins/${nodeType}`, { method: 'DELETE' });
    alert(res.success ? `✅ 已删除插件 ${nodeType}` : `❌ ${res.message}`);
    if (res.success) loadPluginMarket();
  } catch(e) { alert('删除失败: ' + e.message); }
}

async function reloadPlugins() {
  try {
    const res = await api('/api/workflows/plugins/reload', { method: 'POST' });
    alert(res.success ? `✅ ${res.message}` : `❌ ${res.message}`);
    if (res.success) loadPluginMarket();
  } catch(e) { alert('重新加载失败: ' + e.message); }

async function doCreatePlugin() {
  const name = document.getElementById('cp-name').value;
  const type = document.getElementById('cp-type').value;
  const category = document.getElementById('cp-category').value;
  const code = document.getElementById('cp-code').value;
  if (!name || !type || !code) { alert('请填写完整'); return; }
  if (!/^[a-z_][a-z0-9_]*$/.test(type)) { alert('类型标识只能包含小写字母、数字、下划线'); return; }
  try {
    const res = await api('/api/workflows/create-plugin', { method: 'POST', body: JSON.stringify({ name, node_type: type, category, code }) });
    if (!res.success) { alert('❌ ' + res.message); return; }
    alert('✅ 插件创建成功');
    closeModal();
    // 创建后自动打开插件中心并重新加载
    openPluginMarket();
    setTimeout(() => reloadPlugins(), 300);
  } catch(e) { alert('创建失败: ' + e.message); }
}

async function doImportPlugin() {
  const text = document.getElementById('plugin-import-json').value.trim();
  let data;
  try { data = JSON.parse(text); } catch(e) { alert('JSON 格式错误'); return; }
  data.node_type = data.node_type || (data.name || 'plugin').toLowerCase().replace(/\s+/g, '_');
  data.category = data.category || '数据处理';
  try {
    const res = await api('/api/workflows/create-plugin', { method: 'POST', body: JSON.stringify(data) });
    if (!res.success) { alert('❌ ' + res.message); return; }
    alert('✅ 导入成功，正在重新加载...');
    await reloadPlugins();
    loadPluginMarket();
  } catch(e) { alert('导入失败: ' + e.message); }
}

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${wf.name || 'workflow'}.json`;
    a.click();

  const iconEl = document.getElementById('theme-icon');
  const labelEl = document.getElementById('theme-label');
  if (iconEl) iconEl.textContent = theme === 'dark' ? '🌙' : '☀️';
  if (labelEl) labelEl.textContent = theme === 'dark' ? '切换亮色' : '切换深色';
}

function toggleTheme() {
  setTheme(getTheme() === 'dark' ? 'light' : 'dark');
}

// Apply theme on load
setTheme(getTheme());

connectWS();

// Start with overview
loadLicenseInfo();
navigate('overview');
initQuickStartGuide();
</script>
