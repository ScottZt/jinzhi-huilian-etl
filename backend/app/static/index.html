<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金智汇连ETL</title>
  <link rel="icon" href="static/logo.png" type="image/png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --sidebar: #1a1d27;
      --card: #22263a;
      --card-hover: #2a2f47;
      --border: #2d3348;
      --text: #e2e8f0;
      --text-dim: #8892a4;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #38bdf8;
    }

    [data-theme="light"] {
      --bg: #f5f7fa;
      --sidebar: #ffffff;
      --card: #ffffff;
      --card-hover: #f0f2f5;
      --border: #e2e6ee;
      --text: #1e293b;
      --text-dim: #64748b;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --info: #0ea5e9;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 220px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 0;
      flex-shrink: 0;
    }

    .sidebar-logo {
      padding: 24px 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-logo h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    .sidebar-logo span {
      font-size: 11px;
      color: var(--text-dim);
      display: block;
      margin-top: 2px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 12px 8px;
      overflow-y: auto;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 14px;
      transition: all 0.15s;
      margin-bottom: 2px;
    }

    .nav-item:hover { background: var(--card); color: var(--text); }
    .nav-item.active { background: var(--accent); color: #fff; }
    .nav-item .icon { font-size: 18px; width: 20px; text-align: center; }

    .nav-section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      padding: 16px 12px 6px;
      opacity: 0.6;
    }

    /* Main content */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #topbar {
      height: 52px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }

    #topbar-title {
      font-size: 16px;
      font-weight: 600;
    }

    #topbar-actions {
      display: flex;
      gap: 8px;
    }

    #content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    /* Buttons */
    .btn {
      padding: 7px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--card-hover); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { opacity: 0.85; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { opacity: 0.85; }
    .btn-warning { background: var(--warning); color: #000; }
    .btn-warning:hover { opacity: 0.85; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #theme-toggle-btn:hover { background: var(--card-hover); border-color: var(--accent); }

    /* Cards & Panels */
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
    }

    .stat-card .stat-label {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .stat-card .stat-value {
      font-size: 28px;
      font-weight: 700;
    }

    .stat-card .stat-value.accent { color: var(--accent); }
    .stat-card .stat-value.success { color: var(--success); }
    .stat-card .stat-value.warning { color: var(--warning); }
    .stat-card .stat-value.danger { color: var(--danger); }

    /* Tables */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .data-table th {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-dim);
      font-weight: 500;
      font-size: 12px;
    }

    .data-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    .data-table tr:hover td { background: var(--card-hover); }

    .data-table .actions { display: flex; gap: 4px; }

    /* API Reference grid */
    .api-ref-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-height: 500px; overflow-y: auto; }
    .api-ref-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; cursor: pointer; transition: all 0.15s; background: var(--card); }
    .api-ref-card:hover { border-color: var(--accent); background: rgba(99,102,241,0.06); }
    .api-ref-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .api-ref-name { font-weight: 700; color: var(--accent); font-size: 14px; }
    .api-ref-desc { font-size: 12px; color: var(--text-dim); }
    .api-ref-params { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; word-break: break-all; }
    .api-ref-fields { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; word-break: break-all; }

    /* Status badges */
    .badge {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-pending { background: rgba(99,102,241,0.15); color: var(--accent); }
    .badge-running { background: rgba(56,189,248,0.15); color: var(--info); }
    .badge-completed { background: rgba(34,197,94,0.15); color: var(--success); }
    .badge-failed { background: rgba(239,68,68,0.15); color: var(--danger); }
    .badge-paused { background: rgba(245,158,11,0.15); color: var(--warning); }

    /* Forms */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 5px;
      font-weight: 500;
    }

    .form-control {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      transition: border-color 0.15s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-control::placeholder { color: var(--text-dim); opacity: 0.6; }

    select.form-control { cursor: pointer; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    [data-theme="light"] .modal-overlay {
      background: rgba(0,0,0,0.3);
    }

    .modal-overlay.hidden { display: none; }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 520px;
      max-width: 90vw;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 { font-size: 15px; font-weight: 600; }
    .modal-close { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; padding: 2px 6px; }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 20px; }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0;
    }

    .tab {
      padding: 8px 16px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 13px;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }

    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Progress bar */
    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar .fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
    }

    .empty-state .icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
    .empty-state p { font-size: 13px; margin-bottom: 16px; }

    /* Quick start guide */
    .quickstart-guide {
      background: linear-gradient(135deg, var(--sidebar) 0%, var(--card) 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .quickstart-guide.hidden { display: none; }
    .quickstart-guide .qs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .quickstart-guide .qs-header h3 { font-size: 15px; font-weight: 600; }
    .quickstart-guide .qs-header .qs-badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .quickstart-guide .qs-steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .qs-step {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }
    .qs-step:hover { border-color: var(--accent); transform: translateY(-2px); }
    .qs-step.done { border-color: var(--success); }
    .qs-step.done .qs-step-num { background: var(--success); }
    .qs-step.current { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(99,102,241,0.2); }
    .qs-step.current .qs-step-num { background: var(--accent); }
    .qs-step-num {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--border);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }
    .qs-step-icon { font-size: 28px; margin-bottom: 6px; }
    .qs-step-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .qs-step-desc { font-size: 11px; color: var(--text-dim); line-height: 1.4; }
    .qs-step .qs-done-check {
      position: absolute;
      top: 10px; right: 10px;
      color: var(--success);
      font-size: 16px;
    }

    .qs-modal-step { text-align: left; }
    .qs-modal-step h3 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
    .qs-modal-step p { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; line-height: 1.6; }
    .qs-modal-step ol { font-size: 13px; padding-left: 20px; margin-bottom: 16px; }
    .qs-modal-step ol li { margin-bottom: 6px; }
    .qs-modal-step .qs-tip {
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--accent-hover);
      margin-bottom: 16px;
    }

    /* Log viewer */
    .log-viewer {
      background: #0d0f16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
      line-height: 1.6;
    }

    .log-viewer .log-line { color: var(--text-dim); }
    .log-viewer .log-info { color: var(--info); }
    .log-viewer .log-error { color: var(--danger); }
    .log-viewer .log-success { color: var(--success); }
    .log-viewer .log-warning { color: var(--warning); }

    /* Field mapper */
    .field-map-row {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    /* Connection type cards */
    .conn-type-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .conn-type-card {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      font-size: 12px;
      transition: all 0.15s;
      background: var(--bg);
    }

    .conn-type-card:hover { border-color: var(--accent); }
    .conn-type-card.selected { border-color: var(--accent); background: rgba(99,102,241,0.1); }
    .conn-type-card .type-icon { font-size: 24px; margin-bottom: 6px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

    /* Utility */
    .hidden { display: none !important; }
    .text-dim { color: var(--text-dim); font-size: 12px; }
    .text-right { text-align: right; }
    .mt-8 { margin-top: 8px; }
    .mt-16 { margin-top: 16px; }
    .mb-16 { margin-bottom: 16px; }
    .flex { display: flex; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .gap-8 { gap: 8px; }

    /* Loading overlay */
    .loading-spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Data preview table */
    .preview-table-wrap { overflow: auto; max-height: 300px; }
    .preview-table-wrap table { white-space: nowrap; }
    .preview-type-badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; background: rgba(99,102,241,0.15); color: var(--accent); }

    /* Source config wizard */
    .wizard-steps { display: flex; gap: 4px; margin-bottom: 16px; }
    .wizard-step { flex: 1; text-align: center; padding: 8px; border-radius: 6px; font-size: 12px; color: var(--text-dim); background: var(--bg); border: 1px solid var(--border); }
    .wizard-step.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .wizard-step.done { background: rgba(34,197,94,0.15); color: var(--success); border-color: var(--success); }

    /* K-line source type cards */
    .kline-type-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .kline-type-card {
      padding: 16px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      background: var(--bg);
    }
    .kline-type-card:hover { border-color: var(--accent); }
    .kline-type-card.selected { border-color: var(--accent); background: rgba(99,102,241,0.1); }
    .kline-type-card .icon { font-size: 28px; margin-bottom: 8px; }
    .kline-type-card .label { font-size: 13px; font-weight: 600; }
    .kline-type-card .desc { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

    /* Credential type cards */
    .cred-type-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px;
    }
    .cred-type-card {
      padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; gap: 10px; background: var(--bg); transition: all 0.15s;
    }
    .cred-type-card:hover { border-color: var(--accent); }
    .cred-type-card.selected { border-color: var(--accent); background: rgba(99,102,241,0.1); }
    .cred-type-card .cred-icon { font-size: 22px; }
    .cred-type-card .cred-label { font-size: 13px; font-weight: 600; }

    /* API reference */
    .api-ref-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .api-ref-tabs { display: flex; gap: 4px; }
    .api-ref-tab {
      padding: 6px 14px; font-size: 13px; border-radius: 6px; cursor: pointer;
      background: rgba(255,255,255,0.05); transition: all 0.15s; color: var(--text-dim);
    }
    .api-ref-tab:hover { background: rgba(99,102,241,0.15); color: var(--text-primary); }
    .api-ref-tab.active { background: var(--accent); color: #fff; }
    .api-ref-search { min-width: 180px; }
    .api-ref-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; max-height: 60vh; overflow-y: auto; }
    .api-ref-card {
      padding: 14px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
      background: var(--bg); transition: all 0.15s;
    }
    .api-ref-card:hover { border-color: var(--accent); box-shadow: 0 0 12px rgba(99,102,241,0.1); }
    .api-ref-header { margin-bottom: 8px; }
    .api-ref-name { font-size: 14px; font-weight: 600; }
    .api-ref-desc { font-size: 12px; color: var(--text-dim); margin-left: 8px; }
    .api-ref-params, .api-ref-fields { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }

    /* Workflow editor */
    .wf-editor {
      display: flex;
      height: 600px;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .wf-palette {
      width: 200px;
      background: var(--bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px;
      flex-shrink: 0;
    }
    .wf-palette-section {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      padding: 10px 0 4px;
    }
    .wf-palette-node {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: grab;
      font-size: 12px;
      margin-bottom: 4px;
      transition: all 0.1s;
      background: var(--card);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .wf-palette-node:hover { border-color: var(--accent); }
    .wf-canvas {
      flex: 1;
      position: relative;
      background: var(--bg);
      overflow: hidden;
    }
    .wf-canvas svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .wf-node {
      position: absolute;
      width: 180px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0;
      cursor: move;
      user-select: none;
      z-index: 2;
    }
    .wf-node.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(99,102,241,0.3); }
    .wf-node-header {
      padding: 8px 10px;
      border-radius: 8px 8px 0 0;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .wf-node-body {
      padding: 6px 10px 8px;
      font-size: 11px;
      color: var(--text-dim);
    }
    .wf-node-port {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--card);
    }

<script>
const API = '';
const VIEWS = {};

// ---------- Navigation ----------
const VIEW_DATA_LOADER = {
  overview: loadOverviewData,
  'kline-sources': refreshKlineSources,
  credentials: refreshCredentials,
  pipelines: refreshPipelines,
  workflows: refreshWorkflows,
  connections: refreshConnections,
  schemas: refreshSchemas,
  'bulk-import': refreshBulkImports,
  tasks: refreshTasks,
  monitor: refreshMonitor,
  logs: loadLogs,
  reports: loadReportsView,
  about: loadAboutData,
  'ai-script': refreshAiScript,
  'llm-settings': refreshLLMSettings,
};

async function navigate(view) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`[data-view="${view}"]`).classList.add('active');
  document.getElementById('topbar-title').textContent = {
    overview: '总览', 'kline-sources': '数据源', pipelines: '数据流 (Pipeline)', workflows: 'ETL工作流',
    connections: '连接管理', schemas: '表结构',
    'bulk-import': '文件导入', tasks: '导入任务', monitor: '监控面板', reports: '报告导出', logs: '日志', about: '关于', 'ai-script': 'AI脚本生成', 'llm-settings': 'AI 设置'
  }[view] || view;

  // Render cached HTML if available
  if (VIEWS[view]) {
    document.getElementById('content').innerHTML = VIEWS[view]();
  } else {
    document.getElementById('content').innerHTML = '<div class="empty-state"><div class="icon">🔧</div><p>视图加载中...</p></div>';
    await loadView(view);
  }

  // Always load data when navigating to a view
  if (VIEW_DATA_LOADER[view]) {
    VIEW_DATA_LOADER[view]();
  }
}

// ---------- Loading state ----------
let _loadingCount = 0;
function showLoading(msg = '处理中...') {
  _loadingCount++;
  const el = document.getElementById('loading-overlay');
  const msgEl = document.getElementById('loading-msg');
  if (msgEl) msgEl.textContent = msg;
  el.classList.remove('hidden');
}
function hideLoading() {
  _loadingCount = Math.max(0, _loadingCount - 1);
  if (_loadingCount === 0) {
    document.getElementById('loading-overlay').classList.add('hidden');
  }
}

// ---------- API helpers ----------
async function api(url, opts = {}) {
  const silent = opts.silent;
  if (!silent) showLoading(opts.loadingMsg || '加载中...');
  try {
    const res = await fetch(API + url, {
      headers: { 'Content-Type': 'application/json', ...opts.headers },
      ...opts,
    });
    if (!res.ok) {
      const text = await res.text();
      throw new Error(text || `HTTP ${res.status}`);
    }
    return await res.json();
  } finally {
    if (!silent) hideLoading();
  }
}

// ---------- WebSocket ----------
let ws = null;
let wsReconnectTimer = null;

function connectWS() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${protocol}//${location.host}/ws`;
  try {
    ws = new WebSocket(wsUrl);
    ws.onopen = () => {
      addLog('WebSocket 已连接', 'success');
      if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
      const el = document.getElementById('ws-status');
      if (el) { el.textContent = '● 已连接'; el.style.color = '#22c55e'; }
    };
    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        handleWSMessage(msg);
      } catch(e) {}
    };
    ws.onclose = () => {
      addLog('WebSocket 连接关闭，3秒后重连', 'warning');
      const el = document.getElementById('ws-status');
      if (el) { el.textContent = '● 重连中'; el.style.color = '#f59e0b'; }
      wsReconnectTimer = setTimeout(connectWS, 3000);
    };
    ws.onerror = () => {
      addLog('WebSocket 连接错误', 'error');
      const el = document.getElementById('ws-status');
      if (el) { el.textContent = '● 断开'; el.style.color = '#ef4444'; }
    };
  } catch(e) {
    setTimeout(connectWS, 3000);
  }
}

function handleWSMessage(msg) {
  if (msg.type === 'status_update') {
    // Update overview stats if on overview
    const view = document.querySelector('.nav-item.active')?.dataset.view;
    if (view === 'overview') loadOverviewData();
  } else if (msg.type === 'import_update') {
    const view = document.querySelector('.nav-item.active')?.dataset.view;
    if (view === 'bulk-import') refreshBulkImports();
    if (view === 'monitor') refreshMonitor();
    // Update progress directly in the table
    updateImportRow(msg);
  } else if (msg.type === 'task_update') {
    const view = document.querySelector('.nav-item.active')?.dataset.view;
    if (view === 'tasks') refreshTasks();
    if (view === 'monitor') refreshMonitor();
  } else if (msg.type === 'log') {
    addLog(msg.message, msg.level);
  }
}

function updateImportRow(msg) {
  // Live-update progress in the bulk-import table without full refresh
  const rows = document.querySelectorAll('#bulk-imports-list tr');
  for (const row of rows) {
    const idCell = row.cells[0];
    if (!idCell) continue;
  }
}

function sendWS(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(msg));
  }
}

// ---------- Modal helpers ----------
function openModal(title, bodyHtml, footerHtml) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-footer').innerHTML = footerHtml;
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

// ---------- Load views ----------
async function loadView(view, force = false) {
  if (!force && VIEWS[view]) return;
  try {
    const { render } = await VIEW_DEFS[view]();
    VIEWS[view] = render;
    document.getElementById('content').innerHTML = render();
    await onViewReady(view);
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>加载失败: ${e.message}</p></div>`;
  }
}

async function onViewReady(view) {
  if (view === 'overview') await loadOverviewData();
  if (view === 'bulk-import') await refreshBulkImports();
  if (view === 'tasks') await refreshTasks();
  if (view === 'monitor') await refreshMonitor();
  if (view === 'reports') await loadReportsView();
  if (view === 'logs') await loadLogs();
}

function initQuickStartGuide() {
  const dismissed = localStorage.getItem('qs_dismissed');
  if (dismissed) return;
  const el = document.getElementById('quickstart-guide');
  if (el) el.classList.remove('hidden');
}

function dismissQuickStartGuide() {
  localStorage.setItem('qs_dismissed', '1');
  const el = document.getElementById('quickstart-guide');
  if (el) el.classList.add('hidden');
}

function qsOpenStep(num) {
  const step = QS_STEPS[num];
  openModal(`步骤 ${num}/4：${step.title}`, `
    <div class="qs-modal-step">
      <h3>${step.desc}</h3>
      <ol>${step.items.map(i => `<li>${i}</li>`).join('')}</ol>
      <div class="qs-tip">💡 ${step.tip}</div>
      <button class="btn btn-primary" onclick="${step.actionFn}">${step.action}</button>
    </div>
  `, `
    <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
    <button class="btn btn-secondary btn-sm" onclick="dismissQuickStartGuide(); closeModal()">不再显示</button>
  `);

// ---------- Data functions ----------
async function loadOverviewData() {
  try {
    const data = await api('/api/monitor/summary');
    document.getElementById('overview-stats').innerHTML = `
      <div class="stat-card"><div class="stat-label">连接数</div><div class="stat-value accent">${data.connections}</div></div>
      <div class="stat-card"><div class="stat-label">表结构</div><div class="stat-value">${data.schemas}</div></div>
      <div class="stat-card"><div class="stat-label">运行中任务</div><div class="stat-value warning">${data.tasks.running}</div></div>
      <div class="stat-card"><div class="stat-label">已完成任务</div><div class="stat-value success">${data.tasks.completed}</div></div>
      <div class="stat-card"><div class="stat-label">失败任务</div><div class="stat-value danger">${data.tasks.failed}</div></div>
      <div class="stat-card"><div class="stat-label">导入行数</div><div class="stat-value">${(data.bulk_imports.total_rows_imported || 0).toLocaleString()}</div></div>
    `;

    const imports = await api('/api/bulk-import');
    renderOverviewList('overview-imports', imports.slice(0, 5), 'bulk-import');

    const tasks = await api('/api/tasks');
    renderOverviewList('overview-tasks', tasks.slice(0, 5), 'tasks');
  } catch(e) { console.error(e); }
}

function renderOverviewList(elId, items, type) {
  const el = document.getElementById(elId);
  if (!items.length) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无数据</p></div>';
    return;
  }
  let html = `<table class="data-table"><thead><tr>
    <th>名称/ID</th><th>状态</th><th>进度</th><th>时间</th><th>操作</th>
  </tr></thead><tbody>`;
  for (const item of items) {
    const progress = type === 'bulk-import'
      ? `${((item.imported_rows||0)/(item.total_rows||1)*100).toFixed(1)}%`
      : item.status;
    const time = item.updated_at ? new Date(item.updated_at).toLocaleString() : '-';
    html += `<tr>
      <td>${item.id.substring(0, 8)}...</td>
      <td><span class="badge badge-${item.status}">${item.status}</span></td>
      <td>${type === 'bulk-import' ? `<div style="max-width:120px"><div class="progress-bar"><div class="fill" style="width:${progress}"></div></div><span class="text-dim">${progress}</span></div>` : '-'}</td>
      <td class="text-dim">${time}</td>
      <td><button class="btn btn-secondary btn-sm" onclick="navigate('${type}')">查看</button></td>
    </tr>`;
  }
  html += '</tbody></table>';
  el.innerHTML = html;
}

// ---------- Connections ----------
async function refreshConnections() {
  try {
    const list = await api('/api/connections');
    const el = document.getElementById('connections-list');
    if (!list.length) {
      el.innerHTML = '<div class="empty-state"><div class="icon">🔗</div><p>还没有创建任何数据连接。<br>数据连接定义了数据从哪读取、或写入到哪。</p><button class="btn btn-primary" onclick="openNewConnectionModal()">+ 新建连接</button></div>';
      return;
    }
    let html = `<table class="data-table"><thead><tr>
      <th>名称</th><th>类型</th><th>配置</th><th>操作</th>
    </tr></thead><tbody>`;
    for (const c of list) {
      const cfg = JSON.stringify(c.config).substring(0, 60);
      html += `<tr>
        <td>${c.name}</td>
        <td><span class="badge badge-pending">${c.type}</span></td>
        <td class="text-dim">${cfg}...</td>
        <td class="actions">
          <button class="btn btn-secondary btn-sm" onclick="testConnection('${c.id}')">测试</button>
          <button class="btn btn-secondary btn-sm" onclick="openEditConnectionModal('${c.id}')">编辑</button>
          <button class="btn btn-danger btn-sm" onclick="deleteConnection('${c.id}')">删除</button>
        </td>
      </tr>`;
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  } catch(e) { console.error(e); }
}

function typeIcon(type) {
  return {mysql:'🐬',postgresql:'🐘',duckdb:'🦆',clickhouse:'🏠',csv:'📄',excel:'📊',json:'{ }',parquet:'📦',folder_watch:'📁'}[type] || '🔗';
}

function selectConnType(el, type) {
  document.querySelectorAll('.conn-type-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('conn-type').value = type;
  const fields = document.getElementById('conn-config-fields');
  if (type === 'mysql') {
    fields.innerHTML = connFields('host', 'localhost', 'port', '3306', 'user', '', 'password', '', 'database', '');
  } else if (type === 'postgresql') {

function connFields(...pairs) {
  let html = '';
  for (let i = 0; i < pairs.length; i += 2) {
    if (!pairs[i]) continue;
    const label = pairs[i].replace(/_/g, ' ');
    html += `<div class="form-group"><label>${label}</label><input class="form-control" id="conn-cfg-${pairs[i]}" value="${pairs[i+1] || ''}"></div>`;
  }
  return html;
}

function renderBulkImportTable(el, imports) {
  let html = `<table class="data-table"><thead><tr>
    <th>文件</th><th>目标表</th><th>状态</th><th>进度</th><th>速度</th><th>操作</th>
  </tr></thead><tbody>`;
  for (const imp of imports) {
    const pct = ((imp.imported_rows||0)/(imp.total_rows||1)*100).toFixed(1);
    const speed = imp.status === 'running' ? estimateSpeed(imp) : '-';
    const actions = {
      'pending': `<button class="btn btn-success btn-sm" onclick="executeImport('${imp.id}')">执行</button>`,
      'running': `<button class="btn btn-warning btn-sm" onclick="pauseImport('${imp.id}')">暂停</button>
                  <button class="btn btn-danger btn-sm" onclick="stopImport('${imp.id}')">停止</button>`,
      'paused': `<button class="btn btn-success btn-sm" onclick="resumeImport('${imp.id}')">恢复</button>`,
      'failed': `<button class="btn btn-secondary btn-sm" onclick="retryImport('${imp.id}')">重试</button>`,
      'completed': '-',
    }[imp.status] || '';
    html += `<tr>
      <td title="${imp.file_path}">${imp.file_path.split(/[/\\]/).pop().substring(0, 30)}</td>
      <td>${imp.target_table}</td>
      <td><span class="badge badge-${imp.status}">${imp.status}</span></td>
      <td style="min-width:120px">
        <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
        <span class="text-dim">${(imp.imported_rows||0).toLocaleString()} / ${(imp.total_rows||0).toLocaleString()} (${pct}%)</span>
      </td>
      <td class="text-dim">${speed}</td>
      <td class="actions">${actions}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  el.innerHTML = html;
}

function estimateSpeed(imp) {
  if (!imp.started_at || imp.imported_rows <= 0) return '-';
  const secs = (Date.now() - new Date(imp.started_at).getTime()) / 1000;
  if (secs <= 0) return '-';
  const rps = imp.imported_rows / secs;
  return `${rps.toFixed(0)} 行/秒`;
}

async function createBulkImport() {
  const filePath = document.getElementById('bi-file-path').value;
  const targetConn = document.getElementById('bi-target-conn').value;
  const targetTable = document.getElementById('bi-target-table').value;
  const mode = document.getElementById('bi-mode').value;
  const batchSize = parseInt(document.getElementById('bi-batch-size').value) || 5000;
  const checkpoint = document.getElementById('bi-checkpoint').value === 'true';

  const fieldMappings = [];
  document.querySelectorAll('[id^="bi-map-"]').forEach(row => {
    const id = row.id.split('-').pop();
    const src = document.getElementById(`bi-src-${id}`)?.value;
    const tgt = document.getElementById(`bi-tgt-${id}`)?.value;
    if (src && tgt) fieldMappings.push({ source_field: src, target_field: tgt });
  });

  try {
    const res = await api('/api/bulk-import', {
      method: 'POST',
      body: JSON.stringify({
        source_connection_id: 'file-source',
        target_connection_id: targetConn,
        target_table: targetTable,
        file_path: filePath,
        field_mappings: fieldMappings,
        import_mode: mode,
        batch_size: batchSize,
        parallel_threads: 1,
        enable_checkpoint: checkpoint,
      }),
    });
    closeModal();
    await executeImport(res.id);
  } catch(e) { alert('创建失败: ' + e.message); }
}

async function executeImport(id) {
  try {
    await api(`/api/bulk-import/${id}/execute`, { method: 'POST' });
    await refreshBulkImports();
  } catch(e) { alert('执行失败: ' + e.message); }
}

async function pauseImport(id) {
  try { await api(`/api/bulk-import/${id}/pause`, { method: 'POST' }); await refreshBulkImports(); } catch(e) { alert(e.message); }
}

async function resumeImport(id) {
  try { await api(`/api/bulk-import/${id}/resume`, { method: 'POST' }); await refreshBulkImports(); } catch(e) { alert(e.message); }
}

async function stopImport(id) {
  if (!confirm('确定停止？')) return;
  try {
    const imp = await api(`/api/bulk-import/${id}`);
    imp.status = 'failed';
    imp.error_message = '用户手动停止';
    await api(`/api/bulk-import/${id}`, { method: 'PUT', body: JSON.stringify(imp) });
    await refreshBulkImports();
  } catch(e) { alert(e.message); }
}

async function retryImport(id) {
  try {
    const imp = await api(`/api/bulk-import/${id}`);
    imp.status = 'pending';
    imp.imported_rows = 0;
    imp.last_imported_index = 0;
    imp.error_message = null;
    imp.error_at_row = null;
    imp.updated_at = new Date().toISOString();
    await api(`/api/bulk-import/${id}`, { method: 'PUT', body: JSON.stringify(imp) });
    await executeImport(id);
  } catch(e) { alert(e.message); }
}

function renderTaskTable(el, tasks) {
  let html = `<table class="data-table"><thead><tr>
    <th>名称</th><th>类型</th><th>目标表</th><th>状态</th><th>上次运行</th><th>操作</th>
  </tr></thead><tbody>`;
  for (const t of tasks) {
    const time = t.last_run_at ? new Date(t.last_run_at).toLocaleString() : '-';
    html += `<tr>
      <td>${t.name}</td>
      <td><span class="badge badge-pending">${t.task_type}</span></td>
      <td>${t.target_table}</td>
      <td><span class="badge badge-${t.status}">${t.status}</span></td>
      <td class="text-dim">${time}</td>
      <td class="actions">
        ${t.status !== 'running' ? `<button class="btn btn-success btn-sm" onclick="runTask('${t.id}')">运行</button>` : ''}
        <button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')">删除</button>
      </td>
    </tr>`;
  }
  html += '</tbody></table>';
  el.innerHTML = html;
}

async function saveTask() {
  const name = document.getElementById('task-name').value;
  const taskType = document.getElementById('task-type').value;
  const sourceId = document.getElementById('task-source').value;
  const targetId = document.getElementById('task-target').value;

  const cron = document.getElementById('task-cron').value;

  if (!name || !table) { alert('请填写名称和目标表'); return; }

  try {
    await api('/api/tasks', {
      method: 'POST',

        target_connection_id: targetId, target_table: table,
        config_json: {}, cron_expression: cron || null,
      }),
    });
    closeModal();
    await refreshTasks();
  } catch(e) { alert('保存失败: ' + e.message); }

  const time = new Date().toLocaleTimeString();

async function exportReport(id, type, format) {
  try {
    const url = type === 'import'
      ? `/api/reports/bulk-import/${id}?format=${format}`
      : `/api/reports/task/${id}?format=${format}`;
    const mediaType = { json: 'application/json', html: 'text/html', csv: 'text/csv' }[format];
    const res = await fetch(url);
    const content = await res.text();
    const ext = { json: 'json', html: 'html', csv: 'csv' }[format];

    // Open in new tab for HTML/JSON, download for CSV
    if (format === 'html') {
      const blob = new Blob([content], { type: 'text/html' });
      window.open(URL.createObjectURL(blob), '_blank');
    } else {
      const blob = new Blob([content], { type: mediaType });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${type}_${id}.${ext}`;
      a.click();
    }
  } catch(e) { alert('导出失败: ' + e.message); }
}

  `);
}

async function exportSummaryReport(format) {

      const html = `<html><head><meta charset="utf-8"><title>系统报告</title></head><body><pre>${JSON.stringify(data, null, 2)}</pre></body></html>`;
      const blob = new Blob([html], { type: 'text/html' });

async function onCredSelectChange(credId) {
  if (!credId) return;
  try {
    const cred = await api(`/api/credentials/${credId}`);
    const cfg = cred.config || {};
    const credType = cred.type || '';
    // Inject into headers
    const headersEl = document.getElementById('ks-cfg-headers');
    if (headersEl) {
      let headers = {};
      try { headers = JSON.parse(headersEl.value || '{}'); } catch(e) {}
      if (cfg.token && credType !== 'apikey') {
        headers['Authorization'] = `Bearer ${cfg.token}`;
      } else if (cfg.username && cfg.password) {
        headers['Authorization'] = `Basic ${btoa(cfg.username + ':' + cfg.password)}`;
      }
      headersEl.value = JSON.stringify(headers, null, 2);
    }
    // Inject base_url from credential
    const baseUrlEl = document.getElementById('ks-cfg-base_url');
    if (baseUrlEl && cfg.base_url) {
      baseUrlEl.value = cfg.base_url;
    }
    // Inject into request_template for tushare_token type
    const reqTmpl = document.getElementById('ks-cfg-request_template');
    if (reqTmpl && cfg.token) {
      let tmpl = {};
      try { tmpl = JSON.parse(reqTmpl.value || '{}'); } catch(e) {}
      if (credType === 'tushare_token') {
        tmpl.token = cfg.token;
        reqTmpl.value = JSON.stringify(tmpl, null, 2);
      }
    }
  } catch(e) { console.error('credential inject error:', e); }
}

async function saveKlineSource() {
  const name = document.getElementById('ks-name').value;
  const type = document.getElementById('ks-type').value;
  if (!name || !type) { alert('请填写名称并选择类型'); return; }
  const config = {};
  document.querySelectorAll('[id^="ks-cfg-"]').forEach(inp => {
    const key = inp.id.replace('ks-cfg-', '');
    if (key) {
      let val = inp.value;
      // 自动解析 JSON
      if ((key === 'headers' || key === 'request_template' || key === 'column_mapping' || key === 'subscribe_template') && val.startsWith('{')) {
        try { val = JSON.parse(val); } catch(e) {}
      }
      config[key] = val;
    }
  });
  const editId = document.getElementById('ks-edit-id').value;
  const btn = document.querySelector('#modal-footer .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = '保存中...'; }
  try {
    if (editId) {
      await api(`/api/kline-sources/${editId}`, { method: 'PUT', body: JSON.stringify({ name, type, config }) });
    } else {
      await api('/api/kline-sources/', { method: 'POST', body: JSON.stringify({ name, type, config }) });
    }
    closeModal();
    refreshKlineSources();
  } catch(e) { alert('保存失败: ' + e.message); }

          1. 确认已创建凭证并选择了该凭证<br>
          2. 检查 base_url 是否正确（Tushare 应为 <code>http://api.tushare.pro</code>）<br>
          3. 点击「📖 API 参考」选择一个接口填充配置<br>
          4. 预览数据前需要先将配置保存

      </div>`;
  } else {
    const rows = (res.data || []).slice(0, 20);
    const columns = rows.length ? Object.keys(rows[0]) : [];
    const types = inferColumnTypes(rows, columns);

    // Debug info
    const debugHTML = `
      <div style="margin-bottom:16px">
        <div class="text-dim" style="font-size:12px;margin-bottom:8px">📡 请求详情</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px">
          <div><strong>数据源：</strong>${res.source_name || '-'}</div>
          <div><strong>类型：</strong>${res.source_type || '-'}</div>
          <div><strong>请求 URL：</strong><code>${res.request_url || '-'}</code></div>
          <div><strong>HTTP 方法：</strong>${res.request_method || '-'}</div>
          <div><strong>响应状态：</strong>${res.http_status ? `<span style="color:#10b981">HTTP ${res.http_status} ✅</span>` : '<span style="color:#f87171">无响应</span>'}</div>
          <div><strong>总行数：</strong>${res.total_rows || 0}</div>
        </div>
        ${res.request_body ? `
          <div style="margin-top:10px"><strong>请求体：</strong></div>
          <pre style="background:var(--bg);padding:10px;border-radius:6px;font-size:11px;overflow-x:auto;margin-top:4px;max-height:120px;overflow-y:auto">${res.request_body}</pre>
        ` : ''}
        ${res.response_sample ? `
          <div style="margin-top:10px"><strong>响应样例（截取）：</strong></div>
          <pre style="background:var(--bg);padding:10px;border-radius:6px;font-size:11px;overflow-x:auto;margin-top:4px;max-height:150px;overflow-y:auto">${res.response_sample}</pre>
        ` : ''}
      </div>`;

    let tableHTML = '';
    if (rows.length && columns.length) {
      tableHTML = `
        <div class="text-dim" style="font-size:12px;margin-bottom:8px">📋 字段信息</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">
          ${columns.map((c, i) => `<span style="padding:4px 10px;background:rgba(99,102,241,0.1);border-radius:4px;font-size:12px">
            <strong>${c}</strong> <span class="preview-type-badge">${types[i]}</span>
            <span style="color:var(--text-dim);margin-left:4px;font-size:11px">${rows[0][c] ?? 'null'}</span>
          </span>`).join('')}
        </div>
        <div class="text-dim" style="font-size:12px;margin-bottom:8px">📊 数据样例（前20行）</div>
        <div class="preview-table-wrap" style="border:1px solid var(--border);border-radius:6px;background:var(--bg);max-height:400px;overflow:auto">
          <table class="data-table">
            <thead><tr>${columns.map(c => `<th>${c}</th>`).join('')}</tr></thead>
            <tbody>${rows.map(row => `<tr>${columns.map(c => `<td>${row[c] ?? ''}</td>`).join('')}</tr>`).join('')}</tbody>
          </table>
        </div>`;
    } else {
      tableHTML = `<div style="text-align:center;padding:24px;color:var(--text-dim)">请求成功但未返回数据</div>`;
    }

  }

  openModal('数据预览', html, `
    <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
  `);
}

function inferColumnTypes(rows, columns) {
  return columns.map(c => {
    const vals = rows.slice(0, 10).map(r => r[c]).filter(v => v !== null && v !== undefined);
    if (!vals.length) return 'unknown';
    const first = String(vals[0]);
    if (/^\d+$/.test(first)) return 'integer';
    if (/^\d+\.\d+$/.test(first)) return 'float';
    if (/^\d{4}-\d{2}-\d{2}/.test(first) || /^\d{2}:\d{2}/.test(first)) return 'datetime';
    if (first.length <= 50) return 'string';
    return 'text';
  });
}

      const created = new Date(c.created_at).toLocaleString('zh-CN');

async function saveCredential() {

  try {

      await api('/api/credentials/', { method: 'POST', body: JSON.stringify({ name, type, config }) });

async function testCredential(id) {

      const advice = `${err}\n\n排查步骤：\n1. 确认 base_url 正确\n2. 确认 Token/密钥 有效且未过期\n3. 检查网络是否能访问该地址`;

        const resp = await api('/api/llm/troubleshoot', {
          method: 'POST',
          body: JSON.stringify({
            error: err,
            context: `凭证类型：${id}\n这是凭证连通性测试失败。`,
            config_id: llm[0].id
          }),
          loadingMsg: 'AI 分析中...'

          alert('❌ AI 排查失败：' + resp.error);
        } else {
          alert('🤖 AI 排查建议：\n\n' + resp.advice);

  } catch(e) { alert('测试失败: ' + e.message); }
}

function selectApiRefTab(el, src) {
  document.querySelectorAll('#api-ref-src-tabs .api-ref-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const cat = document.querySelector('#api-ref-cat-tabs .api-ref-subtab.active')?.textContent;
  const catMap = {'全部':'market','行情':'market','财务':'finance','基金':'fund','指数':'index','资金':'flow','板块':'sector'};
  const catKey = catMap[cat] || 'market';
  const q = document.querySelector('.api-ref-search')?.value || '';
  document.getElementById('api-ref-cards').innerHTML = renderApiCards(src, catKey);
  filterApiRef(q);
}

function selectApiRefCat(el, cat) {
  document.querySelectorAll('#api-ref-cat-tabs .api-ref-subtab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const src = document.querySelector('#api-ref-src-tabs .api-ref-tab.active')?.getAttribute('onclick')?.match(/'([^']+)'/)?.[1] || 'all';
  const q = document.querySelector('.api-ref-search')?.value || '';
  document.getElementById('api-ref-cards').innerHTML = renderApiCards(src, cat);
  filterApiRef(q);
}

function filterApiRef(query) {
  const q = (query || '').toLowerCase();
  const container = document.getElementById('api-ref-cards');
  if (!container) return;
  container.querySelectorAll('.api-ref-card').forEach(card => {
    const name = (card.dataset.name || '').toLowerCase();
    const desc = (card.dataset.desc || '').toLowerCase();
    card.style.display = (!q || name.includes(q) || desc.includes(q)) ? '' : 'none';
  });
}

function useApi(apiName) {
  const apiInfo = allApis.find(a => a.apiName === apiName);
  const src = apiInfo ? apiInfo.src : 'tushare';
  const label = catLabels[apiInfo?.cat] || '行情';
  closeModal();
  setTimeout(() => {
    openKlineSourceModal();
    setTimeout(() => {
      const httpCard = document.querySelector('.kline-type-card[data-type="http"]');
      if (httpCard) selectKsType(httpCard, 'http');
      setTimeout(() => {
        // Set source name
        const nameEl = document.getElementById('ks-name');
        if (nameEl && !nameEl.value) nameEl.value = `${src.toUpperCase()}-${apiInfo?.desc || apiName}`;
        fillApiTemplate(apiName, apiInfo, src);
      }, 80);
    }, 80);
  }, 80);
}

function fillApiTemplate(apiName, apiInfo, src) {
  const baseUrl = document.getElementById('ks-cfg-base_url');
  const method = document.getElementById('ks-cfg-method');
  if (src === 'tushare') {
    if (baseUrl) baseUrl.value = 'http://api.tushare.pro';
    if (method) method.value = 'POST';
    const tmpl = { api_name: apiName, token: '{YOUR_TOKEN}', params: { ts_code: '{codes}', start_date: '{start_time}', end_date: '{end_time}' }, fields: apiInfo ? apiInfo.fields : '' };
    if (apiInfo?.reqExample) { try { Object.assign(tmpl, JSON.parse(apiInfo.reqExample)); } catch(e) {} }
    const requestTemplate = document.getElementById('ks-cfg-request_template');
    if (requestTemplate) requestTemplate.value = JSON.stringify(tmpl, null, 2);
    const respPath = document.getElementById('ks-cfg-response_data_path');
    if (respPath) respPath.value = 'data.items';
    const colMapping = document.getElementById('ks-cfg-column_mapping');
    if (colMapping) colMapping.value = JSON.stringify({ trade_date: 'datetime', open: 'open', high: 'high', low: 'low', close: 'close', vol: 'vol', amount: 'amount' }, null, 2);
  } else if (src === 'akshare') {
    if (baseUrl) baseUrl.value = 'https://api.akshare.online';
    if (method) method.value = 'POST';
    const tmpl = { func: apiName };
    if (apiInfo?.reqExample) { try { Object.assign(tmpl, JSON.parse(apiInfo.reqExample)); } catch(e) {} }
    const requestTemplate = document.getElementById('ks-cfg-request_template');
    if (requestTemplate) requestTemplate.value = JSON.stringify(tmpl, null, 2);
    const respPath = document.getElementById('ks-cfg-response_data_path');
    if (respPath) respPath.value = 'result';
  } else if (src === 'tdx') {
    if (baseUrl) baseUrl.value = 'http://127.0.0.1:8888';
    if (method) method.value = 'POST';
    const tmpl = { code: '{codes}', count: 10, start: 0 };
    if (apiInfo?.reqExample) { try { Object.assign(tmpl, JSON.parse(apiInfo.reqExample)); } catch(e) {} }
    const requestTemplate = document.getElementById('ks-cfg-request_template');
    if (requestTemplate) requestTemplate.value = JSON.stringify(tmpl, null, 2);
    const respPath = document.getElementById('ks-cfg-response_data_path');
    if (respPath) respPath.value = 'data';
    const colMapping = document.getElementById('ks-cfg-column_mapping');
    if (colMapping) colMapping.value = JSON.stringify({ datetime: 'datetime', open: 'open', high: 'high', low: 'low', close: 'close', vol: 'vol', amount: 'amount' }, null, 2);
  }
}

async function deleteKlineSource(id) {
  if (!confirm('确定删除此数据源？')) return;
  try {
    await api(`/api/kline-sources/${id}`, { method: 'DELETE' });
    refreshKlineSources();
  } catch(e) { alert('删除失败: ' + e.message); }
}

// ---------- 数据流 (Pipeline) ----------
async function refreshPipelines() {
  try {
    const [pipelines, runs] = await Promise.all([
      api('/api/pipelines/'),
      api('/api/pipelines/runs?limit=20'),
    ]);
    document.getElementById('pipeline-stats').innerHTML = `
      <div class="stat-card"><div class="stat-label">数据流数</div><div class="stat-value accent">${pipelines.length}</div></div>
      <div class="stat-card"><div class="stat-label">执行次数</div><div class="stat-value">${runs.length}</div></div>
      <div class="stat-card"><div class="stat-label">成功</div><div class="stat-value success">${runs.filter(r => r.status === 'success').length}</div></div>
      <div class="stat-card"><div class="stat-label">失败</div><div class="stat-value danger">${runs.filter(r => r.status === 'failed').length}</div></div>
    `;
    const el = document.getElementById('pipelines-list');
    if (!pipelines.length) {
      el.innerHTML = '<div class="empty-state"><div class="icon">🔄</div><p>暂无数据流</p><button class="btn btn-primary" onclick="openPipelineModal()">新建数据流</button></div>';
      return;
    }
    let html = `<table class="data-table"><thead><tr>
      <th>名称</th><th>数据源数</th><th>目标</th><th>状态</th><th>Cron</th><th>上次运行</th><th>操作</th>
    </tr></thead><tbody>`;
    for (const p of pipelines) {
      const pjson = p.pipeline_json || {};
      const srcCount = (pjson.sources || []).length;
      const tgt = pjson.target || {};
      const tgtName = tgt.table || '-';
      const time = p.last_run_at ? new Date(p.last_run_at).toLocaleString() : '-';
      html += `<tr>
        <td>${p.name}</td>
        <td>${srcCount}</td>
        <td class="text-dim">${tgtName}</td>
        <td><span class="badge badge-${p.status || 'pending'}">${p.status || 'pending'}</span></td>
        <td class="text-dim">${p.cron_expression || '-'}</td>
        <td class="text-dim">${time}</td>
        <td class="actions">
          <button class="btn btn-success btn-sm" onclick="runPipeline('${p.id}')">执行</button>
          <button class="btn btn-secondary btn-sm" onclick="openPipelineModal('${p.id}')">编辑</button>
          <button class="btn btn-secondary btn-sm" onclick="showPipelineRuns('${p.id}')">记录</button>
          <button class="btn btn-danger btn-sm" onclick="deletePipeline('${p.id}')">删除</button>
        </td>
      </tr>`;
    }
    html += '</tbody></table>';
    el.innerHTML = html;
  } catch(e) { console.error(e); }
}

async function savePipeline() {
  const name = document.getElementById('pl-name').value;
  const desc = document.getElementById('pl-desc').value;
  const workflowId = document.getElementById('pl-workflow').value;
  const targetConnId = document.getElementById('pl-target-conn').value;
  const targetTable = document.getElementById('pl-target-table').value;
  const batch = parseInt(document.getElementById('pl-batch').value) || 5000;
  const dup = document.getElementById('pl-dup').value;
  const cron = document.getElementById('pl-cron').value;

  if (!name) { alert('请填写数据流名称'); return; }
  if (!targetConnId) { alert('请选择目标数据库连接'); return; }

  // Collect sources
  const sources = [];
  document.querySelectorAll('[id^="pl-src-conn-"]').forEach(el => {
    const idx = el.id.replace('pl-src-conn-', '');
    const codesStr = document.getElementById(`pl-src-codes-${idx}`)?.value || '';
    const codes = codesStr ? codesStr.split(',').map(c => c.trim()).filter(c => c) : [];
    sources.push({
      connection_id: el.value,
      params: {
        codes,
        interval: document.getElementById(`pl-src-interval-${idx}`)?.value || '1min',
        lookback_days: parseInt(document.getElementById(`pl-src-lookback-${idx}`)?.value) || 10,
      }
    });
  });

  // Collect field mappings
  const fieldMappings = [];
  document.querySelectorAll('[id^="pl-map-"]').forEach(row => {
    const id = row.id.replace('pl-map-', '');
    const s = document.getElementById(`pl-src-f-${id}`)?.value;
    const t = document.getElementById(`pl-tgt-f-${id}`)?.value;
    if (s && t) fieldMappings.push({ source_field: s, target_field: t });
  });

  const pipelineJson = {
    sources,
    target: { connection_id: targetConnId, table: targetTable },
    field_mappings: fieldMappings,
    batch_size: batch,
    on_duplicate: dup,
  };
  if (workflowId) pipelineJson.workflow_id = workflowId;

  const editId = document.getElementById('pl-edit-id').value;
  const btn = document.querySelector('#modal-footer .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = '保存中...'; }
  try {
    if (editId) {
      await api(`/api/pipelines/${editId}`, {
        method: 'PUT',
        body: JSON.stringify({ name, description: desc, pipeline_json: pipelineJson, cron_expression: cron || null }),
      });
    } else {
      await api('/api/pipelines/', {
        method: 'POST',
        body: JSON.stringify({ name, description: desc, pipeline_json: pipelineJson, cron_expression: cron || null }),
      });
    }
    closeModal();
    refreshPipelines();
  } catch(e) { alert('保存失败: ' + e.message); }
  finally { if (btn) { btn.disabled = false; btn.textContent = '保存'; } }
}

async function generateAiScript() {
  const prompt = document.getElementById('ai-prompt').value.trim();
  if (!prompt) {
    showAiNotice('请先输入需求描述');
    return;
  }

  const btn = document.getElementById('ai-gen-btn');
  btn.disabled = true;
  btn.textContent = '生成中...';
  document.getElementById('ai-output').value = '';

  try {
    const ctx = {
      source_type: document.getElementById('ai-ctx-source').value,
      target_type: document.getElementById('ai-ctx-target').value,
      table_name: document.getElementById('ai-ctx-table').value,
    };
    const res = await api('/api/ai-script/generate', {
      method: 'POST',
      body: JSON.stringify({ prompt, context: ctx }),
    });

    if (res.success) {
      document.getElementById('ai-output').value = res.script;
      if (res.compliance_notice) {
        showAiNotice(res.compliance_notice);
      }
      // Update remaining counter
      if (res.remaining_today >= 0) {
        const el = document.getElementById('ai-remaining');
        if (el) {
          el.textContent = `今日剩余 ${res.remaining_today}/3`;
          if (res.remaining_today === 0) {
            el.style.background = 'rgba(239,68,68,0.15)';
            el.style.color = '#ef4444';
          }
        }
      }
    } else {
      showAiNotice(res.error || res.compliance_notice || '生成失败');
    }
  } catch(e) {
    showAiNotice('网络错误：' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '生成脚本';
  }
}

  const script = document.getElementById('ai-output').value.trim();
  if (!script) {
    showAiNotice('先生成或输入脚本');
    return;
  }
  const instruction = prompt('输入优化指令（如：增加增量同步、添加数据校验逻辑）：');
  if (!instruction) return;

  const btn = document.getElementById('ai-opt-btn');
  btn.disabled = true;
  btn.textContent = '优化中...';

  try {
    const res = await api('/api/ai-script/optimize', {
      method: 'POST',
      body: JSON.stringify({ script, instruction }),
    });

    if (res.success) {
      document.getElementById('ai-output').value = res.script;
      if (res.compliance_notice) showAiNotice(res.compliance_notice);
    } else {
      showAiNotice(res.error || '优化失败');
    }
  } catch(e) {
    showAiNotice('优化失败：' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '优化脚本';
  }
}

function copyAiScript() {
  const code = document.getElementById('ai-output').value;
  if (!code) return;
  navigator.clipboard.writeText(code).then(() => {
    showAiNotice('已复制到剪贴板');
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = code;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showAiNotice('已复制到剪贴板');
  });
}

function aiQuickPrompt(text) {

function showAiNotice(msg) {

  if (el) {

    setTimeout(() => { el.style.display = 'none'; }, 8000);

}

const wfNodeCategories = {
  '指标计算': [
    { type: 'resample', label: '周期重采样', icon: '📊' },
    { type: 'ma', label: '移动平均', icon: '📈' },
    { type: 'macd', label: 'MACD', icon: '📉' },
    { type: 'rsi', label: 'RSI', icon: '🔢' },
    { type: 'boll', label: '布林带', icon: '🎯' },
  ],
  '数据处理': [
    { type: 'filter', label: '过滤行', icon: '🔍' },
    { type: 'sort', label: '排序', icon: '↕️' },
    { type: 'group_by', label: '分组聚合', icon: '📋' },
    { type: 'column_rename', label: '列重命名', icon: '✏️' },
    { type: 'expression', label: '表达式计算', icon: '🔢' },
    { type: 'condition', label: '条件分支', icon: '🔀' },
    { type: 'custom_python', label: '自定义脚本', icon: '🐍' },
  ],
};

function initWfEditor(existingJson) {
  const area = document.getElementById('wf-canvas-area');
  let paletteHtml = '';
  for (const [cat, nodes] of Object.entries(wfNodeCategories)) {
    paletteHtml += `<div class="wf-palette-section">${cat}</div>`;
    for (const n of nodes) {
      paletteHtml += `<div class="wf-palette-node" data-type="${n.type}" onclick="addWfNode('${n.type}')">
        <span>${n.icon}</span><span>${n.label}</span>
      </div>`;
    }
  }
  area.innerHTML = `<div class="wf-editor">
    <div class="wf-palette">${paletteHtml}</div>
    <div class="wf-canvas" id="wf-canvas"></div>
    <div class="wf-props" id="wf-props"><h3>节点属性</h3><div id="wf-props-content">选择节点查看属性</div></div>
  </div>`;
  window._wfNodes = [];
  window._wfNodesData = {};
  window._wfSelectedId = null;

  if (existingJson && existingJson.nodes) {
    for (const node of existingJson.nodes) {
      addWfNode(node.type, node);
    }
  }
}

function addWfNode(type, data = null) {
  const id = 'wf_' + Math.random().toString(36).slice(2, 8);
  const meta = findNodeMeta(type);
  const label = meta ? meta.label : type;
  const icon = meta ? meta.icon : '⬡';
  const canvas = document.getElementById('wf-canvas');
  if (!canvas) return;
  let x = 60, y = 60;
  const existing = canvas.querySelectorAll('.wf-node');
  if (existing.length) {
    const last = existing[existing.length - 1];
    x = parseInt(last.style.left) + 210;
    y = parseInt(last.style.top);
    if (x > 500) { x = 60; y += 100; }
  }
  const colorMap = {
    kline_resample: '#6366f1', kline_ma: '#22c55e', kline_macd: '#f59e0b',
    kline_rsi: '#38bdf8', kline_boll: '#ec4899',
    filter: '#6366f1', sort: '#22c55e', group_by: '#22c55e',
    column_rename: '#f59e0b', expression: '#f59e0b', condition: '#ec4899', custom_python: '#ec4899',
  };
  const color = colorMap[type] || '#6366f1';
  const defaultParams = getDefaultNodeParams(type);
  const nodeData = data || { id, type, parameters: defaultParams };
  // Migrate params -> parameters for backwards compat
  if (nodeData.params && !nodeData.parameters) {
    nodeData.parameters = nodeData.params;
    delete nodeData.params;
  }
  nodeData.id = id; nodeData.type = type;

  const el = document.createElement('div');
  el.className = 'wf-node'; el.id = id;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  el.innerHTML = `
    <div class="wf-node-header" style="background:${color}20;border-left:3px solid ${color}">
      <span>${icon}</span><span>${label}</span>
    </div>
    <div class="wf-node-body">参数: ${JSON.stringify(nodeData.parameters || {}).substring(0, 30)}...</div>
    <div class="wf-node-port input" title="输入"></div>
    <div class="wf-node-port output" title="输出"></div>
  `;
  el.addEventListener('click', () => selectWfNode(id));
  el.addEventListener('mousedown', (e) => dragWfNode(e, el));
  canvas.appendChild(el);
  window._wfNodes.push(id);
  window._wfNodesData[id] = nodeData;
  selectWfNode(id);
}

function findNodeMeta(type) {
  for (const nodes of Object.values(wfNodeCategories)) {
    for (const n of nodes) if (n.type === type) return n;
  }
  return null;
}

function getDefaultNodeParams(type) {
  return {
    resample: { rule: '30min', time_column: 'dt', group_column: '' },
    ma: { windows: '5,10,20', source_column: 'close', use_ema: false },
    macd: { fast: 12, slow: 26, signal: 9, source_column: 'close' },
    rsi: { window: 14, source_column: 'close' },
    boll: { window: 20, std_mult: 2, source_column: 'close' },
    filter: { column: 'close', operator: '>', value: '0', mode: 'keep' },
    sort: { by: 'dt', ascending: 'true' },
    group_by: { columns: 'code', aggregations: 'close=last,vol=sum' },
    column_rename: { renames: 'code=stock_code,dt=trade_time' },
    expression: { target_column: 'new_col', expression: "df['open'] + df['close']" },
    condition: { condition: "df['close'] > 0", branch: 'true' },
    custom_python: { code: 'def process(df):\n    return df' },
  }[type] || {};
}

let wfDraggingNode = null, wfDragOffset = { x: 0, y: 0 };
function dragWfNode(e, el) {
  if (e.target.classList.contains('wf-node-port')) return;
  wfDraggingNode = el;
  wfDragOffset = { x: e.clientX - el.offsetLeft, y: e.clientY - el.offsetTop };
  document.addEventListener('mousemove', onWfDrag);
  document.addEventListener('mouseup', stopWfDrag);
}
function onWfDrag(e) {
  if (!wfDraggingNode) return;
  const canvas = document.getElementById('wf-canvas');
  const rect = canvas.getBoundingClientRect();
  wfDraggingNode.style.left = Math.max(0, e.clientX - rect.left - wfDragOffset.x + canvas.scrollLeft) + 'px';
  wfDraggingNode.style.top = Math.max(0, e.clientY - rect.top - wfDragOffset.y + canvas.scrollTop) + 'px';
}
function stopWfDrag() {
  document.removeEventListener('mousemove', onWfDrag);
  document.removeEventListener('mouseup', stopWfDrag);
  wfDraggingNode = null;
}

function selectWfNode(id) {
  document.querySelectorAll('.wf-node').forEach(n => n.classList.remove('selected'));
  const el = document.getElementById(id);
  if (el) el.classList.add('selected');
  window._wfSelectedId = id;
  renderWfProps(id);
}

function renderWfProps(id) {
  const data = window._wfNodesData[id];
  if (!data) return;
  const meta = findNodeMeta(data.type);
  const html = `
    <h3>${meta ? meta.label : data.type}</h3>
    <div class="form-group"><label>节点类型</label><input class="form-control" value="${data.type}" readonly></div>
    ${renderPropsFields(data.type, data.parameters || {})}
    <button class="btn btn-danger btn-sm mt-16" onclick="removeWfNode('${id}')">删除节点</button>
  `;
  document.getElementById('wf-props-content').innerHTML = html;
}

function renderPropsFields(type, params) {
  const fields = {
    resample: [
      { id: 'rule', label: '目标周期', type: 'select', opts: ['5min','15min','30min','60min','D','W','M'] },
      { id: 'time_column', label: '时间字段', type: 'text' },
      { id: 'group_column', label: '分组字段', type: 'text' },
    ],
    ma: [
      { id: 'windows', label: '窗口（逗号分隔）', type: 'text' },
      { id: 'source_column', label: '源字段', type: 'text' },
      { id: 'use_ema', label: '使用 EMA', type: 'checkbox' },
    ],
    macd: [
      { id: 'fast', label: '快线周期', type: 'text' },
      { id: 'slow', label: '慢线周期', type: 'text' },
      { id: 'signal', label: '信号线周期', type: 'text' },
      { id: 'source_column', label: '源字段', type: 'text' },
    ],
    rsi: [
      { id: 'window', label: '窗口', type: 'text' },
      { id: 'source_column', label: '源字段', type: 'text' },
    ],
    boll: [
      { id: 'window', label: '窗口', type: 'text' },
      { id: 'std_mult', label: '标准差倍数', type: 'text' },
      { id: 'source_column', label: '源字段', type: 'text' },
    ],
    filter: [
      { id: 'column', label: '字段', type: 'text' },
      { id: 'operator', label: '操作符', type: 'select', opts: ['>','<','>=','<=','==','!=','is_not_null','is_null'] },
      { id: 'value', label: '值', type: 'text' },
      { id: 'mode', label: '模式', type: 'select', opts: ['keep','drop'] },
    ],
    sort: [
      { id: 'by', label: '排序字段', type: 'text' },
      { id: 'ascending', label: '升序', type: 'checkbox' },
    ],
    group_by: [
      { id: 'columns', label: '分组字段', type: 'text' },
      { id: 'aggregations', label: '聚合规则', type: 'text' },
    ],
    column_rename: [
      { id: 'renames', label: '映射(old=new)', type: 'text' },
    ],
    expression: [
      { id: 'target_column', label: '目标列名', type: 'text' },
      { id: 'expression', label: '表达式', type: 'textarea' },
    ],
    condition: [
      { id: 'condition', label: '条件', type: 'text' },
      { id: 'branch', label: '分支', type: 'select', opts: ['true','false'] },
    ],
    custom_python: [
      { id: 'code', label: 'Python代码', type: 'textarea' },
    ],
  };
  const flds = fields[type] || [];
  let html = '';
  for (const f of flds) {
    const val = params[f.id] || '';
    if (f.type === 'select') {
      html += `<div class="form-group"><label>${f.label}</label><select class="form-control" id="wp-${f.id}" onchange="updateWfParam('${f.id}', this.value)">${f.opts.map(o => `<option value="${o}" ${o === val ? 'selected' : ''}>${o}</option>`).join('')}</select></div>`;
    } else if (f.type === 'textarea') {
      html += `<div class="form-group"><label>${f.label}</label><textarea class="form-control" id="wp-${f.id}" onchange="updateWfParam('${f.id}', this.value)">${val}</textarea></div>`;
    } else if (f.type === 'checkbox') {
      html += `<div class="form-group"><label>${f.label}</label><input type="checkbox" id="wp-${f.id}" ${val === 'true' || val === true ? 'checked' : ''} onchange="updateWfParam('${f.id}', this.checked)"></div>`;
    } else {
      html += `<div class="form-group"><label>${f.label}</label><input class="form-control" id="wp-${f.id}" value="${val}" onchange="updateWfParam('${f.id}', this.value)"></div>`;
    }
  }
  return html;
}

function updateWfParam(key, val) {
  const id = window._wfSelectedId;
  if (!id) return;
  const data = window._wfNodesData[id];
  data.parameters = data.parameters || {};
  data.parameters[key] = val;
  const el = document.getElementById(id);
  if (el) {
    el.querySelector('.wf-node-body').textContent = '参数: ' + JSON.stringify(data.parameters).substring(0, 30) + '...';
  }
}

function removeWfNode(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
  delete window._wfNodesData[id];
  window._wfNodes = window._wfNodes.filter(n => n !== id);
  document.getElementById('wf-props-content').innerHTML = '<div class="text-dim">选择节点查看属性</div>';
}

async function loadWorkflowForEdit(id, cb) {
  const wf = await api(`/api/workflows/${id}`);
  cb(wf.name, wf.description, wf.workflow_json);
}

async function saveWorkflow() {
  const name = document.getElementById('wf-name').value;
  const desc = document.getElementById('wf-desc').value;
  if (!name) { alert('请输入工作流名称'); return; }
  const nodes = [];
  for (const id of window._wfNodes || []) {
    const data = window._wfNodesData[id];
    if (data) nodes.push({ id: data.id, type: data.type, parameters: data.parameters || {} });
  }
  const editId = document.getElementById('wf-edit-id').value;
  const btn = document.querySelector('#modal-footer .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = '保存中...'; }
  try {
    if (editId) {
      await api(`/api/workflows/${editId}`, { method: 'PUT', body: JSON.stringify({ name, description: desc, workflow_json: { nodes } }) });
    } else {
      await api('/api/workflows/', { method: 'POST', body: JSON.stringify({ name, description: desc, workflow_json: { nodes } }) });
    }
    closeModal();
    refreshWorkflows();
  } catch(e) { alert('保存失败: ' + e.message); }
  finally { if (btn) { btn.disabled = false; btn.textContent = '保存'; } }
}

async function previewWorkflow(id) {
  try {
    const res = await api(`/api/workflows/${id}/preview`);
    if (res.error) { alert('预览失败: ' + res.error); return; }
    openModal('工作流预览', `
      <div class="text-dim mb-16">输出行数: ${res.rows} | 列: ${(res.columns || []).join(', ')}</div>
      <div style="overflow:auto;max-height:400px">
        <table class="data-table">
          <thead><tr>${(res.columns || []).map(c => `<th>${c}</th>`).join('')}</tr></thead>
          <tbody>${(res.preview || []).map(row => `<tr>${(res.columns || []).map(c => `<td>${row[c] ?? ''}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>
      ${res.timings ? `<div class="text-dim mt-8">节点耗时: ${JSON.stringify(res.timings)}</div>` : ''}
    `, `<button class="btn btn-secondary" onclick="closeModal()">关闭</button>`);
  } catch(e) { alert('预览失败: ' + e.message); }
}

async function deleteWorkflow(id) {
  if (!confirm('确定删除此工作流？')) return;
  try {
    await api(`/api/workflows/${id}`, { method: 'DELETE' });
    refreshWorkflows();
  } catch(e) { alert('删除失败: ' + e.message); }
}

// Connect WebSocket for real-time updates
// ─── Theme Toggle ───

function getTheme() {
  return localStorage.getItem('theme') || 'dark';
}

function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  const iconEl = document.getElementById('theme-icon');
  const labelEl = document.getElementById('theme-label');
  if (iconEl) iconEl.textContent = theme === 'dark' ? '🌙' : '☀️';
  if (labelEl) labelEl.textContent = theme === 'dark' ? '切换亮色' : '切换深色';
}

function toggleTheme() {
  setTheme(getTheme() === 'dark' ? 'light' : 'dark');
}

// Apply theme on load
setTheme(getTheme());

connectWS();

// Start with overview
navigate('overview');
initQuickStartGuide();
</script>
